mounts:
- location: "~"
  writable: true
ssh:
  loadDotSSHPubKeys: false
firmware:
  legacyBIOS: false
containerd:
  system: false
  user: false
portForwards:
- guestPort: 6443
  hostIP: 127.0.0.1
  hostPort: 6443
- guestIPMustBeZero: true
  guestPortRange:
  - 1
  - 65535
  hostIP: 0.0.0.0
  hostPortRange:
  - 0
  - 0
- guestPortRange:
  - 0
  - 0
  guestSocket: /var/run/docker.sock
  hostPortRange:
  - 0
  - 0
  hostSocket: "{{.Param.HOST_DOCKER_SOCKET}}"
- guestPortRange:
  - 0
  - 0
  guestSocket: /run/k3s/containerd/containerd.sock
  hostPortRange:
  - 0
  - 0
  hostSocket: "{{.Param.HOST_CONTAINERD_SOCKET}}"
provision:
# Write runtime parameters as a systemd EnvironmentFile. Using mode:data lets
# Lima's Go template engine handle quoting via printf "%q", which produces
# double-quoted strings compatible with systemd's EnvironmentFile parser.
# Lima's boot script creates parent directories automatically.
- mode: data
  path: /etc/sysconfig/rancher-desktop
  content: |
    CONTAINER_ENGINE={{printf "%q" .Param.CONTAINER_ENGINE}}
    HOST_DOCKER_SOCKET={{printf "%q" .Param.HOST_DOCKER_SOCKET}}
    HOST_HOME_GUEST={{printf "%q" .Param.HOST_HOME_GUEST}}
    KUBERNETES_ENABLED={{.Param.KUBERNETES_ENABLED}}
    KUBERNETES_VERSION={{.Param.KUBERNETES_VERSION}}
    KUBERNETES_PORT={{.Param.KUBERNETES_PORT}}
    VM_SWITCH_LOG={{printf "%q" .Param.VM_SWITCH_LOG}}
    NETWORK_SETUP_EXTRA_ARGS={{printf "%q" .Param.NETWORK_SETUP_EXTRA_ARGS}}
# Stream guest journals and lima-init.log (which die with the VM) to the host
# log dir so CI artifacts carry them. Empty GUEST_LOG_DIR (no RDD_KEEP_LOGS)
# makes this a no-op. The capture units are transient, restarted each boot.
- mode: system
  script: |
    #!/bin/bash

    set -o errexit -o nounset -o pipefail -o xtrace

    if [[ -z $PARAM_GUEST_LOG_DIR ]]; then
        exit 0
    fi

    units=(
      buildkitd
      containerd
      docker
      k3s
      lima-guestagent
      lima-init
      network-setup
      rancher-desktop-guest-agent
      rd-init
      rdd-guest
      wsl-proxy
    )
    # On WSL, all runs of a distro share the kernel's boot ID, and
    # journalctl --follow shows the whole boot, so a new capture would print
    # the earlier runs again. When systemd stops the capture, journalctl
    # writes the cursor of the last entry that it printed to the cursor file,
    # and the next capture starts after that entry.
    for unit in "${units[@]}"; do
        if ! systemctl is-active --quiet "rdd-journal-capture-${unit}.service"; then
            systemd-run --collect --unit="rdd-journal-capture-${unit}" /bin/sh -c \
                "journalctl --follow --no-tail --output=short-iso --unit=${unit}.service --cursor-file=\"$PARAM_GUEST_LOG_DIR/guest-${unit}.cursor\" >> \"$PARAM_GUEST_LOG_DIR/guest-${unit}.log\""
        fi
    done
    if ! systemctl is-active --quiet rdd-lima-init-capture.service; then
        systemd-run --collect --unit=rdd-lima-init-capture /bin/sh -c \
            "tail -c +0 -F /var/log/lima-init.log >> \"$PARAM_GUEST_LOG_DIR/lima-init.log\""
    fi
- mode: system
  script: |
    #!/bin/bash

    set -o errexit -o nounset -o pipefail -o xtrace

    # Restart rancher-desktop.target on exit, even if a step below fails. The
    # container engine belongs to this target but does not depend on
    # Kubernetes, so a failed k3s install must not leave it stopped. --no-block
    # returns immediately; the kubeconfig probe below absorbs k3s startup time.
    trap 'systemctl start --no-block rancher-desktop.target' EXIT

    systemctl stop rancher-desktop.target

    # Enable the requested container engine and disable the other.
    # containerd.service has a Conflicts=docker, so we must not start both.
    CONTAINERD_ACTION=$([[ $PARAM_CONTAINER_ENGINE = containerd ]] && echo enable || echo disable)
    DOCKER_ACTION=$([[ $PARAM_CONTAINER_ENGINE = moby ]] && echo enable || echo disable)
    systemctl "$CONTAINERD_ACTION" containerd.service buildkitd.service
    systemctl "$DOCKER_ACTION" docker.service docker.socket

    if [[ $PARAM_KUBERNETES_ENABLED == "true" ]]; then
        export INSTALL_K3S_VERSION="v${PARAM_KUBERNETES_VERSION}+k3s1"
        INSTALLED_VERSION=""
        # awk must read to EOF; `{print; exit}` closes the pipe while k3s
        # is still writing, and the SIGPIPE propagates via pipefail + errexit.
        [[ -x /usr/local/bin/k3s ]] && INSTALLED_VERSION=$(/usr/local/bin/k3s --version | awk 'NR==1{print $3}')
        if [[ $INSTALL_K3S_VERSION != "${INSTALLED_VERSION}" ]]; then
            # Don't enable k3s at install time; add it as a want of rancher-desktop.target instead.
            export INSTALL_K3S_SKIP_ENABLE=true
            # Before reinstalling, remove any existing k3s want; otherwise a
            # failed upgrade leaves rancher-desktop.target still wanting the
            # previous k3s version. daemon-reload rebuilds systemd's in-memory
            # dependency tree from disk so the EXIT trap's restart honors the
            # removal even on the failure path, where add-wants below (the only
            # other reload) never runs. The want is re-added on success below.
            rm -f /etc/systemd/system/rancher-desktop.target.wants/k3s.service
            systemctl daemon-reload
            (
                export PATH=/usr/local/sbin:/usr/local/bin:/usr/bin:/sbin:/bin
                # The interface can have an address before the host-switch
                # network is routable, so the install can fail right after a
                # restart. Retry the whole download-and-install until it
                # succeeds; the curl timeouts bound the installer-script fetch
                # so a black-holed network fails fast instead of hanging that
                # step. --show-error surfaces the error without --silent's
                # progress meter spamming the log.
                attempt=0
                until curl --fail --silent --show-error --location --connect-timeout 10 --max-time 60 https://get.k3s.io | sh -; do
                    attempt=$((attempt + 1))
                    if (( attempt >= 30 )); then
                        echo "k3s install failed after ${attempt} attempts" >&2
                        # Fail provisioning so Lima records the error; the EXIT
                        # trap still restarts the engine, which does not need k3s.
                        exit 1
                    fi
                    sleep 2
                done
            )
            systemctl add-wants rancher-desktop.target k3s.service
        fi

        if [[ $PARAM_CONTAINER_ENGINE == "containerd" ]]; then
            echo "K3S_CONTAINER_ENGINE_OPTIONS=--container-runtime-endpoint /run/k3s/containerd/containerd.sock" \
                >/etc/systemd/system/k3s.service.env
        else
            echo "K3S_CONTAINER_ENGINE_OPTIONS=--docker" >/etc/systemd/system/k3s.service.env
        fi

        # Remove stale kubeconfig so k3s regenerates it on start.
        rm -f /etc/rancher/k3s/k3s.yaml
    fi

    # rancher-desktop.target is restarted by the EXIT trap above.

# Install or remove the AMD ROCm-on-WSL bridge library (librocdxg.so) based on
# GPU passthrough state. No prebuilt binary is published and RDD does not
# redistribute one, so RDD stages the pinned build inputs on the host into
# GPU_LIB_SOURCE (under the mounted host home) and this step builds the library
# in a throwaway container the first time, caching it next to the inputs. A
# library supplied through spec.gpu.source is installed as is. The step is
# idempotent and runs on every boot; when disabled it removes the library so the
# toggle is symmetric. Failures warn and never fail provisioning.
- mode: system
  script: |
    #!/bin/bash

    set -o errexit -o nounset -o pipefail -o xtrace

    LIB_DST=/opt/rocm/lib/librocdxg.so

    if [[ $PARAM_GPU_ENABLED != "true" ]]; then
        rm -f "$LIB_DST"
        exit 0
    fi

    SRC=$PARAM_GPU_LIB_SOURCE
    LIB=$SRC/librocdxg.so

    if [[ ! -f $LIB && -f $SRC/src/build-id ]]; then
        if systemctl is-enabled --quiet docker.service; then
            ENGINE=docker
        else
            ENGINE=nerdctl
        fi
        # The engine restarts asynchronously at the end of the previous step.
        for _ in $(seq 60); do
            "$ENGINE" info >/dev/null 2>&1 && break
            sleep 2
        done
        if "$ENGINE" run --rm \
                -v "$SRC/src:/in:ro" -v "$SRC:/out" \
                "$(cat "$SRC/src/image")" bash /in/build.sh; then
            cp "$SRC/src/build-id" "$SRC/.build-id"
        else
            echo "Building librocdxg.so failed; GPU passthrough unavailable." >&2
            rm -f "$LIB"
            exit 0
        fi
    fi

    if [[ ! -f $LIB ]]; then
        echo "GPU passthrough enabled but no librocdxg.so under $SRC;" \
             "skipping install." >&2
        exit 0
    fi

    install -D -m 0755 "$LIB" "$LIB_DST"

probes:
- description: Write k3s kubeconfig to instance config path
  script: |
    #!/bin/bash

    # This script runs in USER mode.

    set -o errexit -o nounset -o pipefail -o xtrace

    if [[ $PARAM_KUBERNETES_ENABLED != "true" ]]; then
        exit 0
    fi

    K3S_YAML=/etc/rancher/k3s/k3s.yaml
    for _ in $(seq 300); do
        if [[ -e $K3S_YAML ]]; then
            sleep 1
            # Copy the raw k3s kubeconfig to the host instance config path.
            # The kubernetes controller on the host reads this file to probe
            # the API server and manage the user's ~/.kube/config context.
            mkdir -p "$(dirname "$PARAM_HOST_INSTANCE_CONFIG")"
            sudo cp "$K3S_YAML" "$PARAM_HOST_INSTANCE_CONFIG"
            exit 0
        fi
        sleep 1
    done
    exit 1
hostResolver:
  hosts:
    host.docker.internal: host.lima.internal
    host.rancher-desktop.internal: host.lima.internal
    lima-rancher-desktop: lima-0
vmOpts:
  vz:
    rosetta:
      enabled: false
      binfmt: false

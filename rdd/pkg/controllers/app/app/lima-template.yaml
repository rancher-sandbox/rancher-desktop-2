mounts:
- location: "~"
  writable: true
ssh:
  loadDotSSHPubKeys: false
firmware:
  legacyBIOS: false
containerd:
  system: false
  user: false
portForwards:
- guestPort: 6443
  hostIP: 127.0.0.1
  hostPort: 6443
- guestIPMustBeZero: true
  guestPortRange:
  - 1
  - 65535
  hostIP: 0.0.0.0
  hostPortRange:
  - 0
  - 0
- guestPortRange:
  - 0
  - 0
  guestSocket: /var/run/docker.sock
  hostPortRange:
  - 0
  - 0
  hostSocket: "{{.Param.HOST_DOCKER_SOCKET}}"
- guestPortRange:
  - 0
  - 0
  guestSocket: /run/k3s/containerd/containerd.sock
  hostPortRange:
  - 0
  - 0
  hostSocket: "{{.Param.HOST_CONTAINERD_SOCKET}}"
provision:
# Write runtime parameters as a systemd EnvironmentFile. Using mode:data lets
# Lima's Go template engine handle quoting via printf "%q", which produces
# double-quoted strings compatible with systemd's EnvironmentFile parser.
# Lima's boot script creates parent directories automatically.
- mode: data
  path: /etc/sysconfig/rancher-desktop
  content: |
    CONTAINER_ENGINE={{printf "%q" .Param.CONTAINER_ENGINE}}
    HOST_DOCKER_SOCKET={{printf "%q" .Param.HOST_DOCKER_SOCKET}}
    HOST_HOME_GUEST={{printf "%q" .Param.HOST_HOME_GUEST}}
    KUBERNETES_ENABLED={{.Param.KUBERNETES_ENABLED}}
    KUBERNETES_VERSION={{.Param.KUBERNETES_VERSION}}
    KUBERNETES_PORT={{.Param.KUBERNETES_PORT}}
    VM_SWITCH_LOG={{printf "%q" .Param.VM_SWITCH_LOG}}
    NETWORK_SETUP_EXTRA_ARGS={{printf "%q" .Param.NETWORK_SETUP_EXTRA_ARGS}}
# Stream guest journals and lima-init.log (which die with the VM) to the host
# log dir so CI artifacts include them. Empty GUEST_LOG_DIR (no RDD_KEEP_LOGS)
# makes this a no-op. The capture units are transient, restarted each boot.
# The capture stays out of rancher-desktop-provision, whose WSL drop-in
# requires network setup, so it also runs when that fails.
- mode: system
  script: |
    #!/bin/bash

    set -o errexit -o nounset -o pipefail -o xtrace

    if [[ -z $PARAM_GUEST_LOG_DIR ]]; then
        exit 0
    fi

    units=(
      buildkitd
      containerd
      docker
      k3s
      lima-guestagent
      lima-init
      network-setup
      rancher-desktop-guest-agent
      rancher-desktop-provision
      rd-init
      rdd-guest
      wsl-proxy
    )
    for unit in "${units[@]}"; do
        if ! systemctl is-active --quiet "rdd-journal-capture-${unit}.service"; then
            systemd-run --collect --unit="rdd-journal-capture-${unit}" /bin/sh -c \
                "journalctl --follow --no-tail --output=short-iso --unit=${unit}.service >> \"$PARAM_GUEST_LOG_DIR/guest-${unit}.log\""
        fi
    done
    if ! systemctl is-active --quiet rdd-lima-init-capture.service; then
        systemd-run --collect --unit=rdd-lima-init-capture /bin/sh -c \
            "tail -c +0 -F /var/log/lima-init.log >> \"$PARAM_GUEST_LOG_DIR/lima-init.log\""
    fi
# Start rancher-desktop-provision.service from the distro overlay. On WSL this
# script runs through wsl.exe in the root namespace, where DNS doesn't
# resolve, so the unit's drop-in runs the steps inside RD's network namespace.
# The start blocks, so Lima sees the VM as ready only after provisioning. A
# failed script makes Lima stop the VM, and a failed k3s install must not stop
# the container engine, so the script ignores the unit's exit status.
- mode: system
  script: |
    #!/bin/bash

    set -o errexit -o nounset -o pipefail -o xtrace

    systemctl start rancher-desktop-provision.service || true

probes:
- description: Write k3s kubeconfig to instance config path
  script: |
    #!/bin/bash

    # This script runs in USER mode.

    set -o errexit -o nounset -o pipefail -o xtrace

    if [[ $PARAM_KUBERNETES_ENABLED != "true" ]]; then
        exit 0
    fi

    K3S_YAML=/etc/rancher/k3s/k3s.yaml
    for _ in $(seq 300); do
        if [[ -e $K3S_YAML ]]; then
            sleep 1
            # Copy the raw k3s kubeconfig to the host instance config path.
            # The kubernetes controller on the host reads this file to probe
            # the API server and manage the user's ~/.kube/config context.
            mkdir -p "$(dirname "$PARAM_HOST_INSTANCE_CONFIG")"
            sudo cp "$K3S_YAML" "$PARAM_HOST_INSTANCE_CONFIG"
            exit 0
        fi
        sleep 1
    done
    exit 1
hostResolver:
  hosts:
    host.docker.internal: host.lima.internal
    host.rancher-desktop.internal: host.lima.internal
    lima-rancher-desktop: lima-0
vmOpts:
  vz:
    rosetta:
      enabled: false
      binfmt: false

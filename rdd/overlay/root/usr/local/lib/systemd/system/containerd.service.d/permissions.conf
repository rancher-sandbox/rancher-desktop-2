# Lima forwards guest sockets over SSH as an unprivileged user, but containerd
# creates its socket and the /run/k3s directories root-only. Grant access like
# docker.service.d/permissions.conf does for docker.sock. The `-` prefixes keep
# a failed chmod from taking containerd down with it.

[Service]
ExecStartPost=-chmod a+x /run/k3s /run/k3s/containerd
ExecStartPost=-chmod a+rw /run/k3s/containerd/containerd.sock

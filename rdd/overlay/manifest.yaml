# The Rancher Desktop assets distro-overlay merges into the pristine openSUSE
# distro. `make build-rdd` applies this manifest with --source overlay, so a
# source path is relative to this directory.
#
# download-guest-deps stages mkcert and the nerdctl-full tarball under build/,
# and the Makefile unpacks the three binaries we use out of that tarball.
#
# Everything goes under /usr/local, because the raw image backend cannot add
# an entry to an htree-indexed directory such as /usr/bin.
entries:
- path: /usr/local/bin/nerdctl
  source: nerdctl
  mode: "0755"
- path: /usr/local/libexec/nerdctl/nerdctl
  source: build/nerdctl/bin/nerdctl
  mode: "0755"
- path: /usr/local/bin/buildctl
  source: build/nerdctl/bin/buildctl
  mode: "0755"
- path: /usr/local/bin/buildkitd
  source: build/nerdctl/bin/buildkitd
  mode: "0755"
- path: /usr/local/bin/mkcert
  source: build/mkcert
  mode: "0755"

# Guest binaries built from the sources under src/ (rancher-desktop-2#806),
# which used to live in rancher-desktop-opensuse and were baked into the image
# by its Dockerfile. The Makefile cross-compiles them for the distro's
# architecture into build/guest/.
- path: /usr/local/bin/rancher-desktop-guest-agent
  source: build/guest/rancher-desktop-guest-agent
  mode: "0755"
- path: /usr/local/bin/network-setup
  source: build/guest/network-setup
  mode: "0755"
- path: /usr/local/bin/vm-switch
  source: build/guest/vm-switch
  mode: "0755"
- path: /usr/local/bin/wsl-proxy
  source: build/guest/wsl-proxy
  mode: "0755"
- path: /usr/local/bin/rd-init
  source: build/guest/rd-init
  mode: "0755"
- path: /usr/local/bin/rdd-guest
  source: build/guest/rdd-guest
  mode: "0755"

# ---------------------------------------------------------------------------
# openSUSE guest assets, moved out of the distro's `root/` tree and `config.sh`
# (rancher-desktop-2#805). The overlay is now the only source of these files, so
# the coverage check in manifest_coverage_test.go asserts every path here.
#
# Modes and per-profile scoping transcribe what config.sh used to do at build:
# its chmod block set the modes below; its lima branch deleted every
# `*/network-namespace.conf` (so those are wsl-only) and its wsl branch deleted
# lima-init.service.d/requires-{cidata,rd-init}.conf (so those are lima-only).
# ---------------------------------------------------------------------------

# /etc/sudoers.d must be 0750 (config.sh chmod'd it); its files default to 0644.
- path: /etc/sudoers.d
  type: dir
  mode: "0750"

# Systemd units
- path: /usr/local/lib/systemd/system/buildkitd.service
  source: root/usr/local/lib/systemd/system/buildkitd.service
- path: /usr/local/lib/systemd/system/buildkitd.socket
  source: root/usr/local/lib/systemd/system/buildkitd.socket
- path: /usr/local/lib/systemd/system/journal-to-console.service
  source: root/usr/local/lib/systemd/system/journal-to-console.service
- path: /usr/local/lib/systemd/system/lima-init.service
  source: root/usr/local/lib/systemd/system/lima-init.service
- path: '/usr/local/lib/systemd/system/mnt-lima\x2dcidata.mount'
  source: root/usr/local/lib/systemd/system/mnt-lima-cidata.mount
- path: /usr/local/lib/systemd/system/network-namespace.service
  source: root/usr/local/lib/systemd/system/network-namespace.service
- path: /usr/local/lib/systemd/system/network-setup.service
  source: root/usr/local/lib/systemd/system/network-setup.service
- path: /usr/local/lib/systemd/system/rancher-desktop-guest-agent.service
  source: root/usr/local/lib/systemd/system/rancher-desktop-guest-agent.service
- path: /usr/local/lib/systemd/system/rancher-desktop.target
  source: root/usr/local/lib/systemd/system/rancher-desktop.target
- path: /usr/local/lib/systemd/system/rd-init.service
  source: root/usr/local/lib/systemd/system/rd-init.service
- path: /usr/local/lib/systemd/system/rdd-guest.service
  source: root/usr/local/lib/systemd/system/rdd-guest.service
- path: /usr/local/lib/systemd/system/wsl-proxy.service
  source: root/usr/local/lib/systemd/system/wsl-proxy.service

# Systemd drop-ins
- path: /usr/local/lib/systemd/system/buildkitd.service.d/network-namespace.conf
  source: root/usr/local/lib/systemd/system/buildkitd.service.d/network-namespace.conf

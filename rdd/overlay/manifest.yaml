# The Rancher Desktop assets distro-overlay merges into the pristine openSUSE
# distro. `make build-rdd` applies this manifest with --source overlay, so a
# source path is relative to this directory.
#
# download-guest-deps stages mkcert and the nerdctl-full tarball under build/,
# and the Makefile unpacks the three binaries we use out of that tarball.
#
# Everything goes under /usr/local, because the raw image backend cannot add
# an entry to an htree-indexed directory such as /usr/bin.
entries:
- path: /usr/local/bin/nerdctl
  source: nerdctl
  mode: "0755"
- path: /usr/local/libexec/nerdctl/nerdctl
  source: build/nerdctl/bin/nerdctl
  mode: "0755"
- path: /usr/local/bin/buildctl
  source: build/nerdctl/bin/buildctl
  mode: "0755"
- path: /usr/local/bin/buildkitd
  source: build/nerdctl/bin/buildkitd
  mode: "0755"
- path: /usr/local/bin/mkcert
  source: build/mkcert
  mode: "0755"

# Guest binaries built from the sources under src/. The Makefile
# cross-compiles them for the distro's architecture into build/guest/.
- path: /usr/local/bin/rancher-desktop-guest-agent
  source: build/guest/rancher-desktop-guest-agent
  mode: "0755"
- path: /usr/local/bin/network-setup
  source: build/guest/network-setup
  mode: "0755"
- path: /usr/local/bin/vm-switch
  source: build/guest/vm-switch
  mode: "0755"
- path: /usr/local/bin/wsl-proxy
  source: build/guest/wsl-proxy
  mode: "0755"
# Only rd-init.service runs this binary, and only the raw profile installs that
# unit.
- path: /usr/local/bin/rd-init
  source: build/guest/rd-init
  mode: "0755"
  profiles: [raw]
- path: /usr/local/bin/rdd-guest
  source: build/guest/rdd-guest
  mode: "0755"

# The provision script and its unit, which rdd's Lima template starts.
- path: /usr/local/libexec/rancher-desktop/provision.sh
  source: root/usr/local/libexec/rancher-desktop/provision.sh
  mode: "0755"
- path: /usr/local/lib/systemd/system/rancher-desktop-provision.service
  source: root/usr/local/lib/systemd/system/rancher-desktop-provision.service
- path: /usr/local/lib/systemd/system/rancher-desktop-provision.service.d/network-namespace.conf
  source: root/usr/local/lib/systemd/system/rancher-desktop-provision.service.d/network-namespace.conf
  profiles: [wsl]

# ---------------------------------------------------------------------------
# openSUSE guest configuration
#
# On WSL, network-namespace.service creates a separate network namespace for
# RD's services. Each network-namespace.conf drop-in starts its service in that
# namespace through wsl-exec, so the drop-ins are wsl-only.
# ---------------------------------------------------------------------------

# Give /etc/sudoers.d the 0750 mode that openSUSE's sudo package uses. The
# files in it get the manifest's default mode, 0644.
- path: /etc/sudoers.d
  type: dir
  mode: "0750"

# Systemd units
- path: /usr/local/lib/systemd/system/buildkitd.service
  source: root/usr/local/lib/systemd/system/buildkitd.service
- path: /usr/local/lib/systemd/system/buildkitd.socket
  source: root/usr/local/lib/systemd/system/buildkitd.socket
# journal-to-console.service mirrors the journal to the VM's serial console, and
# Lima saves that console's output as a boot log. Lima's WSL2 driver doesn't
# keep a console log, so only the raw profile needs this unit.
- path: /usr/local/lib/systemd/system/journal-to-console.service
  source: root/usr/local/lib/systemd/system/journal-to-console.service
  profiles: [raw]
# lima-init.service runs Lima's boot.sh. On WSL, Lima's WSL2 driver runs
# boot.sh itself, through wsl.exe, so only the raw profile needs this unit.
- path: /usr/local/lib/systemd/system/lima-init.service
  source: root/usr/local/lib/systemd/system/lima-init.service
  profiles: [raw]
# mnt-lima\x2dcidata.mount mounts Lima's cidata disk. On WSL, Lima's WSL2
# driver doesn't attach that disk. It points boot.sh at the instance's cidata
# directory on the host instead, so only the raw profile needs this unit.
- path: '/usr/local/lib/systemd/system/mnt-lima\x2dcidata.mount'
  source: root/usr/local/lib/systemd/system/mnt-lima-cidata.mount
  profiles: [raw]
- path: /usr/local/lib/systemd/system/network-namespace.service
  source: root/usr/local/lib/systemd/system/network-namespace.service
- path: /usr/local/lib/systemd/system/network-setup.service
  source: root/usr/local/lib/systemd/system/network-setup.service
- path: /usr/local/lib/systemd/system/rancher-desktop-guest-agent.service
  source: root/usr/local/lib/systemd/system/rancher-desktop-guest-agent.service
- path: /usr/local/lib/systemd/system/rancher-desktop.target
  source: root/usr/local/lib/systemd/system/rancher-desktop.target
# rd-init.service applies the cloud-init data on Lima's cidata disk. Lima's
# WSL2 driver doesn't attach that disk, so only the raw profile needs this
# unit.
- path: /usr/local/lib/systemd/system/rd-init.service
  source: root/usr/local/lib/systemd/system/rd-init.service
  profiles: [raw]
- path: /usr/local/lib/systemd/system/rdd-guest.service
  source: root/usr/local/lib/systemd/system/rdd-guest.service
- path: /usr/local/lib/systemd/system/wsl-proxy.service
  source: root/usr/local/lib/systemd/system/wsl-proxy.service

# Systemd drop-ins
- path: /usr/local/lib/systemd/system/buildkitd.service.d/network-namespace.conf
  source: root/usr/local/lib/systemd/system/buildkitd.service.d/network-namespace.conf
  profiles: [wsl]
- path: /usr/local/lib/systemd/system/console-getty.service.d/exclude-containers.conf
  source: root/usr/local/lib/systemd/system/console-getty.service.d/exclude-containers.conf
- path: /usr/local/lib/systemd/system/containerd.service.d/allowed-images.conf
  source: root/usr/local/lib/systemd/system/containerd.service.d/allowed-images.conf
- path: /usr/local/lib/systemd/system/containerd.service.d/conditional.conf
  source: root/usr/local/lib/systemd/system/containerd.service.d/conditional.conf
- path: /usr/local/lib/systemd/system/containerd.service.d/environment.conf
  source: root/usr/local/lib/systemd/system/containerd.service.d/environment.conf
- path: /usr/local/lib/systemd/system/containerd.service.d/network-namespace.conf
  source: root/usr/local/lib/systemd/system/containerd.service.d/network-namespace.conf
  profiles: [wsl]
- path: /usr/local/lib/systemd/system/containerd.service.d/permissions.conf
  source: root/usr/local/lib/systemd/system/containerd.service.d/permissions.conf
- path: /usr/local/lib/systemd/system/containerd.service.d/target.conf
  source: root/usr/local/lib/systemd/system/containerd.service.d/target.conf
- path: /usr/local/lib/systemd/system/docker.service.d/allowed-images.conf
  source: root/usr/local/lib/systemd/system/docker.service.d/allowed-images.conf
- path: /usr/local/lib/systemd/system/docker.service.d/conditional.conf
  source: root/usr/local/lib/systemd/system/docker.service.d/conditional.conf
- path: /usr/local/lib/systemd/system/docker.service.d/environment.conf
  source: root/usr/local/lib/systemd/system/docker.service.d/environment.conf
- path: /usr/local/lib/systemd/system/docker.service.d/network-namespace.conf
  source: root/usr/local/lib/systemd/system/docker.service.d/network-namespace.conf
  profiles: [wsl]
- path: /usr/local/lib/systemd/system/docker.service.d/permissions.conf
  source: root/usr/local/lib/systemd/system/docker.service.d/permissions.conf
- path: /usr/local/lib/systemd/system/docker.service.d/target.conf
  source: root/usr/local/lib/systemd/system/docker.service.d/target.conf
- path: /usr/local/lib/systemd/system/docker.socket.d/target.conf
  source: root/usr/local/lib/systemd/system/docker.socket.d/target.conf
- path: /usr/local/lib/systemd/system/getty@.service.d/disable-on-wsl.conf
  source: root/usr/local/lib/systemd/system/getty@.service.d/disable-on-wsl.conf
- path: /usr/local/lib/systemd/system/k3s.service.d/command-override.conf
  source: root/usr/local/lib/systemd/system/k3s.service.d/command-override.conf
- path: /usr/local/lib/systemd/system/k3s.service.d/conditional.conf
  source: root/usr/local/lib/systemd/system/k3s.service.d/conditional.conf
- path: /usr/local/lib/systemd/system/k3s.service.d/environment.conf
  source: root/usr/local/lib/systemd/system/k3s.service.d/environment.conf
- path: /usr/local/lib/systemd/system/k3s.service.d/network-namespace.conf
  source: root/usr/local/lib/systemd/system/k3s.service.d/network-namespace.conf
  profiles: [wsl]
- path: /usr/local/lib/systemd/system/k3s.service.d/target.conf
  source: root/usr/local/lib/systemd/system/k3s.service.d/target.conf
- path: /usr/local/lib/systemd/system/lima-init.service.d/requires-cidata.conf
  source: root/usr/local/lib/systemd/system/lima-init.service.d/requires-cidata.conf
  profiles: [raw]
- path: /usr/local/lib/systemd/system/lima-init.service.d/requires-rd-init.conf
  source: root/usr/local/lib/systemd/system/lima-init.service.d/requires-rd-init.conf
  profiles: [raw]
- path: /usr/local/lib/systemd/system/openresty.service.d/ca-certs.conf
  source: root/usr/local/lib/systemd/system/openresty.service.d/ca-certs.conf
- path: /usr/local/lib/systemd/system/openresty.service.d/network-namespace.conf
  source: root/usr/local/lib/systemd/system/openresty.service.d/network-namespace.conf
  profiles: [wsl]
- path: /usr/local/lib/systemd/system/openresty.service.d/target.conf
  source: root/usr/local/lib/systemd/system/openresty.service.d/target.conf

# Config files and scripts
- path: /etc/cni/net.d/10-flannel.conflist
  source: root/etc/cni/net.d/10-flannel.conflist
- path: /etc/containerd/config.toml
  source: root/etc/containerd/config.toml
- path: /etc/sudoers.d/10-path-local
  source: root/etc/sudoers.d/10-path-local
- path: /etc/sudoers.d/20-wsl-everyone
  source: root/etc/sudoers.d/20-wsl-everyone
- path: /etc/wsl.conf
  source: root/etc/wsl.conf
- path: /usr/local/bin/wsl-exec
  source: root/usr/local/bin/wsl-exec
  mode: "0755"
- path: /usr/local/libexec/rancher-desktop/setup-namespace.sh
  source: root/usr/local/libexec/rancher-desktop/setup-namespace.sh
  mode: "0755"
- path: /usr/local/libexec/udhcpc/rancher-desktop.script
  source: root/usr/local/libexec/udhcpc/rancher-desktop.script
  mode: "0755"

# WSL manages /tmp itself, so it needs an empty tmpfiles.d stub to
# suppress the distro default; a zero-byte file at build time.
- path: /usr/local/lib/tmpfiles.d/fs-tmp.conf
  source: root/usr/local/lib/tmpfiles.d/fs-tmp.conf
  profiles: [wsl]

# Enable units at boot. A symlink in <target>.wants/ makes the target want the
# unit, so systemd starts the unit whenever it starts the target. These are the
# links that `systemctl enable` creates from each unit's [Install] section, so
# `systemctl disable` can still remove them. buildkitd, containerd and docker
# don't need links here, because provision.sh enables the selected engine on
# every boot.
- path: /etc/systemd/system/multi-user.target.wants/lima-init.service
  type: symlink
  target: /usr/local/lib/systemd/system/lima-init.service
  profiles: [raw]
- path: /etc/systemd/system/multi-user.target.wants/rd-init.service
  type: symlink
  target: /usr/local/lib/systemd/system/rd-init.service
  profiles: [raw]
- path: /etc/systemd/system/sysinit.target.wants/journal-to-console.service
  type: symlink
  target: /usr/local/lib/systemd/system/journal-to-console.service
  profiles: [raw]
# Start WSL networking at boot, alongside Lima's boot.
- path: /etc/systemd/system/multi-user.target.wants/network-setup.service
  type: symlink
  target: /usr/local/lib/systemd/system/network-setup.service
  profiles: [wsl]
- path: /etc/systemd/system/rancher-desktop.target.wants/network-setup.service
  type: symlink
  target: /usr/local/lib/systemd/system/network-setup.service
  profiles: [wsl]
- path: /etc/systemd/system/rancher-desktop.target.wants/rancher-desktop-guest-agent.service
  type: symlink
  target: /usr/local/lib/systemd/system/rancher-desktop-guest-agent.service
  profiles: [wsl]
- path: /etc/systemd/system/rancher-desktop.target.wants/wsl-proxy.service
  type: symlink
  target: /usr/local/lib/systemd/system/wsl-proxy.service
  profiles: [wsl]
- path: /etc/systemd/system/rancher-desktop.target.wants/rdd-guest.service
  type: symlink
  target: /usr/local/lib/systemd/system/rdd-guest.service
  profiles: [wsl]

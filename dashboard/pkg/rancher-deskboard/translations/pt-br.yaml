  typeDescriptions:
    apps.daemonset: DaemonSets executam exatamente um pod em cada nó elegível. Quando novos nós são adicionados ao cluster, os DaemonSets são implantados neles automaticamente. Recomendado para cargas de trabalho de todo o sistema ou escaláveis verticalmente que nunca precisam de mais de um pod por nó.
    apps.deployment: Deployments executam um número escalável de réplicas de um pod distribuídas entre os nós elegíveis. As alterações são aplicadas de forma gradual e podem ser revertidas para a revisão anterior quando necessário. Recomendado para cargas de trabalho sem estado e escaláveis horizontalmente.
    apps.statefulset: StatefulSets gerenciam aplicativos com estado e fornecem garantias sobre a ordenação e a unicidade dos pods criados. Recomendados para cargas de trabalho com armazenamento persistente ou com requisitos rígidos de identidade, quórum ou ordem de upgrade.
    batch.cronjob: CronJobs criam Jobs, que por sua vez executam Pods, em um agendamento recorrente. O agendamento é expresso no formato cron padrão do Unix e usa o fuso horário do plano de controle do Kubernetes (normalmente UTC).
    batch.job: Jobs criam um ou mais pods para executar de forma confiável uma tarefa única, executando um pod até que ele termine com sucesso. Pods com falha são substituídos automaticamente até que o número especificado de execuções concluídas seja atingido. Jobs também podem executar vários pods em paralelo ou funcionar como uma fila de trabalho em lote.
    pod: Pods são as menores unidades de computação implantáveis que podem ser criadas e gerenciadas no Kubernetes. Um Pod é um grupo de um ou mais contêineres, com recursos de armazenamento e de rede compartilhados, e uma especificação de como executar os contêineres.
  upgrading:
    activeDeadlineSeconds:
      label: Prazo de atividade do Pod
      tip: A duração que o pod pode estar ativo antes que o sistema tente marcá-lo como falho e encerrar os contêineres associados.
    concurrencyPolicy:
      label: Concorrência
      options:
        allow: Permitir CronJobs em execução simultânea
        forbid: Pular a próxima execução se a atual não tiver terminado
        replace: Substituir execução atual se não terminou
    maxSurge:
      label: Excedente máximo
      tip: O número máximo de pods permitidos além da escala desejada em qualquer momento.
    maxUnavailable:
      label: Máximo indisponível
      tip: O número máximo de pods que podem estar indisponíveis em qualquer momento.
    minReadySeconds:
      label: Mínimo pronto
      tip: A duração mínima que um pod deve estar pronto sem falhas de contêineres para ser considerado disponível.
    podManagementPolicy:
      label: Política de gerenciamento de Pod
    progressDeadlineSeconds:
      label: Prazo de progresso
      tip: A duração mínima de espera para que um deployment progrida antes de considerar que ele falhou.
    revisionHistoryLimit:

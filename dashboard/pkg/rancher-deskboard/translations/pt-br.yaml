typeDescription:
  jwt.authentication: Habilite este recurso em um cluster para adicionar suporte à autenticação JWT para contas de serviço downstream.
  branding: O branding permite que os administradores alterem globalmente a marca da interface personalizando o nome do produto Rancher, logotipos e esquema de cores.
  compliance.cattle.io.clusterscanbenchmark: Uma versão de benchmark é o nome do benchmark a ser executado usando o kube-bench, bem como os parâmetros de configuração válidos para esse benchmark.
  compliance.cattle.io.clusterscanprofile: Um perfil é a configuração para o scan de conformidade, que inclui as versões de benchmark a serem usadas e quaisquer testes específicos a serem ignorados nesse benchmark.
  compliance.cattle.io.clusterscan: Um scan é criado para acionar um scan de conformidade no cluster com base no perfil definido. Um relatório é criado após a conclusão do scan.
  compliance.cattle.io.clusterscanreport: Um relatório é o resultado de um scan de conformidade do cluster.
  management.cattle.io.feature: As feature flags permitem habilitar e desabilitar determinados recursos do {vendor}. Os recursos desabilitados por padrão devem ser considerados funcionalidades experimentais.
  cluster.x-k8s.io.machine: Uma máquina encapsula a configuração de um nó Kubernetes. Use esta visualização para ver o que acontece após atualizar um cluster.
  cluster.x-k8s.io.machinedeployment: Um Machine Deployment orquestra implantações por meio de modelos em uma coleção de Machine Sets (similar a um Deployment). Use esta visualização para ver o que acontece após atualizar um cluster.
  cluster.x-k8s.io.machineset: Um Machine Set garante que o número desejado de recursos Machine esteja em execução o tempo todo (similar a um ReplicaSet). Use esta visualização para ver o que acontece após atualizar um cluster.
  resources.cattle.io.backup: Um backup é criado para realizar backups únicos ou agendar backups recorrentes com base em um ResourceSet.
  resources.cattle.io.restore: Uma restauração é criada para acionar uma restauração no cluster com base em um arquivo de backup.
  resources.cattle.io.resourceset: Um conjunto de recursos define quais CRDs e recursos armazenar no backup.
  monitoring.coreos.com.servicemonitor: Um monitor de serviço define o grupo de serviços e os endpoints dos quais o Prometheus coletará métricas. Esta é a forma mais comum de definir a coleta de métricas.
  monitoring.coreos.com.podmonitor: Um monitor de pod define o grupo de pods dos quais o Prometheus coletará métricas. O método mais comum é usar monitores de serviço, mas monitores de pod permitem lidar com qualquer situação em que um monitor de serviço não funcionaria.
  monitoring.coreos.com.prometheusrule: Um recurso Prometheus Rule define regras de gravação e/ou alerta. Uma regra de gravação pode pré-computar valores e salvar os resultados. As regras de alerta permitem definir condições para enviar notificações ao AlertManager.
  monitoring.coreos.com.prometheus: Um servidor Prometheus é uma implantação do Prometheus cuja configuração de coleta e regras são determinadas pelos ServiceMonitors, PodMonitors e PrometheusRules selecionados e cujos alertas serão enviados a todos os Alertmanagers selecionados com a configuração do recurso personalizado.
  monitoring.coreos.com.alertmanager: Um gerenciador de alertas é uma implantação cuja configuração será especificada por um Secret no mesmo namespace, que determina quais alertas devem ir para qual receptor.
  node: O recurso base Nó do Kubernetes representa uma máquina virtual ou física que hospeda implantações. Para gerenciar o ciclo de vida da máquina, se disponível, vá para Gerenciamento de cluster.
  catalog.cattle.io.operation: Uma operação é a lista de operações Helm recentes que foram aplicadas ao cluster.
  logging.banzaicloud.io.clusterflow: Os logs do cluster serão coletados e registrados na saída de cluster selecionada.
  logging.banzaicloud.io.clusteroutput: Uma saída de cluster define quais provedores de log podem receber logs e só é efetiva quando implantada no namespace do operador de log.
  logging.banzaicloud.io.flow: Um fluxo define quais logs coletar e filtrar, bem como qual saída usar. O fluxo é um recurso com namespace, o que significa que os logs serão coletados apenas do namespace em que o fluxo é implantado.
  logging.banzaicloud.io.output: Uma saída define quais provedores de log podem receber logs. A saída precisa estar no mesmo namespace que o fluxo que a utiliza.
  group.principal: Atribuir funções globais a um grupo só funciona com provedores de autenticação externos que suportam grupos. A autorização local não suporta grupos.
  management.cattle.io.oidcclient: Aqui você pode adicionar aplicativos ao provedor de identidade de login único do Rancher
  auditlog.cattle.io.auditpolicy: Defina regras que determinam quais eventos de API do Rancher são registrados e o nível de detalhe que contêm.

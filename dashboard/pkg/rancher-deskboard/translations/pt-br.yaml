featureFlags:
  description:
    hide-local-auth-provider: Ativar este recurso e habilitar um provedor de autenticação impedirá que os usuários façam login com credenciais locais. Em caso de falha do provedor, nenhum usuário conseguirá fazer login. Certifique-se de manter acesso contínuo via API ou CLI ao Rancher para desabilitar o recurso e recuperar o acesso. Consulte a documentação do {vendor} sobre feature flags para mais informações.
  label: Feature flags
  title: Tem certeza?
  warning: |-
    As feature flags permitem que o {vendor} controle determinados recursos por meio de flags.
    Recursos desativados por padrão devem ser considerados funcionalidades experimentais.
    Alguns recursos exigem reinicialização do servidor {vendor} para alteração.
    Isso resultará em uma breve interrupção da API e da UI, mas não afetará clusters ou cargas de trabalho em execução.
  promptActivate: Confirme que deseja ativar a feature flag "{flag}"
  promptDeactivate: Confirme que deseja desativar a feature flag "{flag}"
  restartRequired: 'Nota: Atualizar esta feature flag reiniciará o {vendor}'
  restart:
    title: Aguardando reinicialização
    wait: Isso pode levar alguns instantes
performance:
  label: Configurações de desempenho da UI
  settingName: Desempenho
  deprecatedInactivitySetting: A configuração <i class="mr-5">"Inatividade"</i> agora está obsoleta em favor da <a href="{settingsPageUrl}">configuração</a>&nbsp;<i class="mr-5">auth-user-session-idle-ttl-minutes</i>.
  deprecatedForSSP: A configuração <i class="mr-5">"{setting}"</i> agora está obsoleta e será removida em uma versão futura.
  incrementalLoad:
    label: Carregamento incremental
    setting: Você pode configurar o limiar acima do qual o carregamento incremental será usado.
    description: Quando habilitado, os recursos aparecerão mais rapidamente, mas pode levar um pouco mais de tempo para carregar todo o conjunto de recursos. Esta configuração se aplica apenas a recursos que vêm da API do Kubernetes
    checkboxLabel: Habilitar carregamento incremental
    inputLabel: Limiar de recursos
    incompatibleDescription: O carregamento incremental é incompatível com a filtragem por namespace/projeto e com a paginação no lado do servidor. Ao habilitar esta opção, elas serão desabilitadas.
  manualRefresh:
    label: Atualização manual
    setting: Você pode configurar um limiar acima do qual a atualização manual será habilitada.
    buttonTooltip: Atualizar lista
    description: Quando habilitado, os dados das listas não serão atualizados automaticamente; em vez disso, o usuário deve acionar manualmente a atualização da exibição de lista. Esta configuração se aplica apenas a recursos que vêm da API do Kubernetes
    checkboxLabel: Habilitar a atualização manual de dados das listas
    inputLabel: Limiar de recursos
    incompatibleDescription: A atualização manual é incompatível com a filtragem por namespace/projeto e com a paginação no lado do servidor. Ao habilitar esta opção, elas serão desabilitadas.
  websocketNotification:
    label: Notificações de Websocket
    description: Quando marcado, as notificações de websocket não aparecerão quando a interface detectar uma desconexão.
    checkboxLabel: Desabilitar notificações de websocket
  gc:
    label: Coleta de lixo de recursos
    description: A UI armazena recursos do Kubernetes em cache localmente para evitar buscá-los novamente. Em alguns casos, isso pode resultar em uma grande quantidade de dados armazenados no navegador. Habilite esta configuração para removê-los periodicamente.
    checkboxLabel: Habilitar coleta de lixo
    whenRun:
      description: Alterar quando a coleta de lixo é executada
      intervalCheckBox:
        label: Executar a coleta de lixo periodicamente
      interval:
        inputLabel: Executar a cada
      route:
        description: Executar a coleta de lixo ao mudar de página
        inputLabel: Mudança de página
    howRun:
      description: Alterar como a coleta de lixo é executada
      age:
        description: Os tipos de recursos não podem ter sido acessados neste período para serem considerados na coleta de lixo.
        inputLabel: Idade do recurso
      count:
        description: Os tipos de recursos devem exceder esta quantidade para serem considerados na coleta de lixo.
        inputLabel: Contagem de recursos
  nsFiltering:
    label: Exigir filtragem por namespace / projeto
    description: Exige que o usuário selecione namespaces e/ou projetos. Isso restringe o número de recursos buscados ao visualizar listas e deve ajudar na capacidade de resposta da UI em sistemas com muitos recursos.
    checkboxLabel: Habilitar filtragem obrigatória por namespace / projeto
    incompatibleDescription: A filtragem obrigatória por namespace / projeto é incompatível com a atualização manual e o carregamento incremental. Ao habilitar esta opção, eles serão desabilitados.
  advancedWorker:
    label: Web Worker de Websocket
    description: As atualizações de recursos enviadas à UI chegam via WebSocket e são processadas na thread da UI. Habilite esta opção para processar as atualizações de WebSocket do cluster em um Web Worker, em uma thread separada. Isso deve ajudar na capacidade de resposta da UI em sistemas em que os recursos mudam com frequência.
    checkboxLabel: Habilitar Web Worker avançado de Websocket
  inactivity:
    title: Inatividade
    checkboxLabel: Habilitar a expiração da sessão por inatividade
    inputLabel: Tempo limite de inatividade (minutos)
    information: Para alterar o comportamento de logout automático, edite os valores de tempo limite de autorização e/ou de token de sessão (<code>auth-user-session-ttl-minutes</code> e <code>auth-token-max-ttl-minutes</code>) na página Configurações.
    description: Quando habilitado e o usuário ficar inativo além do tempo limite especificado, a UI deixará de atualizar o conteúdo da página e o usuário precisará recarregar a página para continuar.
    authUserTTL: Este tempo limite não pode ser maior que o tempo limite da sessão do usuário auth-user-session-ttl-minutes, que atualmente é de {current} minutos.
  serverPagination:
    label: Paginação no lado do servidor
    description: Por padrão, as listas buscam todos os recursos e paginam (criam a página de acordo com as configurações de ordenação e filtro) localmente no navegador. A paginação no lado do servidor move isso do navegador para o servidor. Isso melhora o desempenho da UI, especialmente em sistemas com muitos recursos.
    applicable: A paginação no lado do servidor se aplica a tipos de recursos
    resources:
      generic: a maioria dos recursos na seção "Mais recursos" do cluster
      all: Todos os recursos

registryMirror:
  header: Espelhos
  toolTip: Espelhos podem ser usados para redirecionar requisições de imagens de um registro para uma lista de endpoints especificada por você. Por exemplo, docker.io pode ser redirecionado para o seu registro interno em vez de acessar o DockerHub.
  addLabel: Adicionar espelho
  description: Espelhos definem os nomes e endpoints para registros privados. Os endpoints são testados um a um, e o primeiro que funcionar é usado.
  hostnameLabel: Hostname do registro
  hostnamePlaceholder: 'ex.: docker.io ou *'
  endpointsLabel: Endpoints do espelho
  endpointsPlaceholder: 'ex.: a.registry.com:5000, b.registry.com:5000'
registryMirrorRewrite:
  header: Reescritas
  toolTip: Cada espelho pode ter um conjunto de reescritas. Reescritas podem alterar a tag de uma imagem com base em uma expressão regular.
  addLabel: Adicionar configuração de reescrita
  keyLabel: Padrão de reescrita
  keyPlaceholder: 'ex.: ^rancher/(.*)'
  valueLabel: Substituição de reescrita
  valuePlaceholder: 'ex.: mirrorproject/rancher-images/$1'
registryConfig:
  header: Autenticação de registro
  toolTip: Quando uma imagem precisar ser baixada do hostname de registro fornecido, estas informações serão usadas para verificar a identidade do registro e autenticar nele.
  addLabel: Adicionar registro
  description: Defina a configuração de TLS e credencial para cada hostname de registro e espelho.
  caBundle:
    tooltip: Aceita um certificado CA PEM ou um CA PEM codificado em base64.
    validationError: Pacote de certificado CA inválido. Deve ser um certificado CA PEM ou um CA PEM codificado em base64.
advancedSettings:
  setEnv: Definido por variável de ambiente
  hideShow: Ocultar/mostrar configuração
  label: Configurações
  subtext: Usuários típicos não precisarão alterar essas configurações. Prossiga com cuidado, valores incorretos podem prejudicar sua instalação do {appName}. Configurações personalizadas em relação ao padrão são marcadas como ‘Modificado’.
  show: Mostrar
  hide: Ocultar
  none: Nenhum
  modified: Modificado
  edit:
    moreActions: Mais ações para configuração - { setting }
    label: Editar configuração
    changeSetting: 'Alterar configuração:'
    agentConfigBanner:
      text: Editar este valor não alterará o valor definido nos clusters em execução! Para atualizar um cluster em execução para usar os novos valores, edite o cluster e clique em “Aplicar configurações globais para classe de prioridade e orçamento de interrupção de Pod” na aba de configuração do agente do {agent}.
      cluster: cluster
      fleet: Fleet
    trueOption: Verdadeiro
    falseOption: Falso
    value: Valor
    useDefault: Usar o valor padrão
    invalidJSON: JSON inválido - verifique e corrija sua entrada antes de salvar
  descriptions:
    cacerts: Certificados CA necessários para verificar o certificado do servidor.
    password-min-length: Define o número mínimo de caracteres necessários para uma senha de usuário.
    cluster-defaults: Substituir padrões do RKE ao criar novos clusters.
    engine-install-url: URL de instalação padrão do Docker engine (para a maioria dos drivers de nó).
    engine-iso-url: URL de instalação padrão do SO (para o driver vSphere).
    engine-newest-version: A versão mais recente do Docker suportada no momento deste lançamento. Uma versão do Docker que não satisfaz o intervalo suportado, mas é mais recente que esta, será marcada como não testada.
    engine-supported-range: Intervalo Semver para versões suportadas do Docker engine. Versões que não satisfazem este intervalo serão marcadas como não suportadas na UI.
    ingress-ip-domain: Domínio DNS curinga para uso em hostnames de Ingress gerados automaticamente. <ingress-name>.<namespace-name>.<ip address of ingress controller> será adicionado ao domínio.
    server-url: URL padrão de instalação do {appName}. Deve ser HTTPS. Todos os nós do cluster devem conseguir alcançar este endereço.
    system-default-registry: Registro privado a ser usado para todas as imagens de contêiner do sistema Rancher. Se nenhum valor for especificado, o registro padrão do runtime de contêiner será usado. Para Docker e containerd, o padrão é `docker.io`.
    system-default-registry-pull-secrets: Lista de image pull secrets para autenticar no registro a partir do qual as imagens de contêiner do sistema Rancher são baixadas. Por padrão, esses secrets serão copiados para cada namespace de chart do Rancher. Os secrets devem estar no namespace `cattle-system`. O primeiro secret válido listado aqui será usado.
    ui-dashboard-index: Localização do índice HTML para a UI do {appName}.
    ui-offline-preferred: Controla se os ativos da interface são servidos localmente pelo contêiner do servidor ou da URL remota definida na configuração ui-dashboard-index. A opção `Dinâmico` usará ativos locais em compilações de produção do {appName}.
    ui-pl: Nome da empresa de marca privada.
    auth-user-info-max-age-seconds: A idade máxima dos tokens de autenticação de usuários antes que uma sincronização de associação de grupo do provedor de autenticação seja realizada.
    auth-user-info-resync-cron: Agendamento cron padrão para ressincronização de associações de grupos do provedor de autenticação.
    cluster-template-enforcement: Não administradores serão restritos a criar clusters apenas via modelos RKE pré-aprovados.
    auth-user-session-idle-ttl-minutes: TTL de inatividade personalizado (em minutos) em uma sessão de autenticação do usuário. Esta é a duração máxima que uma sessão pode permanecer ativa quando não há atividade do usuário no navegador. Deve ser menor que "auth-user-session-ttl-minutes". Se "auth-user-session-idle-ttl-minutes" for maior ou igual a "auth-user-session-ttl-minutes", o recurso de inatividade da sessão será considerado desabilitado.
    auth-user-session-ttl-minutes: TTL personalizado (em minutos) em uma sessão de autenticação do usuário. Esta é a duração máxima que uma sessão pode permanecer ativa independentemente da atividade do usuário no navegador. Deve ser maior que "auth-user-session-idle-ttl-minutes".
    auth-token-max-ttl-minutes: TTL máximo (em minutos) para todos os tokens, exceto os controlados por "auth-user-session-ttl-minutes" (tokens de sessão de usuário). Quando definido como 0, o token nunca expira.
    kubeconfig-generate-token: Gerar tokens automaticamente para usuários quando um kubeconfig é solicitado.
    kubeconfig-default-token-ttl-minutes: TTL (em minutos) aplicado em todos os tokens kubeconfig. Quando definido como 0, o token nunca expira.
    rke-metadata-config: Configurar parâmetros de atualização de metadados do RKE.
    ui-banners: O banner de classificação é usado para exibir um banner fixo personalizado no cabeçalho, rodapé ou em ambos.
    custom-notifications: Editar notificações personalizadas
    ui-consent-banner: O banner é usado para exibir um banner de consentimento personalizado apresentado aos usuários durante o login.
    ui-default-landing: A página padrão em que os usuários chegam após o login.
    brand: Nome da pasta para um tema alternativo definido em /assets/brand
    hide-local-cluster: Ocultar o cluster local
    agent-tls-mode: Verificação de certificado do Rancher. No modo `strict`, os agentes (sistema, cluster, fleet, etc.) só confiarão em instalações do Rancher que usam um certificado assinado pelo CABundle na configuração `cacerts`. No modo system-store, os agentes confiarão em qualquer certificado assinado por um CABundle no repositório de confiança do sistema operacional.
    k3s-based-upgrader-uninstall-concurrency: Define o número máximo de clusters nos quais o Rancher pode desinstalar simultaneamente o aplicativo legado `rancher-k3s-upgrader` ou `rancher-rke2-upgrader` de clusters K3s ou RKE2 importados ou com driver de nó.
    system-agent-upgrader-install-concurrency: Define o número máximo de clusters nos quais o Rancher pode instalar simultaneamente os recursos necessários para fazer upgrade do system-agent.
    imported-cluster-version-management: Habilita o gerenciamento de versão para clusters RKE2/K3s importados e para o cluster local, se for um cluster RKE2/K3s. A configuração de gerenciamento de versão por cluster substitui esta configuração global no nível do cluster. Para clusters existentes em que o gerenciamento de versão no nível do cluster está definido como ‘system-default’, alterar esta flag acionará uma reimplantação do agente do cluster durante a próxima reconciliação (por padrão, a cada 5 minutos, ou assim que o cluster for editado, o que ocorrer primeiro).
    imported-cluster-day2-ops-enabled: Controla se os clusters RKE2/K3s importados terão as operações Day 2 (snapshots de etcd, restaurações, rotações de chave de criptografia) habilitadas por padrão. Isso afetará todos os clusters que usam a configuração padrão e pode ser substituído no nível do cluster.
  warnings:
    agent-tls-mode: Alterar esta configuração fará com que todos os agentes sejam reimplantados.
  editHelp:
    ui-banners: 'Esta configuração aceita um objeto JSON contendo 3 parâmetros raiz: <code>banner</code>, <code>showHeader</code>, <code>showFooter</code>. <code>banner</code> é um objeto contendo: <code>textColor</code>, <code>background</code> e <code>text</code>, onde <code>textColor</code> e <code>background</code> são qualquer valor de cor CSS válido.'

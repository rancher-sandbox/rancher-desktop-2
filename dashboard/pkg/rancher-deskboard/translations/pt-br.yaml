        delete: 'On Delete: novos pods são criados apenas quando os pods antigos são excluídos manualmente.'
        recreate: 'Recreate: matar TODOS os pods e iniciar novos pods.'
        rollingUpdate: 'Rolling Update: criar novos pods, até o excedente máximo ser atingido, antes de excluir os pods antigos. Não parar mais pods do que o máximo indisponível.'
    terminationGracePeriodSeconds:
      label: Período de encerramento controlado
      tip: A duração de que o pod precisa para se encerrar com sucesso.
    title: Upgrade

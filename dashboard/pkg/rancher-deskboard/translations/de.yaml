typeDescription:
  jwt.authentication: Aktivieren Sie diese Funktion auf einem Cluster, um die JWT-Authentifizierung für Downstream-Dienstkonten zu unterstützen.
  branding: Mit Branding können Administratoren die UI global umgestalten, indem sie den Rancher-Produktnamen, die Logos und das Farbschema anpassen.
  compliance.cattle.io.clusterscanbenchmark: Eine Benchmark-Version ist der Name des Benchmarks, der mit kube-bench ausgeführt wird, sowie die gültigen Konfigurationsparameter für diesen Benchmark.
  compliance.cattle.io.clusterscanprofile: Ein Profil ist die Konfiguration für den Compliance-Scan, also die zu verwendenden Benchmark-Versionen und alle Tests, die in diesem Benchmark übersprungen werden sollen.
  compliance.cattle.io.clusterscan: Ein Scan wird erstellt, um auf Grundlage des definierten Profils einen Compliance-Scan im Cluster auszulösen. Nach Abschluss des Scans wird ein Bericht erstellt.
  compliance.cattle.io.clusterscanreport: Ein Bericht ist das Ergebnis eines Compliance-Scans des Clusters.
  management.cattle.io.feature: Mit Feature-Flags lassen sich bestimmte {vendor}-Funktionen ein- und ausschalten. Funktionen, die standardmäßig ausgeschaltet sind, sollten als experimentell betrachtet werden.
  cluster.x-k8s.io.machine: Eine Machine kapselt die Konfiguration eines Kubernetes-Knotens. In dieser Ansicht sehen Sie, was nach der Aktualisierung eines Clusters geschieht.
  cluster.x-k8s.io.machinedeployment: Ein Machine Deployment orchestriert Bereitstellungen über Vorlagen auf einer Gruppe von Machine Sets (ähnlich wie ein Deployment). In dieser Ansicht sehen Sie, was nach der Aktualisierung eines Clusters geschieht.
  cluster.x-k8s.io.machineset: Ein Machine Set stellt sicher, dass die gewünschte Anzahl von Machine-Ressourcen jederzeit läuft (ähnlich wie ein ReplicaSet). In dieser Ansicht sehen Sie, was nach der Aktualisierung eines Clusters geschieht.
  resources.cattle.io.backup: Ein Backup wird erstellt, um einmalige Backups durchzuführen oder wiederkehrende Backups auf Grundlage eines ResourceSet zu planen.
  resources.cattle.io.restore: Eine Wiederherstellung wird erstellt, um auf Grundlage einer Backup-Datei eine Wiederherstellung im Cluster auszulösen.
  resources.cattle.io.resourceset: Ein Resource Set legt fest, welche CRDs und Ressourcen im Backup gespeichert werden.
  monitoring.coreos.com.servicemonitor: Ein Service Monitor definiert die Gruppe von Diensten und die Endpunkte, von denen Prometheus Metriken abruft. Dies ist die gängigste Methode, die Metrikerfassung zu definieren.
  monitoring.coreos.com.podmonitor: Ein Pod Monitor definiert die Gruppe von Pods, von denen Prometheus Metriken abruft. Üblicherweise werden Service Monitors verwendet, aber mit Pod Monitors lassen sich alle Situationen abdecken, in denen ein Service Monitor nicht funktionieren würde.
  monitoring.coreos.com.prometheusrule: Eine Prometheus-Regel-Ressource definiert Recording-Regeln und/oder Alarmregeln. Eine Recording-Regel kann Werte vorab berechnen und die Ergebnisse speichern. Mit Alarmregeln können Sie Bedingungen definieren, unter denen Benachrichtigungen an AlertManager gesendet werden.
  monitoring.coreos.com.prometheus: Ein Prometheus-Server ist ein Prometheus-Deployment, dessen Scrape-Konfiguration und Regeln durch ausgewählte ServiceMonitors, PodMonitors und PrometheusRules bestimmt werden und dessen Alarme mit der Konfiguration der benutzerdefinierten Ressource an alle ausgewählten Alertmanager gesendet werden.
  monitoring.coreos.com.alertmanager: Ein Alertmanager ist ein Deployment, dessen Konfiguration durch ein Secret im selben Namensraum festgelegt wird. Dieses bestimmt, welche Alarme an welchen Empfänger gehen.
  node: Die grundlegende Kubernetes-Ressource Knoten steht für eine virtuelle oder physische Maschine, auf der Deployments laufen. Den Lebenszyklus der Maschine verwalten Sie, sofern verfügbar, unter Cluster-Verwaltung.
  catalog.cattle.io.operation: Ein Vorgang ist die Liste der letzten Helm-Vorgänge, die auf den Cluster angewendet wurden.
  logging.banzaicloud.io.clusterflow: Protokolle aus dem Cluster werden gesammelt und an den ausgewählten Cluster-Output geschrieben.
  logging.banzaicloud.io.clusteroutput: Ein Cluster-Output definiert, an welche Logging-Anbieter Protokolle gesendet werden können, und ist nur wirksam, wenn er im selben Namensraum wie der Logging-Operator bereitgestellt wird.
  logging.banzaicloud.io.flow: Ein Flow definiert, welche Protokolle gesammelt und gefiltert werden und an welchen Output sie gesendet werden. Der Flow ist eine Ressource mit Namensraum, d. h. Protokolle werden nur aus dem Namensraum gesammelt, in dem der Flow bereitgestellt ist.
  logging.banzaicloud.io.output: Ein Output definiert, an welche Logging-Anbieter Protokolle gesendet werden können. Der Output muss sich im selben Namensraum befinden wie der Flow, der ihn verwendet.
  group.principal: Das Zuweisen globaler Rollen an eine Gruppe funktioniert nur mit externen Authentifizierungsanbietern, die Gruppen unterstützen. Die lokale Autorisierung unterstützt keine Gruppen.
  management.cattle.io.oidcclient: Hier können Sie Anwendungen zum Single-Sign-On-Identitätsanbieter von Rancher hinzufügen
  auditlog.cattle.io.auditpolicy: Definieren Sie Regeln, die festlegen, welche Rancher-API-Ereignisse protokolliert werden und wie detailliert sie sind.

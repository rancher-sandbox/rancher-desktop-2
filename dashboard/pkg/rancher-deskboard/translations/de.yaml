  typeDescriptions:
    apps.daemonset: DaemonSets führen auf jedem geeigneten Knoten genau einen Pod aus. Wenn dem Cluster neue Knoten hinzugefügt werden, werden DaemonSets automatisch auf ihnen bereitgestellt. Empfohlen für systemweite oder vertikal skalierbare Workloads, die nie mehr als einen Pod pro Knoten benötigen.
    apps.deployment: Deployments führen eine skalierbare Anzahl von Replikaten eines Pods aus, verteilt auf die geeigneten Knoten. Änderungen werden schrittweise ausgerollt und können bei Bedarf auf die vorherige Revision zurückgesetzt werden. Empfohlen für zustandslose und horizontal skalierbare Workloads.
    apps.statefulset: StatefulSets verwalten zustandsbehaftete Anwendungen und garantieren die Reihenfolge und Eindeutigkeit der erstellten Pods. Empfohlen für Workloads mit persistentem Speicher oder strengen Anforderungen an Identität, Quorum oder Upgrade-Reihenfolge.
    batch.cronjob: CronJobs erstellen nach einem wiederkehrenden Zeitplan Jobs, die dann Pods ausführen. Der Zeitplan wird im Standard-Unix-Cron-Format angegeben und verwendet die Zeitzone der Kubernetes-Control-Plane (in der Regel UTC).
    batch.job: Jobs erstellen einen oder mehrere Pods, um eine einmalige Aufgabe zuverlässig zu erledigen, indem sie einen Pod ausführen, bis er erfolgreich beendet wird. Fehlgeschlagene Pods werden automatisch ersetzt, bis die angegebene Anzahl abgeschlossener Läufe erreicht ist. Jobs können auch mehrere Pods parallel ausführen oder als Batch-Arbeitswarteschlange dienen.
    pod: Pods sind die kleinsten einsetzbaren Recheneinheiten, die Sie in Kubernetes erstellen und verwalten können. Ein Pod ist eine Gruppe aus einem oder mehreren Containern mit gemeinsam genutztem Speicher und Netzwerkressourcen sowie einer Spezifikation, wie die Container auszuführen sind.

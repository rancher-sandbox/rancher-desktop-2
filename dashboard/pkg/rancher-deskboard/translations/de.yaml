featureFlags:
  description:
    hide-local-auth-provider: Wenn Sie diese Funktion aktivieren und einen Authentifizierungsanbieter einrichten, können sich Benutzer nicht mehr mit lokalen Anmeldedaten anmelden. Bei einem Ausfall des Anbieters kann sich kein Benutzer anmelden. Stellen Sie sicher, dass Sie weiterhin API- oder CLI-Zugriff auf Rancher haben, um die Funktion deaktivieren und den Zugriff wiederherstellen zu können. Weitere Informationen finden Sie in der {vendor}-Dokumentation zu Feature-Flags.
  label: Feature-Flags
  title: Sind Sie sicher?
  warning: |-
    Mit Feature-Flags kann {vendor} bestimmte Funktionen hinter Flags verbergen.
    Funktionen, die standardmäßig ausgeschaltet sind, sollten als experimentell betrachtet werden.
    Für die Änderung einiger Funktionen ist ein Neustart des {vendor}-Servers erforderlich.
    Dies führt zu einem kurzen Ausfall von API und UI, wirkt sich aber nicht auf laufende Cluster oder Workloads aus.
  promptActivate: Bitte bestätigen Sie, dass Sie das Feature-Flag "{flag}" aktivieren möchten
  promptDeactivate: Bitte bestätigen Sie, dass Sie das Feature-Flag "{flag}" deaktivieren möchten

    activeDeadlineSeconds:
      label: Pod-Aktivitätsfrist
      tip: Die Dauer, die der Pod aktiv sein darf, bevor das System versucht, ihn als fehlgeschlagen zu markieren und die zugehörigen Container zu beenden.
    concurrencyPolicy:
      label: Nebenläufigkeit
      options:
        allow: Gleichzeitige Ausführung von CronJobs erlauben
        forbid: Nächsten Lauf überspringen, wenn der aktuelle Lauf noch nicht beendet ist
        replace: Lauf ersetzen, wenn der aktuelle Lauf noch nicht beendet ist
    maxSurge:
      label: Max. Surge
      tip: Die maximale Anzahl von Pods, die zu jedem Zeitpunkt über die gewünschte Skalierung hinaus erlaubt sind.
    maxUnavailable:
      label: Max. nicht verfügbar
      tip: Die maximale Anzahl von Pods, die zu jedem Zeitpunkt nicht verfügbar sein dürfen.
    minReadySeconds:
      label: Mindestbereitschaft
      tip: Die Mindestdauer, die ein Pod bereit sein sollte, ohne dass Container abstürzen, damit er als verfügbar gilt.
    podManagementPolicy:
      label: Pod-Verwaltungsrichtlinie
    progressDeadlineSeconds:
      label: Fortschrittsfrist
      tip: Die Mindestwartezeit auf den Fortschritt eines Deployments, bevor es als fehlgeschlagen markiert wird.
    revisionHistoryLimit:
      label: Limit für Revisionsverlauf
      tip: Die Anzahl alter ReplicaSets, die für ein Rollback aufbewahrt werden.
    strategies:
      labels:
        delete: 'Beim Löschen: Neue Pods werden nur erstellt, wenn alte Pods manuell gelöscht werden.'
        recreate: 'Neu erstellen: ALLE Pods beenden, dann neue Pods starten.'
        rollingUpdate: 'Rolling Update: Neue Pods erstellen, bis Max. Surge erreicht ist, bevor alte Pods gelöscht werden. Nicht mehr Pods stoppen, als Max. nicht verfügbar zulässt.'
    terminationGracePeriodSeconds:
      label: Karenzzeit für Beendigung
      tip: Die Dauer, die der Pod zum erfolgreichen Beenden benötigt.
    title: Upgrade wird durchgeführt

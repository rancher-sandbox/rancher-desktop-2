    useDefault: Standardwert verwenden
    invalidJSON: Ungültiges JSON - bitte prüfen und korrigieren Sie Ihre Eingabe vor dem Speichern
  descriptions:
    cacerts: CA-Zertifikate, die zum Überprüfen des Serverzertifikats benötigt werden.
    password-min-length: Mindestanzahl der für ein Benutzerpasswort erforderlichen Zeichen festlegen.
    cluster-defaults: RKE-Standardwerte beim Erstellen neuer Cluster überschreiben.
    engine-install-url: Standard-URL für die Installation der Docker-Engine (für die meisten Knotentreiber).
    engine-iso-url: Standard-URL für die OS-Installation (für den vSphere-Treiber).
    engine-newest-version: Die neueste unterstützte Docker-Version zum Zeitpunkt dieses Releases. Eine Docker-Version, die nicht im unterstützten Docker-Bereich liegt, aber neuer als diese ist, wird als ungetestet markiert.
    engine-supported-range: Semver-Bereich für unterstützte Docker-Engine-Versionen. Versionen, die nicht in diesem Bereich liegen, werden in der UI als nicht unterstützt markiert.
    ingress-ip-domain: Wildcard-DNS-Domäne für automatisch generierte Ingress-Hostnamen. <ingress-name>.<namespace-name>.<ip address of ingress controller> wird der Domäne hinzugefügt.
    server-url: Standard-URL der {appName}-Installation. Muss HTTPS sein. Alle Knoten in Ihrem Cluster müssen diese URL erreichen können.
    system-default-registry: Private Registry, die für alle Rancher-System-Container-Images verwendet wird. Wenn kein Wert angegeben ist, wird die Standard-Registry der Container-Runtime verwendet. Für Docker und containerd lautet der Standard `docker.io`.
    system-default-registry-pull-secrets: Liste der Image-Pull-Secrets zur Authentifizierung bei der Registry, aus der Rancher-System-Container-Images abgerufen werden. Standardmäßig werden diese Secrets in jeden Rancher-Chart-Namensraum kopiert. Secrets müssen sich im Namensraum `cattle-system` befinden. Das erste hier aufgeführte gültige Secret wird verwendet.
    ui-dashboard-index: HTML-Index-Speicherort für die {appName}-UI.
    ui-offline-preferred: Steuert, ob UI-Assets lokal vom Server-Container oder von der in der Einstellung ui-dashboard-index definierten Remote-URL bereitgestellt werden. Die Option `Dynamisch` verwendet in Produktions-Builds von {appName} lokale Assets.
    ui-pl: Private-Label-Firmenname.
    auth-user-info-max-age-seconds: Das maximale Alter der Authentifizierungstoken eines Benutzers, bevor eine Synchronisierung der Gruppenmitgliedschaften des Authentifizierungsanbieters durchgeführt wird.
    auth-user-info-resync-cron: Standard-Cron-Zeitplan für die erneute Synchronisierung der Gruppenmitgliedschaften von Authentifizierungsanbietern.
    cluster-template-enforcement: Nicht-Administratoren können Cluster nur über vorab genehmigte RKE-Vorlagen starten.
    auth-user-session-idle-ttl-minutes: Benutzerdefinierte Leerlauf-TTL (in Minuten) für eine Benutzer-Authentifizierungssitzung. Dies ist die maximale Dauer, die eine Sitzung aktiv bleiben kann, wenn keine Benutzeraktivität im Browser stattfindet. Dieser Wert sollte kleiner sein als "auth-user-session-ttl-minutes". Wenn "auth-user-session-idle-ttl-minutes" größer oder gleich "auth-user-session-ttl-minutes" ist, gilt die Leerlauffunktion für Sitzungen als deaktiviert.
    auth-user-session-ttl-minutes: Benutzerdefinierte TTL (in Minuten) für eine Benutzer-Authentifizierungssitzung. Dies ist die maximale Dauer, die eine Sitzung unabhängig von der Benutzeraktivität im Browser aktiv bleiben kann. Dieser Wert sollte größer sein als "auth-user-session-idle-ttl-minutes".
    auth-token-max-ttl-minutes: Maximale TTL (in Minuten) für alle Token außer denen, die durch "auth-user-session-ttl-minutes" gesteuert werden (Benutzersitzungstoken). Bei 0 läuft das Token nie ab.
    kubeconfig-generate-token: Token für Benutzer automatisch generieren, wenn eine kubeconfig angefordert wird.
    kubeconfig-default-token-ttl-minutes: TTL (in Minuten), die für alle kubeconfig-Token gilt. Bei 0 läuft das Token nie ab.
    rke-metadata-config: Parameter für die Aktualisierung der RKE-Metadaten konfigurieren.
    ui-banners: Das Klassifizierungsbanner dient dazu, ein benutzerdefiniertes festes Banner in der Kopfzeile, der Fußzeile oder beiden anzuzeigen.
    custom-notifications: Benutzerdefinierte Benachrichtigungen bearbeiten
    ui-consent-banner: Das Banner dient dazu, Benutzern bei der Anmeldung ein benutzerdefiniertes Einwilligungsbanner anzuzeigen.
    ui-default-landing: Die Standardseite, auf der Benutzer nach der Anmeldung landen.
    brand: Ordnername für ein alternatives Design, das in "/assets/brand" definiert ist
    hide-local-cluster: Lokalen Cluster ausblenden
    agent-tls-mode: Rancher-Zertifikatsüberprüfung. Im Modus `strict` vertrauen die Agenten (System, Cluster, Fleet usw.) nur Rancher-Installationen, die ein Zertifikat verwenden, das vom CABundle in der Einstellung `cacerts` signiert wurde. Im Modus system-store vertrauen die Agenten jedem Zertifikat, das von einem CABundle im Vertrauensspeicher des Betriebssystems signiert wurde.
    k3s-based-upgrader-uninstall-concurrency: Legt die maximale Anzahl von Clustern fest, in denen Rancher die ältere App `rancher-k3s-upgrader` oder `rancher-rke2-upgrader` gleichzeitig von importierten K3s- oder RKE2-Clustern oder solchen mit Knotentreiber deinstallieren kann.
    system-agent-upgrader-install-concurrency: Legt die maximale Anzahl von Clustern fest, in denen Rancher die für das Upgrade von system-agent erforderlichen Ressourcen gleichzeitig installieren kann.
    imported-cluster-version-management: Aktiviert die Versionsverwaltung für importierte RKE2/K3s-Cluster und für den lokalen Cluster, wenn dieser ein RKE2/K3s-Cluster ist. Die Einstellung für die Versionsverwaltung pro Cluster überschreibt diese globale Einstellung auf Cluster-Ebene. Bei bestehenden Clustern, deren Versionsverwaltung auf Cluster-Ebene auf "system-default" gesetzt ist, löst eine Änderung dieses Flags bei der nächsten Abstimmung (standardmäßig alle 5 Minuten oder sobald der Cluster bearbeitet wird, je nachdem, was zuerst eintritt) eine erneute Bereitstellung des Cluster-Agenten aus.
    imported-cluster-day2-ops-enabled: Steuert, ob für importierte RKE2/K3s-Cluster Day-2-Vorgänge (etcd-Snapshots, Wiederherstellungen, Rotation von Verschlüsselungsschlüsseln) standardmäßig aktiviert sind. Dies betrifft alle Cluster mit der Standardkonfiguration und kann auf Cluster-Ebene überschrieben werden.
  warnings:
    agent-tls-mode: Wenn Sie diese Einstellung ändern, werden alle Agenten neu bereitgestellt.
  editHelp:
    ui-banners: 'Diese Einstellung akzeptiert ein JSON-Objekt mit 3 Stammparametern: <code>banner</code>, <code>showHeader</code>, <code>showFooter</code>. <code>banner</code> ist ein Objekt mit <code>textColor</code>, <code>background</code> und <code>text</code>, wobei <code>textColor</code> und <code>background</code> beliebige gültige CSS-Farbwerte sind.'

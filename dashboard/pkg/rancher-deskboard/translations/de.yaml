  serverPagination:
    label: Serverseitige Paginierung
    description: Standardmäßig rufen Listen alle Ressourcen ab und paginieren sie lokal im Browser (sie erstellen die Seite anhand der Sortier- und Filtereinstellungen). Die serverseitige Paginierung verlagert dies vom Browser auf den Server. Das verbessert die Leistung der Benutzeroberfläche, vor allem in Systemen mit vielen Ressourcen.

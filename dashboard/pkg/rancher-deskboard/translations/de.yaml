    setting: Sie können den Schwellenwert festlegen, ab dem inkrementelles Laden verwendet wird.
    description: Wenn aktiviert, werden Ressourcen schneller angezeigt, das Laden aller Ressourcen kann jedoch etwas länger dauern. Diese Einstellung gilt nur für Ressourcen aus der Kubernetes-API
    checkboxLabel: Inkrementelles Laden aktivieren
    inputLabel: Ressourcen-Schwellenwert
    incompatibleDescription: Inkrementelles Laden ist nicht mit der Namensraum-/Projektfilterung und der serverseitigen Paginierung kompatibel. Wenn Sie diese Option aktivieren, werden beide deaktiviert.
  manualRefresh:
    label: Manuelle Aktualisierung
    setting: Sie können einen Schwellenwert festlegen, ab dem die manuelle Aktualisierung aktiviert wird.
    buttonTooltip: Liste aktualisieren
    description: Wenn aktiviert, werden Listendaten nicht automatisch aktualisiert, sondern die Listenansicht muss manuell aktualisiert werden. Diese Einstellung gilt nur für Ressourcen aus der Kubernetes-API
    checkboxLabel: Manuelle Aktualisierung von Listendaten aktivieren
    inputLabel: Ressourcen-Schwellenwert
    incompatibleDescription: Manuelle Aktualisierung ist nicht mit der Namensraum-/Projektfilterung und der serverseitigen Paginierung kompatibel. Wenn Sie diese Option aktivieren, werden beide deaktiviert.
  websocketNotification:
    label: Websocket-Benachrichtigungen
    description: Wenn aktiviert, werden keine Websocket-Benachrichtigungen angezeigt, wenn die Benutzeroberfläche einen Verbindungsabbruch erkennt.
    checkboxLabel: Websocket-Benachrichtigungen deaktivieren
  gc:
    label: Garbage Collection für Ressourcen
    description: Die Benutzeroberfläche speichert Kubernetes-Ressourcen lokal zwischen, damit sie nicht erneut abgerufen werden müssen. In manchen Fällen kann dadurch eine große Datenmenge im Browser gespeichert werden. Aktivieren Sie diese Einstellung, um sie regelmäßig zu entfernen.
    checkboxLabel: Garbage Collection aktivieren
    whenRun:
      description: Festlegen, wann die Garbage Collection ausgeführt wird
      intervalCheckBox:
        label: Garbage Collection regelmäßig ausführen
      interval:
        inputLabel: Ausführen alle
      route:
        description: Garbage Collection bei Seitenwechsel ausführen
        inputLabel: Seitenwechsel
    howRun:
      description: Festlegen, wie die Garbage Collection ausgeführt wird
      age:
        description: Auf Ressourcentypen darf in diesem Zeitraum nicht zugegriffen worden sein, damit sie für die Garbage Collection berücksichtigt werden.
        inputLabel: Ressourcenalter
      count:
        description: Ressourcentypen müssen diese Anzahl überschreiten, damit sie für die Garbage Collection berücksichtigt werden.
        inputLabel: Ressourcenanzahl
  nsFiltering:
    label: Namensraum-/Projektfilterung vorschreiben
    description: Benutzer müssen Namensräume und/oder Projekte auswählen. Dadurch wird die Anzahl der beim Anzeigen von Listen abgerufenen Ressourcen begrenzt, was die Reaktionsfähigkeit der Benutzeroberfläche in Systemen mit vielen Ressourcen verbessern sollte.
    checkboxLabel: Erforderliche Namensraum-/Projektfilterung aktivieren
    incompatibleDescription: Die erforderliche Namensraum-/Projektfilterung ist nicht mit der manuellen Aktualisierung und dem inkrementellen Laden kompatibel. Wenn Sie diese Option aktivieren, werden beide deaktiviert.
  advancedWorker:
    label: Websocket-Web-Worker
    description: An die Benutzeroberfläche gesendete Ressourcenaktualisierungen kommen über WebSocket und werden im UI-Thread verarbeitet. Aktivieren Sie diese Option, um WebSocket-Aktualisierungen des Clusters in einem Web Worker in einem separaten Thread zu verarbeiten. Das sollte die Reaktionsfähigkeit der Benutzeroberfläche in Systemen verbessern, in denen sich Ressourcen häufig ändern.
    checkboxLabel: Erweiterten Websocket-Web-Worker aktivieren
  inactivity:
    title: Inaktivität
    checkboxLabel: Sitzungsablauf bei Inaktivität aktivieren
    inputLabel: Inaktivitäts-Timeout (Minuten)
    information: Um das automatische Abmelden zu ändern, bearbeiten Sie auf der Seite „Einstellungen“ die Timeout-Werte für die Autorisierung und/oder das Sitzungstoken (<code>auth-user-session-ttl-minutes</code> und <code>auth-token-max-ttl-minutes</code>).
    description: Wenn aktiviert und der Benutzer über das angegebene Timeout hinaus inaktiv ist, aktualisiert die Benutzeroberfläche den Seiteninhalt nicht mehr, und der Benutzer muss die Seite neu laden, um fortzufahren.

  typeDescriptions:
    apps.daemonset: I DaemonSet eseguono esattamente un Pod su ogni nodo idoneo. Quando vengono aggiunti nuovi nodi al cluster, i DaemonSet eseguono automaticamente il deployment su di essi. Consigliati per workload a livello di sistema o scalabili verticalmente che non richiedono mai più di un Pod per nodo.
    apps.deployment: I Deployment eseguono un numero scalabile di repliche di un Pod distribuite tra i nodi idonei. Le modifiche vengono applicate in modo incrementale e, se necessario, è possibile tornare alla revisione precedente. Consigliati per workload stateless e scalabili orizzontalmente.
    apps.statefulset: Gli StatefulSet gestiscono applicazioni stateful e forniscono garanzie sull’ordinamento e sull’unicità dei Pod creati. Consigliati per workload con storage persistente o con requisiti rigorosi di identità, quorum o ordine di aggiornamento.
    batch.cronjob: I CronJob creano Job, che a loro volta eseguono Pod, secondo una pianificazione ricorrente. La pianificazione è espressa nel formato cron standard di Unix e usa il fuso orario del control plane di Kubernetes (in genere UTC).
    batch.job: I Job creano uno o più Pod per eseguire in modo affidabile un’attività una tantum, mantenendo in esecuzione un Pod finché non termina correttamente. I Pod non riusciti vengono sostituiti automaticamente fino al raggiungimento del numero specificato di esecuzioni completate. I Job possono anche eseguire più Pod in parallelo o funzionare come coda di lavoro batch.
    pod: I Pod sono le più piccole unità di calcolo distribuibili che puoi creare e gestire in Kubernetes. Un Pod è un gruppo di uno o più container, con risorse di storage e di rete condivise e una specifica su come eseguire i container.
  upgrading:
    activeDeadlineSeconds:
      label: Scadenza di attività del Pod
      tip: La durata per cui il Pod può restare attivo prima che il sistema tenti di contrassegnarlo come non riuscito e di terminare i container associati.
    concurrencyPolicy:
      label: Concorrenza
      options:
        allow: Consenti l’esecuzione simultanea dei CronJob
        forbid: Salta l’esecuzione successiva se quella corrente non è terminata
        replace: Sostituisci l’esecuzione se quella corrente non è terminata
    maxSurge:
      label: Max. surge
      tip: Il numero massimo di Pod consentiti oltre la scala desiderata in un dato momento.
    maxUnavailable:
      label: Max. non disponibili
      tip: Il numero massimo di Pod che possono essere non disponibili in un dato momento.
    minReadySeconds:
      label: Prontezza minima
      tip: La durata minima per cui un Pod deve restare pronto, senza arresti anomali dei container, per essere considerato disponibile.
    podManagementPolicy:
      label: Criterio di gestione dei Pod
    progressDeadlineSeconds:
      label: Scadenza di avanzamento
      tip: La durata minima di attesa dell’avanzamento di un Deployment prima di contrassegnarlo come non riuscito.
    revisionHistoryLimit:
      label: Limite della cronologia delle revisioni
      tip: Il numero di ReplicaSet precedenti da conservare per il rollback.
    strategies:
      labels:
        delete: 'All’eliminazione: i nuovi Pod vengono creati solo quando quelli vecchi vengono eliminati manualmente.'
        recreate: 'Ricrea: termina TUTTI i Pod, quindi avvia nuovi Pod.'
        rollingUpdate: 'Rolling update: crea nuovi Pod, fino a raggiungere il valore di max. surge, prima di eliminare quelli vecchi. Non arrestare più Pod del valore di max. non disponibili.'
    terminationGracePeriodSeconds:
      label: Periodo di tolleranza per la terminazione
      tip: La durata necessaria al Pod per terminare correttamente.
    title: Upgrade in corso
  tabs:
    labels:
      deployment: Deployment
      pod: Pod
      containers: Container

      dynamic: Dinamico
      'true': Locale
      'false': Remoto
    harv-ui-source:
      auto: Automatico
      bundled: Integrato
      external: Esterno
    harv-log-level:
      info: Info
      debug: Debug
      trace: Trace
    agent-tls-mode:
      strict: Strict
      system-store: System Store
  provisioning:
    header: Provisioning dei cluster
featureFlags:
  description:
    hide-local-auth-provider: L’attivazione di questa funzionalità insieme all’abilitazione di un provider di autenticazione impedisce agli utenti di accedere con le credenziali locali. In caso di guasto del provider, nessun utente potrà accedere. Assicurati di mantenere l’accesso a Rancher tramite API o CLI per poter disattivare la funzionalità e recuperare l’accesso. Per ulteriori informazioni, consulta la documentazione di {vendor} sui flag di funzionalità.
  label: Flag di funzionalità
  title: Confermi?
  warning: |-
    I flag di funzionalità consentono a {vendor} di controllare l’accesso a determinate funzionalità tramite flag.
    Le funzionalità disattivate per impostazione predefinita sono da considerare sperimentali.
    La modifica di alcune funzionalità richiede il riavvio del server {vendor}.
    Ciò causa una breve interruzione dell’API e dell’interfaccia utente, ma non influisce sui cluster o sui workload in esecuzione.
  promptActivate: Conferma di voler attivare il flag di funzionalità "{flag}"
  promptDeactivate: Conferma di voler disattivare il flag di funzionalità "{flag}"
  restartRequired: 'Nota: l’aggiornamento di questo flag di funzionalità riavvia {vendor}'
  restart:
    title: In attesa del riavvio
    wait: L’operazione potrebbe richiedere alcuni istanti
performance:
  label: Impostazioni delle prestazioni dell’interfaccia utente
  settingName: Prestazioni
  deprecatedInactivitySetting: L’impostazione <i class="mr-5">"Inattività"</i> è ora deprecata a favore dell’<a href="{settingsPageUrl}">impostazione</a>&nbsp;<i class="mr-5">auth-user-session-idle-ttl-minutes</i>.
  deprecatedForSSP: L’impostazione <i class="mr-5">"{setting}"</i> è ora deprecata e verrà rimossa in una versione futura.
  incrementalLoad:
    label: Caricamento incrementale
    setting: Puoi configurare la soglia oltre la quale verrà usato il caricamento incrementale.
    description: Se l’opzione è abilitata, le risorse vengono visualizzate più rapidamente, ma il caricamento dell’intero set di risorse può richiedere un po’ più di tempo. Questa impostazione si applica solo alle risorse provenienti dall’API di Kubernetes
    checkboxLabel: Abilita il caricamento incrementale
    inputLabel: Soglia di risorse
    incompatibleDescription: Il caricamento incrementale non è compatibile con il filtro per namespace/progetto e con la paginazione lato server. Se lo abiliti, queste funzionalità verranno disabilitate.
  manualRefresh:
    label: Aggiornamento manuale
    setting: Puoi configurare una soglia oltre la quale verrà abilitato l’aggiornamento manuale.
    buttonTooltip: Aggiorna elenco
    description: Se l’opzione è abilitata, i dati degli elenchi non si aggiornano automaticamente e l’utente deve avviare manualmente l’aggiornamento della vista elenco. Questa impostazione si applica solo alle risorse provenienti dall’API di Kubernetes
    checkboxLabel: Abilita l’aggiornamento manuale dei dati degli elenchi
    inputLabel: Soglia di risorse
    incompatibleDescription: L’aggiornamento manuale non è compatibile con il filtro per namespace/progetto e con la paginazione lato server. Se lo abiliti, queste funzionalità verranno disabilitate.
  websocketNotification:
    label: Notifiche WebSocket
    description: Se l’opzione è selezionata, le notifiche WebSocket non vengono visualizzate quando l’interfaccia utente rileva una disconnessione.
    checkboxLabel: Disabilita le notifiche WebSocket
  gc:
    label: Garbage collection delle risorse
    description: L’interfaccia utente memorizza nella cache locale le risorse Kubernetes per evitare di doverle recuperare di nuovo. In alcuni casi questo può comportare il salvataggio di una grande quantità di dati nel browser. Abilita questa impostazione per rimuoverle periodicamente.
    checkboxLabel: Abilita la garbage collection
    whenRun:
      description: Modifica quando viene eseguita la garbage collection
      intervalCheckBox:
        label: Esegui periodicamente la garbage collection
      interval:
        inputLabel: Esegui ogni
      route:
        description: Esegui la garbage collection al cambio di pagina
        inputLabel: Cambio di pagina
    howRun:
      description: Modifica come viene eseguita la garbage collection
      age:
        description: Per essere considerati per la garbage collection, i tipi di risorsa non devono aver ricevuto accessi in questo periodo.
        inputLabel: Età delle risorse
      count:
        description: Per essere considerati per la garbage collection, i tipi di risorsa devono superare questa quantità.
        inputLabel: Numero di risorse
  nsFiltering:
    label: Richiedi il filtro per namespace / progetto
    description: Richiede all’utente di selezionare namespace e/o progetti. In questo modo si limita il numero di risorse recuperate durante la visualizzazione degli elenchi, il che dovrebbe migliorare la reattività dell’interfaccia utente nei sistemi con molte risorse.
    checkboxLabel: Abilita il filtro obbligatorio per namespace / progetto
    incompatibleDescription: Il filtro obbligatorio per namespace / progetto non è compatibile con l’aggiornamento manuale e il caricamento incrementale. Se lo abiliti, queste funzionalità verranno disabilitate.
  advancedWorker:
    label: Web Worker WebSocket
    description: Gli aggiornamenti delle risorse inviati all’interfaccia utente arrivano tramite WebSocket e vengono gestiti nel thread dell’interfaccia utente. Abilita questa opzione per gestire gli aggiornamenti WebSocket del cluster in un Web Worker, in un thread separato. Questo dovrebbe migliorare la reattività dell’interfaccia utente nei sistemi in cui le risorse cambiano spesso.
    checkboxLabel: Abilita il Web Worker WebSocket avanzato
  inactivity:
    title: Inattività
    checkboxLabel: Abilita la scadenza della sessione per inattività
    inputLabel: Timeout di inattività (minuti)
    information: Per cambiare il comportamento della disconnessione automatica, modifica i valori di timeout dell’autorizzazione e/o del token di sessione (<code>auth-user-session-ttl-minutes</code> e <code>auth-token-max-ttl-minutes</code>) nella pagina Impostazioni.
    description: Se l’opzione è abilitata e l’utente resta inattivo oltre il timeout specificato, l’interfaccia utente smette di aggiornare il contenuto della pagina e l’utente deve ricaricarla per continuare.
    authUserTTL: Questo timeout non può superare il timeout della sessione utente auth-user-session-ttl-minutes, attualmente pari a {current} minuti.
  serverPagination:
    label: Paginazione lato server
    description: Per impostazione predefinita, gli elenchi recuperano tutte le risorse e le paginano (creano la pagina in base alle impostazioni di ordinamento e filtro) localmente nel browser. La paginazione lato server sposta questa operazione dal browser al server. Ciò migliora le prestazioni dell’interfaccia utente, soprattutto nei sistemi con molte risorse.
    applicable: La paginazione lato server si applica ai tipi di risorsa
    resources:
      generic: la maggior parte delle risorse nella sezione ‘Altre risorse’ del cluster
      all: Tutte le risorse

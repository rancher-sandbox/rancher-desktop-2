typeDescription:
  jwt.authentication: Abilita questa funzionalità su un cluster per aggiungere il supporto all’autenticazione JWT dei service account downstream.
  branding: La personalizzazione del marchio consente agli amministratori di cambiare globalmente il marchio dell’interfaccia utente personalizzando il nome del prodotto Rancher, i loghi e la combinazione di colori.
  compliance.cattle.io.clusterscanbenchmark: Una versione del benchmark è il nome del benchmark da eseguire con kube-bench, insieme ai parametri di configurazione validi per quel benchmark.
  compliance.cattle.io.clusterscanprofile: Un profilo è la configurazione della scansione di conformità, ovvero le versioni del benchmark da usare e gli eventuali test specifici da saltare in quel benchmark.
  compliance.cattle.io.clusterscan: Una scansione viene creata per avviare una scansione di conformità sul cluster in base al profilo definito. Al termine della scansione viene creato un report.
  compliance.cattle.io.clusterscanreport: Un report è il risultato di una scansione di conformità del cluster.
  management.cattle.io.feature: I flag di funzionalità consentono di attivare e disattivare determinate funzionalità di {vendor}. Le funzionalità disattivate per impostazione predefinita sono da considerare sperimentali.
  cluster.x-k8s.io.machine: Una macchina incapsula la configurazione di un nodo Kubernetes. Usa questa vista per vedere cosa succede dopo l’aggiornamento di un cluster.
  cluster.x-k8s.io.machinedeployment: Un MachineDeployment orchestra i deployment tramite modelli su una raccolta di MachineSet (in modo simile a un Deployment). Usa questa vista per vedere cosa succede dopo l’aggiornamento di un cluster.
  cluster.x-k8s.io.machineset: Un MachineSet garantisce che il numero desiderato di risorse Machine sia sempre attivo e in esecuzione (in modo simile a un ReplicaSet). Usa questa vista per vedere cosa succede dopo l’aggiornamento di un cluster.
  resources.cattle.io.backup: Un backup viene creato per eseguire backup singoli o pianificare backup ricorrenti in base a un ResourceSet.
  resources.cattle.io.restore: Un ripristino viene creato per avviare un ripristino del cluster in base a un file di backup.
  resources.cattle.io.resourceset: Un ResourceSet definisce quali CRD e risorse archiviare nel backup.
  monitoring.coreos.com.servicemonitor: Un service monitor definisce il gruppo di servizi e gli endpoint da cui Prometheus raccoglie le metriche. È il modo più comune per definire la raccolta delle metriche.
  monitoring.coreos.com.podmonitor: Un pod monitor definisce il gruppo di Pod da cui Prometheus raccoglie le metriche. Il modo comune è usare i service monitor, ma i pod monitor consentono di gestire qualsiasi situazione in cui un service monitor non funzionerebbe.
  monitoring.coreos.com.prometheusrule: Una risorsa Prometheus Rule definisce regole di registrazione e/o di avviso. Una regola di registrazione può precalcolare valori e salvare i risultati. Le regole di avviso consentono di definire le condizioni in cui inviare notifiche ad AlertManager.
  monitoring.coreos.com.prometheus: Un server Prometheus è un deployment di Prometheus la cui configurazione di scraping e le cui regole sono determinate dai ServiceMonitor, PodMonitor e PrometheusRule selezionati e i cui avvisi vengono inviati a tutti gli Alertmanager selezionati con la configurazione della risorsa personalizzata.
  monitoring.coreos.com.alertmanager: Un alert manager è un deployment la cui configurazione è specificata da un Secret nello stesso namespace, che determina quali avvisi devono essere inviati a quale ricevitore.
  node: La risorsa Nodo di base di Kubernetes rappresenta una macchina virtuale o fisica che ospita i Deployment. Per gestire il ciclo di vita della macchina, se disponibile, vai a Gestione cluster.
  catalog.cattle.io.operation: Un’operazione è l’elenco delle operazioni Helm recenti applicate al cluster.
  logging.banzaicloud.io.clusterflow: I log del cluster verranno raccolti e registrati nell’output del cluster selezionato.
  logging.banzaicloud.io.clusteroutput: Un output del cluster definisce i provider di logging a cui è possibile inviare i log ed è efficace solo se ne viene eseguito il deployment nel namespace in cui si trova l’operatore di logging.
  logging.banzaicloud.io.flow: 'Un flow definisce quali log raccogliere e filtrare e a quale output inviarli. Il flow è una risorsa con namespace: i log vengono quindi raccolti solo dal namespace in cui è stato eseguito il deployment del flow.'
  logging.banzaicloud.io.output: Un output definisce i provider di logging a cui è possibile inviare i log. L’output deve trovarsi nello stesso namespace del flow che lo usa.
  group.principal: L’assegnazione di ruoli globali a un gruppo funziona solo con provider di autenticazione esterni che supportano i gruppi. L’autorizzazione locale non supporta i gruppi.
  management.cattle.io.oidcclient: Qui puoi aggiungere applicazioni al provider di identità Single Sign-On di Rancher
  auditlog.cattle.io.auditpolicy: Definisci le regole che determinano quali eventi dell’API di Rancher vengono registrati e il relativo livello di dettaglio.

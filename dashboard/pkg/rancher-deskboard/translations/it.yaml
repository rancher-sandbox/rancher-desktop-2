registryMirror:
  header: Mirror
  toolTip: I mirror possono essere usati per reindirizzare le richieste di immagini da un registry a un elenco di endpoint specificati da te. Ad esempio, docker.io potrebbe reindirizzare al tuo registry interno senza mai passare da DockerHub.
  addLabel: Aggiungi mirror
  description: I mirror definiscono i nomi e gli endpoint dei registry privati. Gli endpoint vengono provati uno alla volta e viene usato il primo funzionante.
  hostnameLabel: Hostname del registry
  hostnamePlaceholder: es. docker.io o *
  endpointsLabel: Endpoint del mirror
  endpointsPlaceholder: es. a.registry.com:5000, b.registry.com:5000
registryMirrorRewrite:
  header: Riscritture
  toolTip: Ogni mirror può avere un insieme di riscritture. Le riscritture possono modificare il tag di un’immagine in base a un’espressione regolare.
  addLabel: Aggiungi configurazione di riscrittura
  keyLabel: Pattern di riscrittura
  keyPlaceholder: es. ^rancher/(.*)
  valueLabel: Sostituzione della riscrittura
  valuePlaceholder: es. mirrorproject/rancher-images/$1
registryConfig:
  header: Autenticazione del registry
  toolTip: Quando è necessario eseguire il pull di un’immagine dall’hostname del registry specificato, queste informazioni vengono usate per verificare l’identità del registry e autenticarsi presso di esso.
  addLabel: Aggiungi registry
  description: Definisci la configurazione TLS e delle credenziali per ogni hostname di registry e mirror.
  caBundle:
    tooltip: Accetta un certificato CA PEM o un CA PEM codificato in base64.
    validationError: Bundle di certificati CA non valido. Deve essere un certificato CA PEM o un CA PEM codificato in base64.
advancedSettings:
  setEnv: Impostata tramite variabile d’ambiente
  hideShow: Nascondi/mostra impostazione
  label: Impostazioni
  subtext: 'Gli utenti tipici non dovranno modificare questi valori. Procedi con cautela: valori errati possono compromettere l’installazione di {appName}. Le impostazioni diverse da quelle predefinite sono contrassegnate con ‘Modificata’.'
  show: Mostra
  hide: Nascondi
  none: Nessuno
  modified: Modificata
  edit:
    moreActions: Altre azioni per l’impostazione - { setting }
    label: Modifica impostazione
    changeSetting: 'Modifica impostazione:'
    agentConfigBanner:
      text: La modifica di questo valore non cambia il valore impostato nei cluster in esecuzione! Per aggiornare un cluster in esecuzione in modo che usi i nuovi valori, modifica il cluster e fai clic su “Applica le impostazioni globali per la classe di priorità e il budget di interruzione dei Pod” nella scheda di configurazione dell’agente {agent}.
      cluster: Cluster
      fleet: Fleet
    trueOption: Vero
    falseOption: Falso
    value: Valore
    useDefault: Usa il valore predefinito
    invalidJSON: JSON non valido - controlla e correggi l’input prima di salvare
  descriptions:
    cacerts: Certificati CA necessari per verificare il certificato del server.
    password-min-length: Definisci il numero minimo di caratteri richiesto per la password di un utente.
    cluster-defaults: Sostituisci i valori predefiniti di RKE durante la creazione di nuovi cluster.
    engine-install-url: URL predefinito di installazione del Docker engine (per la maggior parte dei driver dei nodi).
    engine-iso-url: URL predefinito di installazione del sistema operativo (per il driver vSphere).
    engine-newest-version: La versione più recente di Docker supportata al momento di questo rilascio. Una versione di Docker che non rientra nell’intervallo supportato ma è più recente di questa viene contrassegnata come non testata.
    engine-supported-range: Intervallo Semver delle versioni supportate del Docker engine. Le versioni che non rientrano in questo intervallo vengono contrassegnate come non supportate nell’interfaccia utente.
    ingress-ip-domain: Dominio DNS con carattere jolly da usare per gli hostname Ingress generati automaticamente. <ingress-name>.<namespace-name>.<ip address of ingress controller> verrà aggiunto al dominio.
    server-url: URL di installazione predefinito di {appName}. Deve essere HTTPS. Tutti i nodi del cluster devono poterlo raggiungere.
    system-default-registry: Registry privato da usare per tutte le immagini container di sistema di Rancher. Se non viene specificato alcun valore, viene usato il registry predefinito del container runtime. Per Docker e containerd, il valore predefinito è `docker.io`.
    system-default-registry-pull-secrets: Elenco dei Secret di pull delle immagini con cui autenticarsi nel registry da cui viene eseguito il pull delle immagini container di sistema di Rancher. Per impostazione predefinita, questi Secret vengono copiati nel namespace di ogni chart Rancher. I Secret devono trovarsi nel namespace `cattle-system`. Viene usato il primo Secret valido dell’elenco.
    ui-dashboard-index: Posizione dell’indice HTML per l’interfaccia utente di {appName}.
    ui-offline-preferred: Determina se le risorse dell’interfaccia utente vengono servite localmente dal container del server o dall’URL remoto definito nell’impostazione ui-dashboard-index. L’opzione `Dinamico` usa le risorse locali nelle build di produzione di {appName}.
    ui-pl: Nome dell’azienda per il private label.
    auth-user-info-max-age-seconds: L’età massima dei token di autenticazione di un utente prima che venga eseguita una sincronizzazione delle appartenenze ai gruppi del provider di autenticazione.
    auth-user-info-resync-cron: Pianificazione cron predefinita per la risincronizzazione delle appartenenze ai gruppi del provider di autenticazione.
    cluster-template-enforcement: Gli utenti non amministratori potranno avviare cluster solo tramite modelli RKE preapprovati.
    auth-user-session-idle-ttl-minutes: TTL di inattività personalizzato (in minuti) per una sessione di autenticazione utente. È la durata massima per cui una sessione può restare attiva in assenza di attività dell’utente in un browser. Deve essere inferiore a "auth-user-session-ttl-minutes". Se "auth-user-session-idle-ttl-minutes" è maggiore o uguale a "auth-user-session-ttl-minutes", la funzionalità di inattività della sessione viene considerata disabilitata.
    auth-user-session-ttl-minutes: TTL personalizzato (in minuti) per una sessione di autenticazione utente. È la durata massima per cui una sessione può restare attiva indipendentemente dall’attività dell’utente in un browser. Deve essere superiore a "auth-user-session-idle-ttl-minutes".
    auth-token-max-ttl-minutes: TTL massimo (in minuti) per tutti i token, tranne quelli controllati da "auth-user-session-ttl-minutes" (token di sessione utente). Se impostato su 0, il token non scade mai.
    kubeconfig-generate-token: Genera automaticamente token per gli utenti quando viene richiesto un kubeconfig.
    kubeconfig-default-token-ttl-minutes: TTL (in minuti) applicato a tutti i token kubeconfig. Se impostato su 0, il token non scade mai.
    rke-metadata-config: Configura i parametri di aggiornamento dei metadati RKE.
    ui-banners: Il banner di classificazione viene usato per mostrare un banner fisso personalizzato nell’intestazione, nel piè di pagina o in entrambi.
    custom-notifications: Modifica le notifiche personalizzate
    ui-consent-banner: Il banner viene usato per mostrare agli utenti un banner di consenso personalizzato durante l’accesso.
    ui-default-landing: La pagina predefinita su cui arrivano gli utenti dopo l’accesso.
    brand: Nome della cartella di un tema alternativo definito in ‘/assets/brand’
    hide-local-cluster: Nascondi il cluster locale
    agent-tls-mode: Verifica del certificato di Rancher. In modalità `strict`, gli agenti (sistema, cluster, Fleet e così via) considerano attendibili solo le installazioni di Rancher che usano un certificato firmato dal CABundle nell’impostazione `cacerts`. In modalità system-store, gli agenti considerano attendibile qualsiasi certificato firmato da un CABundle nell’archivio attendibile del sistema operativo.
    k3s-based-upgrader-uninstall-concurrency: Definisce il numero massimo di cluster in cui Rancher può disinstallare contemporaneamente l’app legacy `rancher-k3s-upgrader` o `rancher-rke2-upgrader` dai cluster K3s o RKE2 importati o con driver di nodo.
    system-agent-upgrader-install-concurrency: Definisce il numero massimo di cluster in cui Rancher può installare contemporaneamente le risorse necessarie per aggiornare system-agent.
    imported-cluster-version-management: Abilita la gestione delle versioni per i cluster RKE2/K3s importati e per il cluster locale, se è un cluster RKE2/K3s. L’impostazione di gestione delle versioni per singolo cluster sostituisce questa impostazione globale a livello di cluster. Per i cluster esistenti in cui la gestione delle versioni a livello di cluster è impostata su ‘system-default’, la modifica di questo flag attiva un nuovo deployment dell’agente del cluster durante la riconciliazione successiva (per impostazione predefinita ogni 5 minuti o non appena il cluster viene modificato, a seconda di quale evento si verifica prima).
    imported-cluster-day2-ops-enabled: Determina se i cluster RKE2/K3s importati hanno le operazioni day 2 (snapshot etcd, ripristini, rotazioni delle chiavi di crittografia) abilitate per impostazione predefinita. Questa impostazione influisce su tutti i cluster che usano la configurazione predefinita e può essere sostituita a livello di cluster.
  warnings:
    agent-tls-mode: La modifica di questa impostazione causa un nuovo deployment di tutti gli agenti.
  editHelp:
    ui-banners: 'Questa impostazione accetta un oggetto JSON contenente 3 parametri root: <code>banner</code>, <code>showHeader</code>, <code>showFooter</code>. <code>banner</code> è un oggetto contenente: <code>textColor</code>, <code>background</code> e <code>text</code>, dove <code>textColor</code> e <code>background</code> sono qualsiasi valore di colore CSS valido.'

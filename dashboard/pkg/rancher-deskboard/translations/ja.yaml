  typeDescriptions:
    apps.daemonset: DaemonSet は、対象となるすべてのノードで Pod を 1 つずつ実行します。クラスターに新しいノードが追加されると、DaemonSet はそのノードに自動的にデプロイされます。ノードごとに 2 つ以上の Pod を必要としない、システム全体のワークロードや垂直スケーリング可能なワークロードに推奨されます。
    apps.deployment: デプロイメントは、スケーラブルな数の Pod レプリカを対象のノードに分散して実行します。変更は段階的にロールアウトされ、必要に応じて以前のリビジョンにロールバックできます。ステートレスで水平スケーリング可能なワークロードに推奨されます。
    apps.statefulset: StatefulSet は、ステートフルなアプリケーションを管理し、作成される Pod の順序と一意性を保証します。永続ストレージ、厳密な ID、クォーラム、またはアップグレード順序の要件があるワークロードに推奨されます。
    batch.cronjob: CronJob は、繰り返しのスケジュールに従って Job を作成し、その Job が Pod を実行します。スケジュールは標準の Unix cron 形式で表され、Kubernetes コントロールプレーンのタイムゾーン（通常は UTC）が使用されます。
    batch.job: Job は、1 つ以上の Pod を作成し、Pod が正常に終了するまで実行することで、1 回限りのタスクを確実に実行します。失敗した Pod は、指定された完了回数に達するまで自動的に置き換えられます。Job は複数の Pod を並列に実行することも、バッチ作業キューとして機能することもできます。
    pod: Pod は、Kubernetes で作成および管理できる、デプロイ可能な最小のコンピューティング単位です。Pod は 1 つ以上のコンテナーのグループで、共有のストレージとネットワークリソース、およびコンテナーの実行方法の仕様を持ちます。
  upgrading:
    activeDeadlineSeconds:
      label: Pod のアクティブ期限
      tip: システムが Pod を失敗としてマークし、関連するコンテナーを強制終了するまでに、Pod がアクティブでいられる期間です。
    concurrencyPolicy:
      label: 同時実行
      options:
        allow: CronJob の同時実行を許可する
        forbid: 現在の実行が完了していない場合は次の実行をスキップする
        replace: 現在の実行が完了していない場合は実行を置き換える
    maxSurge:

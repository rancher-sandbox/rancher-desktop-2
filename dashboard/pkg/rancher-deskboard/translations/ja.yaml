  jwt.authentication: この機能をクラスターで有効にすると、ダウンストリームのサービスアカウントの JWT 認証がサポートされます。
  branding: ブランディングを使用すると、管理者は Rancher の製品名、ロゴ、配色をカスタマイズして、UI 全体のブランドを変更できます。
  compliance.cattle.io.clusterscanbenchmark: ベンチマークバージョンは、kube-bench で実行するベンチマークの名前と、そのベンチマークの有効な設定パラメーターです。
  compliance.cattle.io.clusterscanprofile: プロファイルはコンプライアンススキャンの設定で、使用するベンチマークバージョンと、そのベンチマークでスキップする特定のテストを指定します。
  compliance.cattle.io.clusterscan: スキャンは、定義されたプロファイルに基づいてクラスターのコンプライアンススキャンを開始するために作成します。スキャンの完了後にレポートが作成されます。
  compliance.cattle.io.clusterscanreport: レポートは、クラスターのコンプライアンススキャンの結果です。
  management.cattle.io.feature: 機能フラグを使用すると、特定の {vendor} 機能をオン/オフできます。デフォルトでオフの機能は、実験的な機能と見なしてください。
  cluster.x-k8s.io.machine: Machine は Kubernetes ノードの設定をカプセル化します。このビューでは、クラスターの更新後に何が起きるかを確認できます。
  cluster.x-k8s.io.machinedeployment: MachineDeployment は、テンプレートを使用して MachineSet の集合全体のデプロイをオーケストレーションします（デプロイメントに似ています）。このビューでは、クラスターの更新後に何が起きるかを確認できます。
  cluster.x-k8s.io.machineset: MachineSet は、理想的な数の Machine リソースが常に稼働している状態を維持します（ReplicaSet に似ています）。このビューでは、クラスターの更新後に何が起きるかを確認できます。
  resources.cattle.io.backup: バックアップは、ResourceSet に基づいて 1 回限りのバックアップを実行したり、定期的なバックアップをスケジュールしたりするために作成します。
  resources.cattle.io.restore: 復元は、バックアップファイルに基づいてクラスターへの復元を開始するために作成します。
  resources.cattle.io.resourceset: リソースセットは、バックアップに保存する CRD とリソースを定義します。
  monitoring.coreos.com.servicemonitor: サービスモニターは、Prometheus がメトリクスをスクレイプするサービスのグループとエンドポイントを定義します。メトリクスの収集を定義する最も一般的な方法です。
  monitoring.coreos.com.podmonitor: Pod モニターは、Prometheus がメトリクスをスクレイプする Pod のグループを定義します。一般的にはサービスモニターを使用しますが、Pod モニターを使用すると、サービスモニターでは対応できない状況にも対処できます。
  monitoring.coreos.com.prometheusrule: Prometheus ルールリソースは、レコーディングルールとアラートルールのいずれかまたは両方を定義します。レコーディングルールは値を事前に計算し、その結果を保存できます。アラートルールを使用すると、AlertManager に通知を送信する条件を定義できます。
  monitoring.coreos.com.prometheus: Prometheus サーバーは Prometheus のデプロイメントです。スクレイプ設定とルールは、選択された ServiceMonitor、PodMonitor、PrometheusRule によって決まり、アラートはカスタムリソースの設定で選択されたすべての Alertmanager に送信されます。
  monitoring.coreos.com.alertmanager: Alertmanager はデプロイメントであり、その設定は同じネームスペースの Secret で指定されます。この設定によって、どのアラートをどのレシーバーに送信するかが決まります。
  node: Kubernetes の基本的なノードリソースは、デプロイメントをホストする仮想マシンまたは物理マシンを表します。マシンのライフサイクルを管理するには、利用可能な場合はクラスター管理に移動してください。
  catalog.cattle.io.operation: オペレーションは、クラスターに適用された最近の Helm オペレーションのリストです。
  logging.banzaicloud.io.clusterflow: クラスターのログが収集され、選択したクラスター出力に記録されます。
  logging.banzaicloud.io.clusteroutput: クラスター出力は、ログの送信先となるロギングプロバイダーを定義します。ロギングオペレーターと同じネームスペースにデプロイした場合にのみ有効です。
  logging.banzaicloud.io.flow: フローは、収集およびフィルターするログと、ログの送信先の出力を定義します。フローはネームスペースに属するリソースであるため、ログはフローがデプロイされたネームスペースからのみ収集されます。
  logging.banzaicloud.io.output: 出力は、ログの送信先となるロギングプロバイダーを定義します。出力は、それを使用するフローと同じネームスペースに配置する必要があります。
  group.principal: グループへのグローバルロールの割り当ては、グループをサポートする外部認証プロバイダーでのみ機能します。ローカル認証はグループをサポートしていません。
  management.cattle.io.oidcclient: ここでは、Rancher のシングルサインオン ID プロバイダーにアプリケーションを追加できます
  auditlog.cattle.io.auditpolicy: どの Rancher API イベントをログに記録するか、およびその詳細レベルを決定するルールを定義します。

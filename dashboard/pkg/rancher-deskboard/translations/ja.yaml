  descriptions:
    cacerts: サーバーの証明書の検証に必要な CA 証明書です。
    password-min-length: ユーザーパスワードに必要な最小文字数を定義します。
    cluster-defaults: 新しいクラスターの作成時に RKE のデフォルトを上書きします。
    engine-install-url: デフォルトの Docker エンジンのインストール URL です（ほとんどのノードドライバー用）。
    engine-iso-url: デフォルトの OS インストール URL です（vSphere ドライバー用）。
    engine-newest-version: このリリースの時点でサポートされている Docker の最新バージョンです。サポートされる Docker の範囲を満たしていないが、このバージョンより新しい Docker バージョンは、未テストとしてマークされます。
    engine-supported-range: サポートされる Docker エンジンのバージョンの Semver 範囲です。この範囲を満たさないバージョンは、UI でサポート対象外としてマークされます。
    ingress-ip-domain: 自動生成される Ingress のホスト名に使用するワイルドカード DNS ドメインです。ドメインには <ingress-name>.<namespace-name>.<ip address of ingress controller> が追加されます。
    server-url: デフォルトの {appName} インストール URL です。HTTPS である必要があります。クラスター内のすべてのノードがこの URL に到達できる必要があります。
    system-default-registry: Rancher のすべてのシステムコンテナーイメージに使用するプライベートレジストリです。値を指定しない場合は、コンテナーランタイムのデフォルトレジストリが使用されます。Docker と containerd のデフォルトは `docker.io` です。
    system-default-registry-pull-secrets: Rancher のシステムコンテナーイメージのプル元レジストリの認証に使用するイメージプル Secret のリストです。デフォルトでは、これらの Secret は Rancher チャートの各ネームスペースにコピーされます。Secret は `cattle-system` ネームスペースに配置する必要があります。ここに記載された最初の有効な Secret が使用されます。
    ui-dashboard-index: '{appName} UI の HTML インデックスの場所です。'
    ui-offline-preferred: UI アセットをサーバーコンテナーからローカルに配信するか、ui-dashboard-index 設定で定義されたリモート URL から配信するかを制御します。`動的` オプションでは、{appName} の本番ビルドでローカルアセットを使用します。
    ui-pl: プライベートラベルの会社名です。
    auth-user-info-max-age-seconds: 認証プロバイダーのグループメンバーシップの同期が実行されるまでの、ユーザーの認証トークンの最大有効期間です。
    auth-user-info-resync-cron: 認証プロバイダーのグループメンバーシップを再同期するデフォルトの cron スケジュールです。
    cluster-template-enforcement: 管理者以外のユーザーは、事前承認された RKE テンプレートでのみクラスターを起動できるように制限されます。
    auth-user-session-idle-ttl-minutes: ユーザー認証セッションのカスタムアイドル TTL（分）です。ブラウザーでのユーザー操作がないときにセッションを維持できる最大期間です。「auth-user-session-ttl-minutes」より小さくする必要があります。「auth-user-session-idle-ttl-minutes」が「auth-user-session-ttl-minutes」以上の場合、セッションアイドル機能は無効と見なされます。
    auth-user-session-ttl-minutes: ユーザー認証セッションのカスタム TTL（分）です。ブラウザーでのユーザー操作にかかわらずセッションを維持できる最大期間です。「auth-user-session-idle-ttl-minutes」より大きくする必要があります。
    auth-token-max-ttl-minutes: 「auth-user-session-ttl-minutes」で制御されるトークン（ユーザーセッショントークン）を除くすべてのトークンの最大 TTL（分）です。0 に設定すると、トークンは期限切れになりません。
    kubeconfig-generate-token: kubeconfig が要求されたときに、ユーザーのトークンを自動的に生成します。
    kubeconfig-default-token-ttl-minutes: すべての kubeconfig トークンに適用される TTL（分）です。0 に設定すると、トークンは期限切れになりません。
    rke-metadata-config: RKE メタデータの更新パラメーターを設定します。
    ui-banners: 分類バナーは、ヘッダー、フッター、またはその両方にカスタムの固定バナーを表示するために使用します。
    custom-notifications: カスタム通知を編集
    ui-consent-banner: バナーは、ログイン時にユーザーに表示するカスタムの同意バナーを表示するために使用します。
    ui-default-landing: ログイン後にユーザーが最初に表示するデフォルトのページです。
    brand: 「/assets/brand」で定義された代替テーマのフォルダー名です
    hide-local-cluster: ローカルクラスターを非表示にする
    agent-tls-mode: Rancher の証明書検証です。`strict` モードでは、エージェント（system、cluster、fleet など）は、`cacerts` 設定の CABundle で署名された証明書を使用している Rancher インストールのみを信頼します。モードが system-store の場合、エージェントはオペレーティングシステムのトラストストアにある CABundle で署名された任意の証明書を信頼します。
    k3s-based-upgrader-uninstall-concurrency: Rancher が、インポートされたクラスターまたはノードドライバーの K3s/RKE2 クラスターから、従来の `rancher-k3s-upgrader` または `rancher-rke2-upgrader` アプリを同時にアンインストールできるクラスターの最大数を定義します。
    system-agent-upgrader-install-concurrency: Rancher が、system-agent のアップグレードに必要なリソースを同時にインストールできるクラスターの最大数を定義します。
    imported-cluster-version-management: インポートされた RKE2/K3s クラスターと、RKE2/K3s クラスターである場合はローカルクラスターのバージョン管理を有効にします。クラスターごとのバージョン管理設定は、クラスターレベルでこのグローバル設定を上書きします。クラスターレベルのバージョン管理が「system-default」に設定されている既存のクラスターでは、このフラグを変更すると、次回の調整時（デフォルトでは 5 分ごと、またはクラスターの編集時のいずれか早いほう）にクラスターエージェントが再デプロイされます。
    imported-cluster-day2-ops-enabled: インポートされた RKE2/K3s クラスターで Day 2 オペレーション（etcd スナップショット、復元、暗号化キーのローテーション）をデフォルトで有効にするかどうかを制御します。デフォルト設定を使用するすべてのクラスターに影響し、クラスターレベルで上書きできます。
  warnings:
    agent-tls-mode: この設定を変更すると、すべてのエージェントが再デプロイされます。
  editHelp:
    ui-banners: この設定には、<code>banner</code>、<code>showHeader</code>、<code>showFooter</code> の 3 つのルートパラメーターを含む JSON オブジェクトを指定します。<code>banner</code> は <code>textColor</code>、<code>background</code>、<code>text</code> を含むオブジェクトで、<code>textColor</code> と <code>background</code> には有効な CSS カラー値を指定します。

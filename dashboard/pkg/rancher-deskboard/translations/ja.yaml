    hide-local-auth-provider: この機能をアクティブ化して認証プロバイダーを有効にすると、ユーザーはローカルの認証情報でログインできなくなります。プロバイダーに障害が発生すると、どのユーザーもログインできなくなります。アクセスを回復するためにこの機能を無効にできるよう、Rancher への API または CLI アクセスを確保しておいてください。詳細については、{vendor} の機能フラグに関するドキュメントを参照してください。

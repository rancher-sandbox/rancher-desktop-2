    description: ユーザーにネームスペースまたはプロジェクト、もしくはその両方の選択を求めます。これによりリストの表示時に取得するリソース数が制限され、リソースが多いシステムでの UI の応答性の向上が期待できます。
    checkboxLabel: ネームスペース/プロジェクトのフィルタリングの必須化を有効にする
    incompatibleDescription: ネームスペース/プロジェクトのフィルタリングの必須化は、手動更新および増分読み込みと互換性がありません。有効にすると、これらは無効になります。
  advancedWorker:
    label: WebSocket Web Worker
    description: UI にプッシュされるリソースの更新は WebSocket 経由で届き、UI スレッドで処理されます。このオプションを有効にすると、クラスターの WebSocket 更新を別スレッドの Web Worker で処理します。これにより、リソースが頻繁に変更されるシステムでの UI の応答性の向上が期待できます。
    checkboxLabel: 高度な WebSocket Web Worker を有効にする
  inactivity:
    title: 非アクティブ状態
    checkboxLabel: 非アクティブ時のセッション期限切れを有効にする
    inputLabel: 非アクティブタイムアウト（分）
    information: 自動ログアウトの動作を変更するには、設定ページで認可トークンまたはセッショントークン、もしくはその両方のタイムアウト値（<code>auth-user-session-ttl-minutes</code> と <code>auth-token-max-ttl-minutes</code>）を編集します。
    description: 有効にすると、ユーザーが指定したタイムアウトを超えて非アクティブな場合、UI はページの内容を更新しなくなり、続行するにはユーザーがページを再読み込みする必要があります。
    authUserTTL: このタイムアウトは、ユーザーセッションのタイムアウト auth-user-session-ttl-minutes（現在 {current} 分）より大きくできません。
  serverPagination:
    label: サーバーサイドページネーション
    description: デフォルトでは、リストはすべてのリソースを取得し、ブラウザー内でローカルにページネーション（ソートとフィルターの設定に基づくページの作成）を行います。サーバーサイドページネーションは、この処理をブラウザーからサーバーに移します。これにより、特にリソースが多いシステムで UI のパフォーマンスが向上します。

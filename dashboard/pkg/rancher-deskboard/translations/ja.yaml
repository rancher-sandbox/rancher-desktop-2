    maxUnavailable:
      label: 最大利用不可数
      tip: 任意の時点で利用不可にできる Pod の最大数です。
    minReadySeconds:
      label: 最小準備完了時間
      tip: Pod が利用可能と見なされるために、コンテナーがクラッシュせずに準備完了状態を維持する必要がある最小時間です。
    podManagementPolicy:
      label: Pod 管理ポリシー
    progressDeadlineSeconds:
      label: 進行期限
      tip: デプロイメントを失敗と判定するまで、進行を待機する最小時間です。
    revisionHistoryLimit:
      label: リビジョン履歴の上限
      tip: ロールバック用に保持する古い ReplicaSet の数です。
    strategies:
      labels:
        delete: 削除時：古い Pod が手動で削除されたときにのみ、新しい Pod が作成されます。
        recreate: 再作成：すべての Pod を強制終了してから、新しい Pod を起動します。
        rollingUpdate: ローリングアップデート：古い Pod を削除する前に、最大サージに達するまで新しい Pod を作成します。最大利用不可数を超える Pod は停止しません。
    terminationGracePeriodSeconds:
      label: 終了猶予期間
      tip: Pod が正常に終了するために必要な時間です。
    title: アップグレード
  tabs:

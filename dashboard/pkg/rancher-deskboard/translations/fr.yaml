  typeDescriptions:
    apps.daemonset: Les DaemonSets exécutent exactement un pod sur chaque nœud éligible. Lorsque de nouveaux nœuds sont ajoutés au cluster, les DaemonSets s’y déploient automatiquement. Recommandé pour les charges de travail à l’échelle du système ou à mise à l’échelle verticale qui n’ont jamais besoin de plus d’un pod par nœud.
    apps.deployment: Les Deployments exécutent un nombre évolutif de réplicas d’un pod répartis sur les nœuds éligibles. Les changements sont déployés progressivement, et il est possible de revenir à la révision précédente si nécessaire. Recommandé pour les charges de travail sans état et évolutives horizontalement.
    apps.statefulset: Les StatefulSets gèrent les applications avec état et garantissent l’ordre et l’unicité des pods créés. Recommandé pour les charges de travail avec stockage persistant ou ayant des exigences strictes d’identité, de quorum ou d’ordre de mise à niveau.
    batch.cronjob: Les CronJobs créent des Jobs, qui exécutent ensuite des pods, selon une planification répétitive. La planification est exprimée au format cron Unix standard et utilise le fuseau horaire du plan de contrôle Kubernetes (généralement UTC).
    batch.job: Les Jobs créent un ou plusieurs pods pour effectuer une tâche unique de manière fiable, en exécutant un pod jusqu’à ce qu’il se termine avec succès. Les pods en échec sont automatiquement remplacés jusqu’à ce que le nombre spécifié d’exécutions terminées soit atteint. Les Jobs peuvent aussi exécuter plusieurs pods en parallèle ou fonctionner comme une file de travail par lots.
    pod: Les pods sont les plus petites unités de calcul déployables que vous pouvez créer et gérer dans Kubernetes. Un pod est un groupe d’un ou plusieurs conteneurs, avec des ressources de stockage et réseau partagées, et une spécification indiquant comment exécuter les conteneurs.
  upgrading:
    activeDeadlineSeconds:
      label: Délai d’activité du pod
      tip: La durée pendant laquelle le pod peut être actif avant que le système tente de le marquer comme échoué et de tuer les conteneurs associés.
    concurrencyPolicy:
      label: Concurrence
      options:
        allow: Autoriser l’exécution simultanée des CronJobs
        forbid: Ignorer la prochaine exécution si l’exécution actuelle n’est pas terminée
        replace: Remplacer l’exécution si l’exécution actuelle n’est pas terminée
    maxSurge:

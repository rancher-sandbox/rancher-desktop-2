advancedSettings:
  setEnv: Défini par variable d’environnement
  hideShow: Masquer/afficher le paramètre
  label: Paramètres
  subtext: "Les utilisateurs habituels n’auront pas besoin de modifier ces paramètres. Procédez avec précaution, des valeurs incorrectes peuvent endommager votre installation {appName}. Les paramètres qui ont été personnalisés par rapport aux valeurs par défaut sont étiquetés «\_Modifié\_»."
  show: Afficher
  hide: Masquer
  none: Aucun
  modified: Modifié
  edit:
    moreActions: Plus d’actions pour le paramètre - { setting }
    label: Modifier le paramètre
    changeSetting: "Modifier le paramètre\_:"
    agentConfigBanner:
      text: "La modification de cette valeur ne changera pas la valeur définie dans les clusters en cours d’exécution\_! Pour mettre à jour un cluster en cours d’exécution afin qu’il utilise les nouvelles valeurs, modifiez le cluster et cliquez sur «\_Appliquer les paramètres globaux pour la classe de priorité et le budget de perturbation des pods\_» dans l’onglet de configuration de l’agent {agent}."
      cluster: Cluster
      fleet: Fleet
    trueOption: Vrai
    falseOption: Faux
    value: Valeur
    useDefault: Utiliser la valeur par défaut
    invalidJSON: JSON invalide - veuillez vérifier et corriger votre saisie avant d’enregistrer
  descriptions:
    cacerts: Certificats CA nécessaires pour vérifier le certificat du serveur.
    password-min-length: Définit le nombre minimum de caractères requis pour un mot de passe utilisateur.
    cluster-defaults: Remplacer les valeurs RKE par défaut lors de la création de nouveaux clusters.
    engine-install-url: URL d’installation de Docker Engine par défaut (pour la plupart des pilotes de nœuds).
    engine-iso-url: URL d’installation du système d’exploitation par défaut (pour le pilote vSphere).
    engine-newest-version: La version la plus récente de Docker prise en charge au moment de cette version. Une version de Docker qui ne satisfait pas la plage Docker prise en charge mais qui est plus récente sera marquée comme non testée.
    engine-supported-range: Plage Semver pour les versions Docker Engine prises en charge. Les versions qui ne satisfont pas cette plage seront marquées comme non prises en charge dans l’interface.
    ingress-ip-domain: Domaine DNS générique pour les noms d’hôte Ingress générés automatiquement. <ingress-name>.<namespace-name>.<ip address of ingress controller> sera ajouté au domaine.
    server-url: URL d’installation {appName} par défaut. Doit être en HTTPS. Tous les nœuds de votre cluster doivent pouvoir l’atteindre.
    system-default-registry: Registre privé pour toutes les images de conteneurs système Rancher. Si aucune valeur n’est spécifiée, le registre par défaut de l’environnement d’exécution de conteneurs est utilisé. Pour Docker et containerd, la valeur par défaut est `docker.io`.
    system-default-registry-pull-secrets: Liste des secrets de téléchargement d’images pour s’authentifier auprès du registre depuis lequel les images de conteneurs système Rancher sont téléchargées. Par défaut, ces secrets seront copiés dans chaque espace de noms de chart Rancher. Les secrets doivent se trouver dans l’espace de noms `cattle-system`. Le premier secret valide listé ici sera utilisé.
    ui-dashboard-index: Emplacement de l’index HTML pour l’interface {appName}.
    ui-offline-preferred: Contrôle si les ressources de l’interface utilisateur sont servies localement par le conteneur serveur ou depuis l’URL distante définie dans le paramètre ui-dashboard-index. L’option `Dynamique` utilisera les ressources locales dans les versions de production de {appName}.
    ui-pl: Nom de l’entreprise en marque blanche.
    auth-user-info-max-age-seconds: L’âge maximum des jetons d’authentification d’un utilisateur avant qu’une synchronisation des appartenances aux groupes du fournisseur d’authentification soit effectuée.
    auth-user-info-resync-cron: Planification cron par défaut pour la resynchronisation des appartenances aux groupes du fournisseur d’authentification.
    cluster-template-enforcement: Les non-administrateurs seront limités au lancement de clusters via des modèles RKE préapprouvés uniquement.
    auth-user-session-idle-ttl-minutes: "TTL d’inactivité personnalisé (en minutes) sur une session d’authentification utilisateur. Il s’agit de la durée maximale pendant laquelle une session peut rester active en l’absence d’activité de l’utilisateur dans un navigateur. Cette valeur doit être inférieure à «\_auth-user-session-ttl-minutes\_». Si «\_auth-user-session-idle-ttl-minutes\_» est supérieur ou égal à «\_auth-user-session-ttl-minutes\_», la fonctionnalité d’inactivité de session est considérée comme désactivée."
    auth-user-session-ttl-minutes: "TTL personnalisé (en minutes) sur une session d’authentification utilisateur. Il s’agit de la durée maximale pendant laquelle une session peut rester active, quelle que soit l’activité de l’utilisateur dans un navigateur. Cette valeur doit être supérieure à «\_auth-user-session-idle-ttl-minutes\_»."
    auth-token-max-ttl-minutes: "TTL maximum (en minutes) pour tous les jetons, sauf ceux contrôlés par «\_auth-user-session-ttl-minutes\_» (jetons de session utilisateur). Lorsqu’il est défini à 0, le jeton n’expire jamais."
    kubeconfig-generate-token: Générer automatiquement des jetons pour les utilisateurs lorsqu’un kubeconfig est demandé.
    kubeconfig-default-token-ttl-minutes: TTL (en minutes) appliqué à tous les jetons kubeconfig. Lorsqu’il est défini à 0, le jeton n’expire jamais.
    rke-metadata-config: Configurer les paramètres d’actualisation des métadonnées RKE.
    ui-banners: La bannière de classification est utilisée pour afficher une bannière fixe personnalisée dans l’en-tête, le pied de page ou les deux.
    custom-notifications: Modifier les notifications personnalisées
    ui-consent-banner: La bannière est utilisée pour afficher une bannière de consentement personnalisée présentée aux utilisateurs lors de la connexion.
    ui-default-landing: La page par défaut sur laquelle les utilisateurs arrivent après la connexion.
    brand: "Nom du dossier pour un thème alternatif défini dans «\_/assets/brand\_»"
    hide-local-cluster: Masquer le cluster local
    agent-tls-mode: Vérification du certificat Rancher. En mode `strict`, les agents (système, cluster, fleet, etc.) ne feront confiance qu’aux installations Rancher avec un certificat signé par le CABundle du paramètre `cacerts`. En mode system-store, les agents feront confiance à tout certificat signé par un CABundle du magasin de confiance du système d’exploitation.
    k3s-based-upgrader-uninstall-concurrency: Définit le nombre maximum de clusters dans lesquels Rancher peut désinstaller simultanément l’ancienne application `rancher-k3s-upgrader` ou `rancher-rke2-upgrader` des clusters K3s ou RKE2 importés ou créés avec un pilote de nœuds.
    system-agent-upgrader-install-concurrency: Définit le nombre maximum de clusters dans lesquels Rancher peut installer simultanément les ressources requises pour la mise à niveau de l’agent système.
    imported-cluster-version-management: "Active la gestion des versions pour les clusters RKE2/K3s importés, et pour le cluster local s’il s’agit d’un cluster RKE2/K3s. Le paramètre de gestion des versions par cluster remplace ce paramètre global au niveau du cluster. Pour les clusters existants dont la gestion des versions au niveau du cluster est définie sur «\_system-default\_», la modification de ce paramètre déclenchera un redéploiement de l’agent du cluster lors de la prochaine réconciliation (par défaut toutes les 5 minutes, ou dès que le cluster est modifié, selon ce qui se produit en premier)."
    imported-cluster-day2-ops-enabled: Contrôle si les clusters RKE2/K3s importés auront les opérations Day 2 (instantanés etcd, restaurations, renouvellements de clés de chiffrement) activées par défaut. Cela affectera tous les clusters utilisant la configuration par défaut, et peut être remplacé au niveau du cluster.
  warnings:
    agent-tls-mode: La modification de ce paramètre entraînera le redéploiement de tous les agents.
  editHelp:
    ui-banners: "Ce paramètre prend un objet JSON contenant 3 paramètres racines\_: <code>banner</code>, <code>showHeader</code>, <code>showFooter</code>. <code>banner</code> est un objet contenant\_: <code>textColor</code>, <code>background</code> et <code>text</code>, où <code>textColor</code> et <code>background</code> sont des valeurs de couleur CSS valides."
  enum:
    ui-default-landing:
      ember: Gestionnaire de cluster
      vue: Explorateur de cluster
    ui-offline-preferred:
      dynamic: Dynamique
      'true': Local
      'false': Distant
    harv-ui-source:
      auto: Auto
      bundled: Intégré
      external: Externe
    harv-log-level:
      info: Info
      debug: Débogage
      trace: Trace
    agent-tls-mode:
      strict: Strict
      system-store: Magasin système
  provisioning:
    header: Provisionnement du cluster
featureFlags:
  description:
    hide-local-auth-provider: L’activation de cette fonctionnalité et d’un fournisseur d’authentification empêchera les utilisateurs de se connecter avec des identifiants locaux. En cas de défaillance d’un fournisseur, aucun utilisateur ne pourra se connecter. Assurez-vous de conserver un accès API ou CLI à Rancher pour désactiver la fonctionnalité et récupérer l’accès. Veuillez consulter la documentation {vendor} sur les indicateurs de fonctionnalité pour plus d’informations.
  label: Indicateurs de fonctionnalité
  title: "Êtes-vous sûr\_?"
  warning: |-
    Les indicateurs de fonctionnalité permettent à {vendor} de restreindre certaines fonctionnalités derrière des indicateurs.
    Les fonctionnalités désactivées par défaut doivent être considérées comme des fonctionnalités expérimentales.
    Certaines fonctionnalités nécessitent un redémarrage du serveur {vendor} pour être modifiées.
    Cela entraînera une brève interruption de l’API et de l’interface, mais n’affectera pas les clusters ou charges de travail en cours d’exécution.
  promptActivate: "Veuillez confirmer que vous souhaitez activer l’indicateur de fonctionnalité «\_{flag}\_»"
  promptDeactivate: "Veuillez confirmer que vous souhaitez désactiver l’indicateur de fonctionnalité «\_{flag}\_»"
  restartRequired: "Remarque\_: la mise à jour de cet indicateur de fonctionnalité redémarrera {vendor}"
  restart:
    title: En attente du redémarrage
    wait: Cela peut prendre quelques instants
performance:
  label: Paramètres de performance de l’interface
  settingName: Performance
  deprecatedInactivitySetting: "Le paramètre <i class=\"mr-5\">«\_Inactivité\_»</i> est désormais obsolète au profit du <a href=\"{settingsPageUrl}\">paramètre</a>&nbsp;<i class=\"mr-5\">auth-user-session-idle-ttl-minutes</i>."
  deprecatedForSSP: "Le paramètre <i class=\"mr-5\">«\_{setting}\_»</i> est désormais obsolète et sera supprimé dans une prochaine version."
  incrementalLoad:
    label: Chargement incrémentiel
    setting: Vous pouvez configurer le seuil au-delà duquel le chargement incrémentiel sera utilisé.
    description: Lorsque cette option est activée, les ressources apparaissent plus rapidement, mais le chargement de l’ensemble des ressources peut prendre un peu plus de temps. Ce paramètre s’applique uniquement aux ressources provenant de l’API Kubernetes
    checkboxLabel: Activer le chargement incrémentiel
    inputLabel: Seuil de ressources
    incompatibleDescription: Le chargement incrémentiel est incompatible avec le filtrage par espace de noms/projet et la pagination côté serveur. L’activer les désactivera.
  manualRefresh:
    label: Actualisation manuelle
    setting: Vous pouvez configurer un seuil au-delà duquel l’actualisation manuelle sera activée.
    buttonTooltip: Actualiser la liste
    description: Lorsque cette option est activée, les données des listes ne sont plus mises à jour automatiquement et l’utilisateur doit déclencher manuellement l’actualisation de la liste. Ce paramètre s’applique uniquement aux ressources provenant de l’API Kubernetes
    checkboxLabel: Activer l’actualisation manuelle des données des listes
    inputLabel: Seuil de ressources
    incompatibleDescription: L’actualisation manuelle est incompatible avec le filtrage par espace de noms/projet et la pagination côté serveur. L’activer les désactivera.
  websocketNotification:
    label: Notifications Websocket
    description: Si cette option est cochée, les notifications websocket n’apparaîtront pas lorsque l’interface détecte une déconnexion.
    checkboxLabel: Désactiver les notifications websocket
  gc:
    label: Collecte des déchets des ressources
    description: L’interface met en cache les ressources Kubernetes localement pour éviter de les récupérer à nouveau. Dans certains cas, cela peut entraîner le stockage d’une grande quantité de données dans le navigateur. Activez ce paramètre pour les supprimer périodiquement.
    checkboxLabel: Activer la collecte des déchets
    whenRun:
      description: Modifier le moment d’exécution de la collecte des déchets
      intervalCheckBox:
        label: Exécuter périodiquement la collecte des déchets
      interval:
        inputLabel: Exécuter toutes les
      route:
        description: Exécuter la collecte des déchets lors d’un changement de page
        inputLabel: Changement de page
    howRun:
      description: Modifier le mode d’exécution de la collecte des déchets
      age:
        description: Les types de ressources ne doivent pas avoir été consultés au cours de cette période pour être pris en compte par la collecte des déchets.
        inputLabel: Âge des ressources
      count:
        description: Les types de ressources doivent dépasser cette quantité pour être pris en compte par la collecte des déchets.
        inputLabel: Nombre de ressources
  nsFiltering:
    label: Exiger le filtrage par espace de noms / projet
    description: Exige que l’utilisateur sélectionne des espaces de noms et/ou des projets. Cela limite le nombre de ressources récupérées lors de l’affichage des listes et devrait améliorer la réactivité de l’interface sur les systèmes comportant de nombreuses ressources.
    checkboxLabel: Activer le filtrage obligatoire par espace de noms / projet
    incompatibleDescription: Le filtrage obligatoire par espace de noms / projet est incompatible avec l’actualisation manuelle et le chargement incrémentiel. L’activer les désactivera.
  advancedWorker:
    label: Web Worker WebSocket
    description: Les mises à jour de ressources envoyées à l’interface passent par WebSocket et sont traitées dans le thread de l’interface. Activez cette option pour traiter les mises à jour WebSocket du cluster dans un Web Worker, sur un thread distinct. Cela devrait améliorer la réactivité de l’interface sur les systèmes où les ressources changent souvent.
    checkboxLabel: Activer le Web Worker WebSocket avancé
  inactivity:
    title: Inactivité
    checkboxLabel: Activer l’expiration de session pour inactivité
    inputLabel: Délai d’inactivité (minutes)
    information: Pour modifier le comportement de déconnexion automatique, modifiez les délais d’expiration de l’autorisation et/ou du jeton de session (<code>auth-user-session-ttl-minutes</code> et <code>auth-token-max-ttl-minutes</code>) dans la page Paramètres.
    description: Lorsque cette option est activée et que l’utilisateur reste inactif au-delà du délai spécifié, l’interface n’actualise plus le contenu de la page et l’utilisateur doit recharger la page pour continuer.
    authUserTTL: Ce délai ne peut pas dépasser le délai de session utilisateur auth-user-session-ttl-minutes, actuellement de {current} minutes.
  serverPagination:
    label: Pagination côté serveur
    description: Par défaut, les listes récupèrent toutes les ressources et paginent (créent la page selon les paramètres de tri et de filtre) localement dans le navigateur. La pagination côté serveur déplace cette opération du navigateur vers le serveur. Cela améliore les performances de l’interface, en particulier sur les systèmes comportant beaucoup de ressources.
    applicable: La pagination côté serveur s’applique aux types de ressources
    resources:
      generic: "la plupart des ressources dans la section «\_Plus de ressources\_» du cluster"
      all: Toutes les ressources

typeDescription:
  jwt.authentication: Activez cette fonctionnalité sur un cluster pour ajouter la prise en charge de l’authentification JWT des comptes de service en aval.
  branding: La personnalisation permet aux administrateurs de rebrander globalement l’interface en personnalisant le nom du produit Rancher, le logo et les couleurs.
  compliance.cattle.io.clusterscanbenchmark: Une version de benchmark est le nom du benchmark à exécuter avec kube-bench ainsi que les paramètres de configuration valides pour ce benchmark.
  compliance.cattle.io.clusterscanprofile: Un profil est la configuration de l’analyse de conformité, c’est-à-dire les versions de benchmark à utiliser et les tests spécifiques à ignorer dans ce benchmark.
  compliance.cattle.io.clusterscan: Une analyse est créée pour déclencher une analyse de conformité sur le cluster basée sur le profil défini. Un rapport est créé une fois l’analyse terminée.
  compliance.cattle.io.clusterscanreport: Un rapport est le résultat d’une analyse de conformité du cluster.
  management.cattle.io.feature: Les indicateurs de fonctionnalité permettent d’activer ou de désactiver certaines fonctionnalités {vendor}. Les fonctionnalités désactivées par défaut doivent être considérées comme expérimentales.
  cluster.x-k8s.io.machine: Une Machine encapsule la configuration d’un nœud Kubernetes. Utilisez cette vue pour voir ce qui se passe après la mise à jour d’un cluster.
  cluster.x-k8s.io.machinedeployment: Un déploiement de machines orchestre les déploiements via des modèles sur une collection d’ensembles de machines (similaire à un Deployment). Utilisez cette vue pour voir ce qui se passe après la mise à jour d’un cluster.
  cluster.x-k8s.io.machineset: Un ensemble de machines garantit que le nombre souhaité de ressources Machine est opérationnel en permanence (similaire à un ReplicaSet). Utilisez cette vue pour voir ce qui se passe après la mise à jour d’un cluster.
  resources.cattle.io.backup: Une sauvegarde est créée pour effectuer des sauvegardes ponctuelles ou planifier des sauvegardes récurrentes basées sur un ensemble de ressources.
  resources.cattle.io.restore: Une restauration est créée pour déclencher une restauration du cluster basée sur un fichier de sauvegarde.
  resources.cattle.io.resourceset: Un ensemble de ressources définit quels CRD et ressources stocker dans la sauvegarde.
  monitoring.coreos.com.servicemonitor: Un moniteur de service définit le groupe de services et les points de terminaison que Prometheus interrogera pour collecter les métriques. C’est la méthode la plus courante pour définir la collecte de métriques.
  monitoring.coreos.com.podmonitor: Un moniteur de pod définit le groupe de pods que Prometheus interrogera pour collecter les métriques. La méthode courante consiste à utiliser des moniteurs de service, mais les moniteurs de pods permettent de gérer les situations où un moniteur de service ne fonctionnerait pas.
  monitoring.coreos.com.prometheusrule: Une ressource PrometheusRule définit des règles d’enregistrement et/ou d’alerte. Une règle d’enregistrement peut précalculer des valeurs et les sauvegarder. Les règles d’alerte permettent de définir les conditions d’envoi des notifications à AlertManager.
  monitoring.coreos.com.prometheus: Un serveur Prometheus est un déploiement Prometheus dont la configuration de scraping et les règles sont déterminées par des ServiceMonitors, PodMonitors et PrometheusRules sélectionnés, et dont les alertes seront envoyées à tous les Alertmanagers sélectionnés avec la configuration de la ressource personnalisée.
  monitoring.coreos.com.alertmanager: Un gestionnaire d’alertes est un déploiement dont la configuration est spécifiée par un secret dans le même espace de noms, qui détermine quelles alertes doivent être envoyées à quel récepteur.
  node: La ressource Nœud Kubernetes de base représente une machine virtuelle ou physique qui héberge des déploiements. Pour gérer le cycle de vie de la machine, si cela est disponible, accédez à Gestion des clusters.
  catalog.cattle.io.operation: Une opération est la liste des opérations Helm récentes appliquées au cluster.
  logging.banzaicloud.io.clusterflow: Les journaux du cluster seront collectés et enregistrés dans la sortie de cluster sélectionnée.
  logging.banzaicloud.io.clusteroutput: Une sortie de cluster définit les fournisseurs de journalisation vers lesquels les journaux peuvent être envoyés et n’est effective que si elle est déployée dans l’espace de noms de l’opérateur de journalisation.
  logging.banzaicloud.io.flow: Un flux définit quels journaux collecter et filtrer ainsi que la sortie vers laquelle les envoyer. Le flux est une ressource avec espace de noms, ce qui signifie que les journaux ne seront collectés que depuis l’espace de noms dans lequel le flux est déployé.
  logging.banzaicloud.io.output: Une sortie définit les fournisseurs de journalisation vers lesquels les journaux peuvent être envoyés. La sortie doit se trouver dans le même espace de noms que le flux qui l’utilise.
  group.principal: L’attribution de rôles globaux à un groupe ne fonctionne qu’avec les fournisseurs d’authentification externes prenant en charge les groupes. L’autorisation locale ne prend pas en charge les groupes.
  management.cattle.io.oidcclient: Ici vous pouvez ajouter des applications au fournisseur d’identité SSO de Rancher
  auditlog.cattle.io.auditpolicy: Définir des règles qui déterminent quels événements de l’API Rancher sont enregistrés et le niveau de détail qu’ils contiennent.

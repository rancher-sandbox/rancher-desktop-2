  typeDescriptions:
    apps.daemonset: DaemonSet chạy đúng một Pod trên mỗi nút đủ điều kiện. Khi có nút mới được thêm vào cụm, DaemonSet sẽ tự động triển khai lên các nút đó. Khuyến nghị cho các khối lượng công việc toàn hệ thống hoặc có thể mở rộng theo chiều dọc và không bao giờ cần nhiều hơn một Pod trên mỗi nút.
    apps.deployment: Triển khai chạy một số lượng bản sao có thể mở rộng của một Pod, phân bổ trên các nút đủ điều kiện. Các thay đổi được áp dụng dần dần và có thể hoàn nguyên về bản sửa đổi trước khi cần. Khuyến nghị cho các khối lượng công việc không trạng thái và có thể mở rộng theo chiều ngang.
    apps.statefulset: StatefulSet quản lý các ứng dụng có trạng thái và đảm bảo về thứ tự cũng như tính duy nhất của các Pod được tạo. Khuyến nghị cho các khối lượng công việc có lưu trữ bền vững hoặc có yêu cầu nghiêm ngặt về định danh, quorum hoặc thứ tự nâng cấp.
    batch.cronjob: CronJob tạo các Job, sau đó các Job này chạy Pod, theo một lịch lặp lại. Lịch được biểu thị theo định dạng cron chuẩn của Unix và dùng múi giờ của mặt phẳng điều khiển Kubernetes (thường là UTC).
    batch.job: Job tạo một hoặc nhiều Pod để thực hiện đáng tin cậy một tác vụ một lần bằng cách chạy Pod cho đến khi Pod thoát thành công. Các Pod thất bại sẽ tự động được thay thế cho đến khi đạt số lần chạy hoàn thành đã chỉ định. Job cũng có thể chạy nhiều Pod song song hoặc hoạt động như một hàng đợi công việc theo lô.
    pod: Pod là đơn vị tính toán nhỏ nhất có thể triển khai mà bạn có thể tạo và quản lý trong Kubernetes. Pod là một nhóm gồm một hoặc nhiều container, có chung tài nguyên lưu trữ và mạng, cùng với đặc tả về cách chạy các container.
  upgrading:
    activeDeadlineSeconds:
      label: Thời hạn hoạt động của Pod
      tip: Khoảng thời gian Pod có thể hoạt động trước khi hệ thống cố đánh dấu nó là thất bại và kết thúc các container liên quan.
    concurrencyPolicy:
      label: Đồng thời
      options:
        allow: Cho phép CronJob chạy đồng thời
        forbid: Bỏ qua lần chạy tiếp theo nếu lần chạy hiện tại chưa kết thúc
        replace: Thay thế lần chạy nếu lần chạy hiện tại chưa kết thúc
    maxSurge:
      label: Mức vượt tối đa
      tip: Số lượng Pod tối đa được phép vượt quá quy mô mong muốn tại bất kỳ thời điểm nào.
    maxUnavailable:

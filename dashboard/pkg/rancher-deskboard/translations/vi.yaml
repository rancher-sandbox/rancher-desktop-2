    importedDescription: Theo mặc định, Rancher cũng sẽ dùng registry này khi cài đặt các ứng dụng Helm chart chính thức của Rancher. Nếu registry trong phạm vi cụm bị tắt, các image hệ thống sẽ được pull từ registry mặc định của hệ thống trong cài đặt toàn cục.

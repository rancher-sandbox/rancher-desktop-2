advancedSettings:
  setEnv: Được đặt bằng biến môi trường
  hideShow: Ẩn/hiện cài đặt
  label: Cài đặt
  subtext: Người dùng thông thường sẽ không cần thay đổi các mục này. Hãy thận trọng, giá trị không chính xác có thể làm hỏng bản cài đặt {appName} của bạn. Các cài đặt đã được tùy chỉnh khác với mặc định sẽ được gắn thẻ ‘Đã sửa đổi’.
  show: Hiển thị
  hide: Ẩn
  none: Không có
  modified: Đã sửa đổi
  edit:
    moreActions: Thêm hành động cho cài đặt - { setting }
    label: Chỉnh sửa cài đặt
    changeSetting: 'Thay đổi cài đặt:'
    agentConfigBanner:
      text: Chỉnh sửa giá trị này sẽ không thay đổi giá trị đã đặt trong các cụm đang chạy! Để cập nhật một cụm đang chạy nhằm sử dụng các giá trị mới, hãy chỉnh sửa cụm và nhấp vào “Áp dụng cài đặt toàn cục cho Priority Class và Ngân sách gián đoạn Pod” trong tab cấu hình Tác nhân {agent}.
      cluster: Cụm
      fleet: Fleet
    trueOption: Đúng
    falseOption: Sai
    value: Giá trị
    useDefault: Dùng giá trị mặc định
    invalidJSON: JSON không hợp lệ - vui lòng kiểm tra và sửa nội dung nhập trước khi lưu
  descriptions:
    cacerts: Chứng chỉ CA cần thiết để xác minh chứng chỉ của máy chủ.
    password-min-length: Xác định số ký tự tối thiểu cần có cho mật khẩu người dùng.
    cluster-defaults: Ghi đè mặc định RKE khi tạo cụm mới.
    engine-install-url: URL cài đặt Docker engine mặc định (cho hầu hết trình điều khiển nút).
    engine-iso-url: URL cài đặt hệ điều hành mặc định (cho trình điều khiển vSphere).
    engine-newest-version: Phiên bản Docker mới nhất được hỗ trợ tại thời điểm phát hành bản này. Phiên bản Docker không thỏa mãn phạm vi Docker được hỗ trợ nhưng mới hơn phiên bản này sẽ được đánh dấu là chưa kiểm thử.
    engine-supported-range: Phạm vi semver cho các phiên bản Docker engine được hỗ trợ. Các phiên bản không thỏa mãn phạm vi này sẽ được đánh dấu là không được hỗ trợ trong giao diện.
    ingress-ip-domain: Miền DNS wildcard dùng cho tên máy chủ Ingress được tạo tự động. <ingress-name>.<namespace-name>.<ip address of ingress controller> sẽ được thêm vào miền.
    server-url: URL cài đặt {appName} mặc định. Phải là HTTPS. Tất cả các nút trong cụm của bạn phải truy cập được URL này.
    system-default-registry: Registry riêng tư dùng cho tất cả image container hệ thống Rancher. Nếu không chỉ định giá trị, registry mặc định của container runtime sẽ được sử dụng. Với Docker và containerd, mặc định là `docker.io`.
    system-default-registry-pull-secrets: Danh sách Secret pull image dùng để xác thực với registry chứa các image container hệ thống Rancher. Theo mặc định, các Secret này sẽ được sao chép vào từng namespace chart Rancher. Secret phải nằm trong namespace `cattle-system`. Secret hợp lệ đầu tiên được liệt kê ở đây sẽ được sử dụng.
    ui-dashboard-index: Vị trí index HTML cho giao diện {appName}.
    ui-offline-preferred: Kiểm soát việc tài nguyên giao diện được phục vụ cục bộ bởi container máy chủ hay từ URL từ xa được xác định trong cài đặt ui-dashboard-index. Tùy chọn `Động` sẽ sử dụng tài nguyên cục bộ trong các bản build production của {appName}.
    ui-pl: Tên công ty Private-Label.
    auth-user-info-max-age-seconds: Tuổi tối đa của token xác thực người dùng trước khi thực hiện đồng bộ tư cách thành viên nhóm của nhà cung cấp xác thực.
    auth-user-info-resync-cron: Lịch cron mặc định để đồng bộ lại tư cách thành viên nhóm của nhà cung cấp xác thực.
    cluster-template-enforcement: Người dùng không phải quản trị viên sẽ chỉ được khởi chạy cụm thông qua các mẫu RKE đã được phê duyệt trước.
    auth-user-session-idle-ttl-minutes: TTL nhàn rỗi tùy chỉnh (tính bằng phút) cho phiên xác thực người dùng. Đây là thời lượng tối đa một phiên có thể duy trì khi không có hoạt động của người dùng trong trình duyệt. Giá trị này phải nhỏ hơn "auth-user-session-ttl-minutes". Nếu "auth-user-session-idle-ttl-minutes" lớn hơn hoặc bằng "auth-user-session-ttl-minutes" thì tính năng nhàn rỗi của phiên được xem là đã tắt.
    auth-user-session-ttl-minutes: TTL tùy chỉnh (tính bằng phút) cho phiên xác thực người dùng. Đây là thời lượng tối đa một phiên có thể duy trì bất kể hoạt động của người dùng trong trình duyệt. Giá trị này phải lớn hơn "auth-user-session-idle-ttl-minutes".
    auth-token-max-ttl-minutes: TTL tối đa (tính bằng phút) cho tất cả token ngoại trừ những token do "auth-user-session-ttl-minutes" kiểm soát (token phiên người dùng). Khi đặt thành 0, token không bao giờ hết hạn.
    kubeconfig-generate-token: Tự động tạo token cho người dùng khi có yêu cầu kubeconfig.
    kubeconfig-default-token-ttl-minutes: TTL (tính bằng phút) áp dụng cho tất cả token kubeconfig. Khi đặt thành 0, token không bao giờ hết hạn.
    rke-metadata-config: Cấu hình các tham số làm mới siêu dữ liệu RKE.
    ui-banners: Biểu ngữ phân loại được dùng để hiển thị biểu ngữ cố định tùy chỉnh ở đầu trang, chân trang hoặc cả hai.
    custom-notifications: Chỉnh sửa thông báo tùy chỉnh
    ui-consent-banner: Biểu ngữ được dùng để hiển thị biểu ngữ đồng ý tùy chỉnh cho người dùng khi đăng nhập.
    ui-default-landing: Trang mặc định mà người dùng được chuyển đến sau khi đăng nhập.
    brand: Tên thư mục của giao diện thay thế được xác định trong ‘/assets/brand’
    hide-local-cluster: Ẩn cụm cục bộ
    agent-tls-mode: Xác minh chứng chỉ Rancher. Ở chế độ `strict`, các tác nhân (system, cluster, fleet, v.v.) chỉ tin cậy các bản cài đặt Rancher sử dụng chứng chỉ được ký bởi CABundle trong cài đặt `cacerts`. Khi chế độ là system-store, các tác nhân sẽ tin cậy mọi chứng chỉ được ký bởi CABundle trong kho tin cậy của hệ điều hành.
    k3s-based-upgrader-uninstall-concurrency: Xác định số lượng cụm tối đa mà Rancher có thể đồng thời gỡ cài đặt ứng dụng `rancher-k3s-upgrader` hoặc `rancher-rke2-upgrader` cũ khỏi các cụm K3s hoặc RKE2 được nhập hoặc dùng trình điều khiển nút.
    system-agent-upgrader-install-concurrency: Xác định số lượng cụm tối đa mà Rancher có thể đồng thời cài đặt các tài nguyên cần thiết để nâng cấp system-agent.
    imported-cluster-version-management: Bật quản lý phiên bản cho các cụm RKE2/K3s được nhập và cụm cục bộ nếu đó là cụm RKE2/K3s. Cài đặt quản lý phiên bản theo từng cụm sẽ ghi đè cài đặt toàn cục này ở cấp cụm. Đối với các cụm hiện có mà quản lý phiên bản cấp cụm được đặt thành ‘system-default’, việc thay đổi cờ này sẽ kích hoạt triển khai lại tác nhân cụm trong lần đối chiếu tiếp theo (mặc định là 5 phút một lần, hoặc ngay khi cụm được chỉnh sửa, tùy điều kiện nào đến trước).
    imported-cluster-day2-ops-enabled: Kiểm soát việc các cụm RKE2/K3s được nhập có bật các thao tác ngày 2 (ảnh chụp nhanh etcd, khôi phục, xoay vòng khóa mã hóa) theo mặc định hay không. Điều này sẽ ảnh hưởng đến tất cả các cụm dùng cấu hình mặc định và có thể được ghi đè ở cấp cụm.
  warnings:
    agent-tls-mode: Thay đổi cài đặt này sẽ khiến tất cả các tác nhân được triển khai lại.
  editHelp:
    ui-banners: Cài đặt này nhận một đối tượng JSON chứa 3 tham số gốc; <code>banner</code>, <code>showHeader</code>, <code>showFooter</code>. <code>banner</code> là đối tượng chứa; <code>textColor</code>, <code>background</code> và <code>text</code>, trong đó <code>textColor</code> và <code>background</code> là bất kỳ giá trị màu CSS hợp lệ nào.
  enum:

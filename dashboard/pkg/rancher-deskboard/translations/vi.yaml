typeDescription:
  jwt.authentication: Bật tính năng này trên một cụm để thêm hỗ trợ xác thực JWT cho các tài khoản dịch vụ hạ nguồn.
  branding: Thương hiệu cho phép quản trị viên đổi thương hiệu toàn cục cho giao diện bằng cách tùy chỉnh tên sản phẩm Rancher, logo và bảng màu.
  compliance.cattle.io.clusterscanbenchmark: Phiên bản benchmark là tên của benchmark cần chạy bằng kube-bench cùng với các tham số cấu hình hợp lệ cho benchmark đó.
  compliance.cattle.io.clusterscanprofile: Hồ sơ là cấu hình cho lần quét tuân thủ, gồm các phiên bản benchmark sẽ dùng và mọi bài kiểm tra cụ thể cần bỏ qua trong benchmark đó.
  compliance.cattle.io.clusterscan: Lần quét được tạo để kích hoạt quét tuân thủ trên cụm dựa trên hồ sơ đã xác định. Báo cáo được tạo sau khi quét xong.
  compliance.cattle.io.clusterscanreport: Báo cáo là kết quả của một lần quét tuân thủ trên cụm.
  management.cattle.io.feature: Cờ tính năng cho phép bật và tắt một số tính năng của {vendor}. Các tính năng tắt theo mặc định nên được xem là chức năng thử nghiệm.
  cluster.x-k8s.io.machine: Machine đóng gói cấu hình của một Nút Kubernetes. Dùng chế độ xem này để xem điều gì xảy ra sau khi cập nhật cụm.
  cluster.x-k8s.io.machinedeployment: Machine Deployment điều phối các triển khai qua mẫu trên một tập hợp Machine Set (tương tự Triển khai). Dùng chế độ xem này để xem điều gì xảy ra sau khi cập nhật cụm.
  cluster.x-k8s.io.machineset: Machine Set đảm bảo số lượng tài nguyên Machine mong muốn luôn hoạt động (tương tự ReplicaSet). Dùng chế độ xem này để xem điều gì xảy ra sau khi cập nhật cụm.
  resources.cattle.io.backup: Bản sao lưu được tạo để thực hiện sao lưu một lần hoặc lên lịch sao lưu định kỳ dựa trên một ResourceSet.
  resources.cattle.io.restore: Bản khôi phục được tạo để kích hoạt khôi phục vào cụm dựa trên một tệp sao lưu.
  resources.cattle.io.resourceset: ResourceSet xác định những CRD và tài nguyên nào cần lưu trong bản sao lưu.
  monitoring.coreos.com.servicemonitor: Service Monitor xác định nhóm dịch vụ và các điểm cuối mà Prometheus sẽ thu thập số liệu. Đây là cách phổ biến nhất để xác định việc thu thập số liệu.
  monitoring.coreos.com.podmonitor: Pod Monitor xác định nhóm Pod mà Prometheus sẽ thu thập số liệu. Cách phổ biến là dùng Service Monitor, nhưng Pod Monitor cho phép bạn xử lý mọi tình huống mà Service Monitor không hoạt động được.
  monitoring.coreos.com.prometheusrule: Tài nguyên Prometheus Rule xác định cả quy tắc ghi và/hoặc quy tắc cảnh báo. Quy tắc ghi có thể tính trước các giá trị và lưu kết quả. Quy tắc cảnh báo cho phép bạn xác định các điều kiện để gửi thông báo tới AlertManager.
  monitoring.coreos.com.prometheus: Máy chủ Prometheus là một triển khai Prometheus có cấu hình thu thập và quy tắc được xác định bởi các ServiceMonitor, PodMonitor và PrometheusRule đã chọn, và có cảnh báo được gửi tới tất cả Alertmanager đã chọn theo cấu hình của tài nguyên tùy chỉnh.
  monitoring.coreos.com.alertmanager: Alertmanager là một triển khai có cấu hình được chỉ định bởi một Secret trong cùng namespace, xác định cảnh báo nào sẽ được gửi tới bộ nhận nào.
  node: Tài nguyên Nút cơ sở của Kubernetes đại diện cho một máy ảo hoặc máy vật lý lưu trữ các triển khai. Để quản lý vòng đời máy, nếu có, hãy chuyển đến Quản lý cụm.
  catalog.cattle.io.operation: Thao tác là danh sách các thao tác Helm gần đây đã được áp dụng cho cụm.
  logging.banzaicloud.io.clusterflow: Nhật ký từ cụm sẽ được thu thập và ghi vào Cluster Output đã chọn.
  logging.banzaicloud.io.clusteroutput: Cluster Output xác định những nhà cung cấp ghi nhật ký có thể nhận nhật ký và chỉ có hiệu lực khi được triển khai trong namespace chứa logging operator.
  logging.banzaicloud.io.flow: Flow xác định những nhật ký cần thu thập và lọc, cũng như Output sẽ nhận nhật ký. Flow là tài nguyên thuộc namespace, nghĩa là nhật ký chỉ được thu thập từ namespace mà Flow được triển khai.
  logging.banzaicloud.io.output: Output xác định những nhà cung cấp ghi nhật ký có thể nhận nhật ký. Output cần nằm trong cùng namespace với Flow đang sử dụng nó.
  group.principal: Việc gán vai trò toàn cục cho nhóm chỉ hoạt động với các nhà cung cấp xác thực bên ngoài có hỗ trợ nhóm. Ủy quyền cục bộ không hỗ trợ nhóm.
  management.cattle.io.oidcclient: Tại đây bạn có thể thêm ứng dụng vào nhà cung cấp danh tính đăng nhập một lần của Rancher
  auditlog.cattle.io.auditpolicy: Xác định các quy tắc quyết định những sự kiện API Rancher nào được ghi nhật ký và mức độ chi tiết của chúng.

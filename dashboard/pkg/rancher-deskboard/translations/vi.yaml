    description: Khi bật, tài nguyên sẽ xuất hiện nhanh hơn, nhưng có thể mất thêm một chút thời gian để tải toàn bộ tập tài nguyên. Cài đặt này chỉ áp dụng cho các tài nguyên đến từ Kubernetes API
    checkboxLabel: Bật tải tăng dần
    inputLabel: Ngưỡng tài nguyên
    incompatibleDescription: Tải tăng dần không tương thích với tính năng lọc theo namespace/dự án và phân trang phía máy chủ. Bật tính năng này sẽ tắt chúng.
  manualRefresh:
    label: Làm mới thủ công
    setting: Bạn có thể cấu hình ngưỡng mà khi vượt quá, tính năng làm mới thủ công sẽ được bật.
    buttonTooltip: Làm mới danh sách
    description: Khi bật, dữ liệu danh sách sẽ không tự động cập nhật mà người dùng phải tự kích hoạt làm mới chế độ xem danh sách. Cài đặt này chỉ áp dụng cho các tài nguyên đến từ Kubernetes API
    checkboxLabel: Bật làm mới thủ công dữ liệu của danh sách
    inputLabel: Ngưỡng tài nguyên
    incompatibleDescription: Làm mới thủ công không tương thích với tính năng lọc theo namespace/dự án và phân trang phía máy chủ. Bật tính năng này sẽ tắt chúng.
  websocketNotification:
    label: Thông báo Websocket
    description: Khi được chọn, thông báo websocket sẽ không xuất hiện khi giao diện người dùng phát hiện mất kết nối.
    checkboxLabel: Tắt thông báo websocket
  gc:
    label: Thu gom rác tài nguyên
    description: Giao diện người dùng sẽ lưu tài nguyên Kubernetes vào bộ nhớ đệm cục bộ để không phải tìm nạp lại. Trong một số trường hợp, điều này có thể khiến một lượng lớn dữ liệu được lưu trong trình duyệt. Bật cài đặt này để định kỳ xóa chúng.
    checkboxLabel: Bật thu gom rác
    whenRun:
      description: Cập nhật thời điểm chạy thu gom rác
      intervalCheckBox:
        label: Chạy thu gom rác định kỳ
      interval:
        inputLabel: Chạy mỗi
      route:
        description: Chạy thu gom rác khi chuyển trang
        inputLabel: Chuyển trang
    howRun:
      description: Cập nhật cách chạy thu gom rác
      age:
        description: Các loại tài nguyên phải không được truy cập trong khoảng thời gian này mới được xem xét để thu gom rác.
        inputLabel: Tuổi tài nguyên
      count:
        description: Các loại tài nguyên phải vượt quá số lượng này mới được xem xét để thu gom rác.
        inputLabel: Số lượng tài nguyên
  nsFiltering:
    label: Yêu cầu lọc theo namespace / dự án
    description: Yêu cầu người dùng chọn namespace và/hoặc dự án. Điều này giới hạn số lượng tài nguyên được tìm nạp khi xem danh sách và sẽ giúp giao diện người dùng phản hồi tốt hơn trong các hệ thống có nhiều tài nguyên.
    checkboxLabel: Bật yêu cầu lọc theo namespace / dự án
    incompatibleDescription: Yêu cầu lọc theo namespace / dự án không tương thích với làm mới thủ công và tải tăng dần. Bật tính năng này sẽ tắt chúng.
  advancedWorker:
    label: Websocket Web Worker
    description: Các bản cập nhật tài nguyên được đẩy đến giao diện người dùng qua WebSocket và được xử lý trong luồng giao diện người dùng. Bật tùy chọn này để xử lý các bản cập nhật WebSocket của cụm trong một Web Worker ở luồng riêng. Điều này sẽ giúp giao diện người dùng phản hồi tốt hơn trong các hệ thống có tài nguyên thay đổi thường xuyên.
    checkboxLabel: Bật Websocket Web Worker nâng cao
  inactivity:
    title: Không hoạt động
    checkboxLabel: Bật hết hạn phiên khi không hoạt động
    inputLabel: Thời gian chờ không hoạt động (phút)
    information: Để thay đổi hành vi tự động đăng xuất, hãy chỉnh sửa các giá trị thời gian chờ của ủy quyền và/hoặc token phiên (<code>auth-user-session-ttl-minutes</code> và <code>auth-token-max-ttl-minutes</code>) trên trang Cài đặt.
    description: Khi bật, nếu người dùng không hoạt động quá thời gian chờ đã chỉ định, giao diện người dùng sẽ không còn làm mới nội dung trang và người dùng phải tải lại trang để tiếp tục.
    authUserTTL: Thời gian chờ này không thể cao hơn thời gian chờ phiên người dùng auth-user-session-ttl-minutes, hiện là {current} phút.
  serverPagination:
    label: Phân trang phía máy chủ
    description: Theo mặc định, danh sách sẽ tìm nạp toàn bộ tài nguyên và phân trang (tạo trang theo cài đặt sắp xếp và lọc) cục bộ trong trình duyệt. Phân trang phía máy chủ chuyển việc này từ trình duyệt sang máy chủ. Điều này cải thiện hiệu năng của giao diện người dùng, đặc biệt trong các hệ thống có nhiều tài nguyên.
    applicable: Phân trang phía máy chủ áp dụng cho các loại tài nguyên
    resources:
      generic: hầu hết tài nguyên trong mục ‘Tài nguyên khác’ của cụm
      all: Tất cả tài nguyên

    hide-local-auth-provider: Kích hoạt tính năng này và bật một Nhà cung cấp xác thực sẽ ngăn người dùng đăng nhập bằng thông tin xác thực cục bộ. Nếu Nhà cung cấp gặp sự cố, sẽ không có người dùng nào đăng nhập được. Hãy đảm bảo bạn vẫn có quyền truy cập API hoặc CLI vào Rancher để tắt tính năng và lấy lại quyền truy cập. Vui lòng xem tài liệu của {vendor} về Cờ tính năng để biết thêm thông tin.

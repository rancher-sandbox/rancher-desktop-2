    header: Aprovisionamiento de clústeres
featureFlags:
  description:
    hide-local-auth-provider: Al activar esta función y habilitar un proveedor de autenticación, se impedirá que los usuarios inicien sesión con credenciales locales. En caso de fallo de un proveedor, ningún usuario podrá iniciar sesión. Asegúrese de mantener acceso por API o CLI a Rancher para deshabilitar la función y recuperar el acceso. Consulte la documentación de {vendor} sobre los indicadores de función para obtener más información.
  label: Indicadores de función
  title: ¿Está seguro?
  warning: |-
    Los indicadores de función permiten a {vendor} controlar ciertas funciones mediante indicadores.
    Las funciones que están desactivadas de forma predeterminada deben considerarse funcionalidad experimental.
    Algunas funciones requieren reiniciar el servidor de {vendor} para poder cambiarlas.
    Esto provocará una breve interrupción de la API y la interfaz de usuario, pero no afectará a los clústeres ni a las cargas de trabajo en ejecución.
  promptActivate: Confirme que desea activar el indicador de función "{flag}"
  promptDeactivate: Confirme que desea desactivar el indicador de función "{flag}"
  restartRequired: 'Nota: Actualizar este indicador de función reiniciará {vendor}'
  restart:
    title: Esperando reinicio
    wait: Esto puede tardar unos momentos
performance:
  label: Configuración de rendimiento de la interfaz de usuario
  settingName: Rendimiento
  deprecatedInactivitySetting: La configuración <i class="mr-5">"Inactividad"</i> ahora está obsoleta en favor de la <a href="{settingsPageUrl}">configuración</a>&nbsp;<i class="mr-5">auth-user-session-idle-ttl-minutes</i>.
  deprecatedForSSP: La configuración <i class="mr-5">"{setting}"</i> ahora está obsoleta y se eliminará en una versión futura.
  incrementalLoad:
    label: Carga incremental
    setting: Puede configurar el umbral a partir del cual se usará la carga incremental.
    description: Si se habilita, los recursos aparecerán más rápido, pero la carga del conjunto completo de recursos puede tardar un poco más. Esta configuración solo se aplica a los recursos que provienen de la API de Kubernetes
    checkboxLabel: Habilitar la carga incremental
    inputLabel: Umbral de recursos
    incompatibleDescription: La carga incremental no es compatible con el filtrado por espacio de nombres/proyecto ni con la paginación del lado del servidor. Si se habilita, estas opciones se deshabilitarán.
  manualRefresh:
    label: Actualización manual
    setting: Puede configurar un umbral a partir del cual se habilitará la actualización manual.
    buttonTooltip: Actualizar lista
    description: Si se habilita, los datos de las listas no se actualizarán automáticamente, sino que el usuario deberá iniciar manualmente la actualización de la vista de lista. Esta configuración solo se aplica a los recursos que provienen de la API de Kubernetes
    checkboxLabel: Habilitar la actualización manual de los datos de las listas
    inputLabel: Umbral de recursos
    incompatibleDescription: La actualización manual no es compatible con el filtrado por espacio de nombres/proyecto ni con la paginación del lado del servidor. Si se habilita, estas opciones se deshabilitarán.
  websocketNotification:
    label: Notificaciones de websocket
    description: Cuando está marcada, las notificaciones de websocket no aparecerán cuando la interfaz de usuario detecte una desconexión.
    checkboxLabel: Deshabilitar notificaciones de websocket
  gc:
    label: Recolección de basura de recursos
    description: La interfaz de usuario almacenará en caché local los recursos de Kubernetes para evitar tener que volver a obtenerlos. En algunos casos, esto puede acumular una gran cantidad de datos en el navegador. Habilite esta configuración para eliminarlos periódicamente.
    checkboxLabel: Habilitar la recolección de basura
    whenRun:
      description: Actualizar cuándo se ejecuta la recolección de basura
      intervalCheckBox:
        label: Ejecutar la recolección de basura periódicamente
      interval:
        inputLabel: Ejecutar cada
      route:
        description: Ejecutar la recolección de basura al cambiar de página
        inputLabel: Cambio de página
    howRun:
      description: Actualizar cómo se ejecuta la recolección de basura
      age:
        description: No debe haberse accedido a los tipos de recursos durante este período para que se consideren en la recolección de basura.
        inputLabel: Antigüedad del recurso
      count:
        description: Los tipos de recursos deben superar esta cantidad para que se consideren en la recolección de basura.
        inputLabel: Cantidad de recursos
  nsFiltering:
    label: Requerir el filtrado por espacio de nombres / proyecto
    description: Requiere que el usuario seleccione espacios de nombres, proyectos o ambos. Esto limita la cantidad de recursos que se obtienen al ver listas y debería mejorar la capacidad de respuesta de la interfaz de usuario en sistemas con muchos recursos.
    checkboxLabel: Habilitar el filtrado obligatorio por espacio de nombres / proyecto
    incompatibleDescription: El filtrado obligatorio por espacio de nombres / proyecto no es compatible con la actualización manual ni con la carga incremental. Si se habilita, estas opciones se deshabilitarán.
  advancedWorker:
    label: Web Worker de WebSocket
    description: Las actualizaciones de recursos que se envían a la interfaz de usuario llegan por WebSocket y se procesan en el hilo de la interfaz de usuario. Habilite esta opción para procesar las actualizaciones de WebSocket del clúster en un Web Worker, en un hilo independiente. Esto debería mejorar la capacidad de respuesta de la interfaz de usuario en sistemas donde los recursos cambian con frecuencia.
    checkboxLabel: Habilitar el Web Worker avanzado de WebSocket
  inactivity:
    title: Inactividad
    checkboxLabel: Habilitar la expiración de la sesión por inactividad
    inputLabel: Tiempo de espera de inactividad (minutos)
    information: Para cambiar el comportamiento del cierre de sesión automático, edite los valores de tiempo de espera de la autorización o del token de sesión (<code>auth-user-session-ttl-minutes</code> y <code>auth-token-max-ttl-minutes</code>) en la página de configuración.
    description: Si se habilita y el usuario permanece inactivo más allá del tiempo de espera especificado, la interfaz de usuario dejará de actualizar el contenido de la página y el usuario deberá recargarla para continuar.
    authUserTTL: Este tiempo de espera no puede ser superior al tiempo de espera de la sesión de usuario auth-user-session-ttl-minutes, que actualmente es de {current} minutos.
  serverPagination:
    label: Paginación del lado del servidor
    description: De forma predeterminada, las listas obtendrán todos los recursos y paginarán (crearán la página según la configuración de ordenación y filtro) localmente en el navegador. La paginación del lado del servidor mueve esto del navegador al servidor. Esto mejora el rendimiento de la interfaz de usuario, especialmente en sistemas con muchos recursos.
    applicable: La paginación del lado del servidor se aplica a tipos de recursos
    resources:
      generic: la mayoría de los recursos en la sección ‘Más recursos’ del clúster
      all: Todos los recursos

typeDescription:
  jwt.authentication: Habilite esta función en un clúster para agregar compatibilidad con la autenticación JWT de cuentas de servicio descendentes.
  branding: La personalización de marca permite a los administradores cambiar globalmente la interfaz de usuario personalizando el nombre del producto Rancher, los logotipos y el esquema de colores.
  compliance.cattle.io.clusterscanbenchmark: Una versión de benchmark es el nombre del benchmark que se ejecutará usando kube-bench, así como los parámetros de configuración válidos para ese benchmark.
  compliance.cattle.io.clusterscanprofile: Un perfil es la configuración para el análisis de cumplimiento, que incluye las versiones de benchmark que se usarán y las pruebas específicas que se omitirán en ese benchmark.
  compliance.cattle.io.clusterscan: Se crea un análisis para activar un análisis de cumplimiento en el clúster basado en el perfil definido. Se crea un informe una vez completado el análisis.
  compliance.cattle.io.clusterscanreport: Un informe es el resultado de un análisis de cumplimiento del clúster.
  management.cattle.io.feature: Los indicadores de función permiten activar o desactivar ciertas funciones de {vendor}. Las funciones desactivadas de forma predeterminada deben considerarse funcionalidad experimental.
  cluster.x-k8s.io.machine: Una máquina encapsula la configuración de un nodo de Kubernetes. Use esta vista para ver qué sucede después de actualizar un clúster.
  cluster.x-k8s.io.machinedeployment: Un Machine Deployment orquesta despliegues mediante plantillas sobre una colección de Machine Sets (similar a un Deployment). Use esta vista para ver qué sucede después de actualizar un clúster.
  cluster.x-k8s.io.machineset: Un Machine Set garantiza que el número deseado de recursos Machine estén en funcionamiento en todo momento (similar a un ReplicaSet). Use esta vista para ver qué sucede después de actualizar un clúster.
  resources.cattle.io.backup: Se crea una copia de seguridad para realizar copias únicas o programar copias recurrentes basadas en un ResourceSet.
  resources.cattle.io.restore: Se crea una restauración para activar una restauración en el clúster basada en un archivo de copia de seguridad.
  resources.cattle.io.resourceset: Un conjunto de recursos define qué CRD y recursos almacenar en la copia de seguridad.
  monitoring.coreos.com.servicemonitor: Un Service Monitor define el grupo de servicios y los endpoints de los que Prometheus recopilará métricas. Esta es la forma más común de definir la recopilación de métricas.
  monitoring.coreos.com.podmonitor: Un Pod Monitor define el grupo de pods de los que Prometheus recopilará métricas. La forma común es usar Service Monitors, pero los Pod Monitors permiten manejar cualquier situación en la que un Service Monitor no funcionaría.
  monitoring.coreos.com.prometheusrule: Un recurso PrometheusRule define reglas de grabación y/o de alerta. Una regla de grabación puede precalcular valores y guardar los resultados. Las reglas de alerta permiten definir condiciones para enviar notificaciones a AlertManager.
  monitoring.coreos.com.prometheus: Un servidor Prometheus es un despliegue de Prometheus cuya configuración de recopilación y reglas están determinadas por los ServiceMonitors, PodMonitors y PrometheusRules seleccionados, y cuyas alertas se enviarán a todos los Alertmanagers seleccionados con la configuración del recurso personalizado.
  monitoring.coreos.com.alertmanager: Un Alertmanager es un despliegue cuya configuración será especificada por un secreto en el mismo espacio de nombres, que determina qué alertas deben ir a qué receptor.
  node: El recurso base Nodo de Kubernetes representa una máquina virtual o física que aloja despliegues. Para administrar el ciclo de vida de la máquina, si está disponible, vaya a Administración de clústeres.
  catalog.cattle.io.operation: Una operación es la lista de operaciones Helm recientes que se han aplicado al clúster.
  logging.banzaicloud.io.clusterflow: Los registros del clúster se recopilarán y se enviarán a la salida de clúster seleccionada.
  logging.banzaicloud.io.clusteroutput: Una salida de clúster define qué proveedores de registro pueden recibir los registros y solo tiene efecto cuando se despliega en el espacio de nombres donde está el operador de registro.
  logging.banzaicloud.io.flow: Un flujo define qué registros recopilar y filtrar, así como a qué salida enviarlos. El flujo es un recurso de espacio de nombres, lo que significa que solo se recopilarán registros del espacio de nombres donde se despliega.
  logging.banzaicloud.io.output: Una salida define qué proveedores de registro pueden recibir los registros. La salida debe estar en el mismo espacio de nombres que el flujo que la utiliza.
  group.principal: Asignar roles globales a un grupo solo funciona con proveedores de autenticación externos que admiten grupos. La autorización local no admite grupos.
  management.cattle.io.oidcclient: Aquí puede agregar aplicaciones al proveedor de identidad de inicio de sesión único de Rancher
  auditlog.cattle.io.auditpolicy: Defina reglas que determinen qué eventos de la API de Rancher se registran y el nivel de detalle que contienen.

advancedSettings:
  setEnv: Establecido por variable de entorno
  hideShow: Ocultar/mostrar configuración
  label: Configuración
  subtext: Los usuarios habituales no necesitarán cambiar estas opciones. Proceda con precaución, los valores incorrectos pueden romper su instalación de {appName}. Las configuraciones que se han personalizado respecto a los valores predeterminados están etiquetadas como ‘Modificado’.
  show: Mostrar
  hide: Ocultar
  none: Ninguno
  modified: Modificado
  edit:
    moreActions: Más acciones para la configuración - { setting }
    label: Editar configuración
    changeSetting: 'Cambiar configuración:'
    agentConfigBanner:
      text: ¡Editar este valor no cambiará el valor establecido en los clústeres en ejecución! Para actualizar un clúster en ejecución con los nuevos valores, edite el clúster y haga clic en “Aplicar configuración global para clase de prioridad y presupuesto de interrupción de Pod” en la pestaña de configuración del agente de {agent}.
      cluster: clúster
      fleet: Fleet
    trueOption: Verdadero
    falseOption: Falso
    value: Valor
    useDefault: Usar el valor predeterminado
    invalidJSON: JSON no válido - verifique y corrija su entrada antes de guardar
  descriptions:
    cacerts: Certificados CA necesarios para verificar el certificado del servidor.
    password-min-length: Defina el número mínimo de caracteres requeridos para una contraseña de usuario.
    cluster-defaults: Anule los valores predeterminados de RKE al crear nuevos clústeres.
    engine-install-url: URL de instalación predeterminada del motor Docker (para la mayoría de los controladores de nodo).
    engine-iso-url: URL de instalación predeterminada del SO (para el controlador vSphere).
    engine-newest-version: La versión de Docker más reciente compatible en el momento de esta versión. Una versión de Docker que no cumpla el rango de Docker compatible pero sea más reciente que esta se marcará como no probada.
    engine-supported-range: Rango Semver de las versiones del motor Docker compatibles. Las versiones que no cumplan este rango se marcarán como no compatibles en la interfaz de usuario.
    ingress-ip-domain: Dominio DNS comodín para usar con nombres de host de Ingress generados automáticamente. <ingress-name>.<namespace-name>.<ip address of ingress controller> se agregará al dominio.
    server-url: URL de instalación predeterminada de {appName}. Debe ser HTTPS. Todos los nodos del clúster deben poder alcanzar esta dirección.
    system-default-registry: Registro privado que se usará para todas las imágenes de contenedores del sistema de Rancher. Si no se especifica ningún valor, se usa el registro predeterminado del entorno de ejecución de contenedores. Para Docker y containerd, el valor predeterminado es `docker.io`.
    system-default-registry-pull-secrets: Lista de secretos de descarga de imágenes para autenticarse en el registro desde el que se descargan las imágenes de contenedores del sistema de Rancher. De forma predeterminada, estos secretos se copiarán en cada espacio de nombres de chart de Rancher. Los secretos deben estar en el espacio de nombres `cattle-system`. Se utilizará el primer secreto válido de la lista.
    ui-dashboard-index: Ubicación del índice HTML para la interfaz de usuario de {appName}.
    ui-offline-preferred: Controla si los recursos de la interfaz de usuario se sirven localmente desde el contenedor del servidor o desde la URL remota definida en la configuración ui-dashboard-index. La opción `Dynamic` utilizará recursos locales en las compilaciones de producción de {appName}.
    ui-pl: Nombre de empresa para etiqueta privada.
    auth-user-info-max-age-seconds: La antigüedad máxima de los tokens de autenticación de los usuarios antes de realizar una sincronización de membresía de grupos del proveedor de autenticación.
    auth-user-info-resync-cron: Programación cron predeterminada para resincronizar membresías de grupos del proveedor de autenticación.
    cluster-template-enforcement: Los no administradores estarán restringidos a lanzar clústeres solo mediante plantillas RKE preaprobadas.
    auth-user-session-idle-ttl-minutes: TTL de inactividad personalizado (en minutos) en una sesión de autenticación de usuario. Es la duración máxima que una sesión puede permanecer activa cuando no hay actividad del usuario en un navegador. Debe ser menor que "auth-user-session-ttl-minutes". Si "auth-user-session-idle-ttl-minutes" es mayor o igual que "auth-user-session-ttl-minutes", la función de inactividad de sesión se considera desactivada.
    auth-user-session-ttl-minutes: TTL personalizado (en minutos) en una sesión de autenticación de usuario. Es la duración máxima que una sesión puede permanecer activa independientemente de la actividad del usuario en un navegador. Debe ser mayor que "auth-user-session-idle-ttl-minutes".
    auth-token-max-ttl-minutes: TTL máximo (en minutos) para todos los tokens excepto los controlados por "auth-user-session-ttl-minutes" (tokens de sesión de usuario). Cuando se establece en 0, el token nunca expira.
    kubeconfig-generate-token: Generar automáticamente tokens para los usuarios cuando se solicita un kubeconfig.
    kubeconfig-default-token-ttl-minutes: TTL (en minutos) aplicado en todos los tokens de kubeconfig. Cuando se establece en 0, el token nunca expira.
    rke-metadata-config: Configurar los parámetros de actualización de metadatos de RKE.
    ui-banners: El banner de clasificación se usa para mostrar un banner fijo personalizado en el encabezado, pie de página o ambos.
    custom-notifications: Editar notificaciones personalizadas
    ui-consent-banner: El banner se usa para mostrar un banner de consentimiento personalizado que se presenta a los usuarios durante el inicio de sesión.
    ui-default-landing: La página predeterminada a la que llegan los usuarios después de iniciar sesión.
    brand: Nombre de la carpeta para un tema alternativo definido en ‘/assets/brand’
    hide-local-cluster: Ocultar el clúster local
    agent-tls-mode: Verificación de certificados de Rancher. En modo `strict`, los agentes (system, cluster, fleet, etc.) solo confiarán en instalaciones de Rancher que usen un certificado firmado por el CABundle de la configuración `cacerts`. Cuando el modo es system-store, los agentes confiarán en cualquier certificado firmado por un CABundle del almacén de confianza del sistema operativo.
    k3s-based-upgrader-uninstall-concurrency: Define el número máximo de clústeres en los que Rancher puede desinstalar concurrentemente la aplicación heredada `rancher-k3s-upgrader` o `rancher-rke2-upgrader` de clústeres K3s o RKE2 importados o con controlador de nodo.
    system-agent-upgrader-install-concurrency: Define el número máximo de clústeres en los que Rancher puede instalar concurrentemente los recursos necesarios para actualizar system-agent.
    imported-cluster-version-management: Habilita la administración de versiones para los clústeres RKE2/K3s importados y para el clúster local si es un clúster RKE2/K3s. La configuración de administración de versiones de cada clúster prevalece sobre esta configuración global a nivel de clúster. En los clústeres existentes cuya administración de versiones a nivel de clúster esté establecida en ‘system-default’, cambiar este indicador provocará un nuevo despliegue del agente del clúster durante la siguiente reconciliación (de forma predeterminada cada 5 minutos, o en cuanto se edite el clúster, lo que ocurra primero).
    imported-cluster-day2-ops-enabled: Controla si los clústeres RKE2/K3s importados tendrán las operaciones de día 2 (instantáneas de etcd, restauraciones, rotaciones de clave de cifrado) habilitadas de forma predeterminada. Esto afectará a todos los clústeres que usen la configuración predeterminada y se puede anular a nivel de clúster.
  warnings:
    agent-tls-mode: Cambiar esta configuración provocará que todos los agentes sean redespliegados.
  editHelp:
    ui-banners: 'Esta configuración acepta un objeto JSON con 3 parámetros raíz: <code>banner</code>, <code>showHeader</code>, <code>showFooter</code>. <code>banner</code> es un objeto que contiene: <code>textColor</code>, <code>background</code> y <code>text</code>, donde <code>textColor</code> y <code>background</code> son cualquier valor de color CSS válido.'

    description: 推送到 UI 的资源更新通过 WebSocket 传入，并在 UI 线程中处理。启用此选项可在单独线程的 Web Worker 中处理集群 WebSocket 更新。这有助于提高资源频繁变化的系统中 UI 的响应速度。
    checkboxLabel: 启用高级 Websocket Web Worker
  inactivity:

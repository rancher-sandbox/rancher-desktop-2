    ingress-ip-domain: 用于自动生成 Ingress 主机名的通配符 DNS 域。<ingress-name>.<namespace-name>.<ip address of ingress controller> 会被添加到该域。
    server-url: 默认 {appName} 安装地址。必须使用 HTTPS。您集群中的所有节点都必须能够访问此地址。
    system-default-registry: 用于所有 Rancher 系统容器镜像的私有镜像仓库。如果未指定任何值，则使用容器运行时的默认镜像仓库。对于 Docker 和 containerd，默认为 `docker.io`。
    system-default-registry-pull-secrets: 用于向拉取 Rancher 系统容器镜像的镜像仓库进行身份认证的镜像拉取 Secret 列表。默认情况下，这些 Secret 会被复制到每个 Rancher Chart 命名空间中。Secret 必须位于 `cattle-system` 命名空间中。将使用此处列出的第一个有效 Secret。
    ui-dashboard-index: '{appName} UI 的 HTML 索引位置。'
    ui-offline-preferred: 控制 UI 资产是由服务器容器在本地提供，还是从 ui-dashboard-index 设置中定义的远程 URL 提供。`动态` 选项将在 {appName} 的生产版本中使用本地资产。
    ui-pl: 自有品牌公司名称。
    auth-user-info-max-age-seconds: 在同步身份认证提供商组成员身份之前，用户身份认证令牌的最长存活时间。
    auth-user-info-resync-cron: 重新同步身份认证提供商组成员身份的默认 cron 时间表。
    cluster-template-enforcement: 非管理员只能通过预先批准的 RKE 模板启动集群。
    auth-user-session-idle-ttl-minutes: 用户身份认证会话的自定义空闲 TTL（分钟）。这是浏览器中没有用户活动时会话可以保持活动的最长时间。该值应小于 "auth-user-session-ttl-minutes"。如果 "auth-user-session-idle-ttl-minutes" 大于或等于 "auth-user-session-ttl-minutes"，则视为禁用会话空闲功能。
    auth-user-session-ttl-minutes: 用户身份认证会话的自定义 TTL（单位：分钟）。这是会话可保持活动的最长时间，与用户在浏览器中的活动无关。该值应大于 "auth-user-session-idle-ttl-minutes"。
    auth-token-max-ttl-minutes: 除受 "auth-user-session-ttl-minutes" 控制的令牌（用户会话令牌）外，所有令牌的最大 TTL（单位：分钟）。如果设置为 0，则令牌永不过期。
    kubeconfig-generate-token: 请求 kubeconfig 时自动为用户生成令牌。
    kubeconfig-default-token-ttl-minutes: 应用于所有 kubeconfig 令牌的 TTL（单位：分钟）。如果设置为 0，则令牌永不过期。
    rke-metadata-config: 配置 RKE 元数据刷新参数。
    ui-banners: 分类横幅用于在页眉、页脚或两者中显示自定义的固定横幅。
    custom-notifications: 编辑自定义通知
    ui-consent-banner: 横幅用于在登录期间，向用户展示自定义同意横幅。
    ui-default-landing: 用户登录后的默认页面。
    brand: 在“/assets/brand”中定义，用于替代主题的文件夹名称
    hide-local-cluster: 隐藏 local 集群
    agent-tls-mode: Rancher 证书验证。在 `strict` 模式下，Agent（system、cluster、fleet 等）只信任所用证书由 `cacerts` 设置中的 CABundle 签名的 Rancher 安装实例。当模式为 system-store 时，Agent 将信任由操作系统信任存储中的 CABundle 签名的任何证书。
    k3s-based-upgrader-uninstall-concurrency: 定义 Rancher 可以同时从导入的或使用节点驱动的 K3s 或 RKE2 集群中卸载旧版 `rancher-k3s-upgrader` 或 `rancher-rke2-upgrader` 应用的最大集群数量。
    system-agent-upgrader-install-concurrency: 定义 Rancher 可以同时安装升级 system-agent 所需资源的最大集群数量。
    imported-cluster-version-management: 为导入的 RKE2/K3s 集群（以及 RKE2/K3s 类型的 local 集群）启用版本管理。每个集群的版本管理设置会在集群级别覆盖此全局设置。对于集群级别版本管理设置为“system-default”的现有集群，更改此开关将在下一次协调时（默认每 5 分钟一次，或在集群被编辑时，以先发生者为准）触发集群 Agent 的重新部署。
    imported-cluster-day2-ops-enabled: 控制导入的 RKE2/K3s 集群是否默认启用 Day 2 运维操作（etcd 快照、还原、加密密钥轮换）。这会影响所有使用默认配置的集群，并且可以在集群级别覆盖。
  warnings:
    agent-tls-mode: 更改此设置将导致所有 Agent 被重新部署。
  editHelp:
    ui-banners: 此设置使用包含 3 个根参数的 JSON 对象，分别是 <code>banner</code>、<code>showHeader</code> 和 <code>showFooter</code>。<code>banner</code> 是包含 <code>textColor</code>、<code>background</code> 和 <code>text</code> 的对象，其中 <code>textColor</code> 和 <code>background</code> 的值可以是任何有效的 CSS 颜色值。

typeDescription:
  jwt.authentication: 在集群上启用此功能，以支持对下游 Service Account 进行 JWT 身份认证。
  branding: 管理员可以修改 Rancher 产品名称、徽标和配色方案来全局自定义 UI 界面。
  compliance.cattle.io.clusterscanbenchmark: Benchmark 版本是使用 kube-bench 运行的 Benchmark 的名称，以及该 Benchmark 的有效配置参数。
  compliance.cattle.io.clusterscanprofile: 配置文件是合规扫描的配置，包括要使用的 Benchmark 版本以及该 Benchmark 中要跳过的特定测试。
  compliance.cattle.io.clusterscan: 创建扫描后，会根据定义的配置文件在集群上触发合规扫描。扫描完成后会生成报告。
  compliance.cattle.io.clusterscanreport: 报告是集群合规扫描的结果。
  management.cattle.io.feature: 功能开关用于打开或关闭某些 {vendor} 功能。默认关闭的功能应视为实验性功能。
  cluster.x-k8s.io.machine: 一个 Machine 封装一个 Kubernetes 节点的配置。您可以使用此视图来查看更新集群后的情况。
  cluster.x-k8s.io.machinedeployment: Machine Deployment 通过使用模板，在一组 Machine Set（与 Deployment 类似）上编排部署。您可以使用此视图来查看更新集群后的情况。
  cluster.x-k8s.io.machineset: Machine Set 确保所需数量的 Machine 始终启动并运行（与 ReplicaSet 类似）。您可以使用此视图来查看更新集群后的情况。
  resources.cattle.io.backup: 创建备份是为了基于 ResourceSet 执行一次性备份或安排重复性备份。
  resources.cattle.io.restore: 创建还原用于根据备份文件触发对集群的还原。
  resources.cattle.io.resourceset: 资源集定义要在备份中存储哪些 CRD 和资源。
  monitoring.coreos.com.servicemonitor: ServiceMonitor 定义了 Prometheus 要抓取指标的服务组和端点。这是定义指标采集的最常见方法。
  monitoring.coreos.com.podmonitor: PodMonitor 定义了 Prometheus 要抓取指标的 Pod 组。更为常用的是 ServiceMonitor。然而，PodMonitor 让您在 ServiceMonitor 不起作用时，处理任何其他情况。
  monitoring.coreos.com.prometheusrule: PrometheusRule 定义了记录和/或告警规则。记录规则可以预先计算值并保存结果。告警规则允许您定义向 Alertmanager 发送通知的条件。
  monitoring.coreos.com.prometheus: Prometheus 服务器是一个 Prometheus Deployment，其抓取配置和规则由选定的 ServiceMonitor、PodMonitor 和 PrometheusRule 决定，其告警将按自定义资源的配置发送给所有选定的 Alertmanager。
  monitoring.coreos.com.alertmanager: Alertmanager 是一个 Deployment。其配置由同一命名空间中的 Secret 指定，该 Secret 决定了各告警应发送给哪个接收器。
  node: Kubernetes 节点资源展示了承载 Deployment 的虚拟机或物理机。请进入"集群管理"页面管理可用节点的生命周期。
  catalog.cattle.io.operation: 最近的操作指的是最近应用于集群的一系列 Helm 操作。
  logging.banzaicloud.io.clusterflow: 集群日志将被收集并投递到选定的集群输出中。
  logging.banzaicloud.io.clusteroutput: 集群输出定义了日志可以发送到哪些日志提供商。只有部署在 Logging Operator 所在的命名空间中时，集群输出才生效。
  logging.banzaicloud.io.flow: 流定义了要收集和过滤的日志，以及日志的输出目标。流是一个命名空间资源。换言之，只有部署了该流的命名空间中的日志才能被该流收集。
  logging.banzaicloud.io.output: 输出定义了日志可以发送到哪些日志提供商。输出需要与使用它的流位于相同的命名空间中。
  group.principal: 为组分配全局角色的操作，仅适用于支持组的外部身份认证提供商。本地授权不支持组。
  management.cattle.io.oidcclient: 您可以在此处将应用添加到 Rancher 的单点登录身份提供商
  auditlog.cattle.io.auditpolicy: 定义规则，以确定记录哪些 Rancher API 事件以及记录的详细程度。

        recreate: 重新创建：终止所有 Pod，然后启动新 Pod。
        rollingUpdate: 滚动更新：创建新 Pod，直到达到最大峰值，然后再删除旧 Pod。停止的 Pod 数量不能超过最大不可用数量。

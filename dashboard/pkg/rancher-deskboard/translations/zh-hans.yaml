  serverPagination:
    label: 服务端分页
    description: 默认情况下，列表会获取所有资源，并在浏览器本地进行分页（根据排序和过滤设置生成页面）。服务端分页将此操作从浏览器移到服务器上。这可以提升 UI 性能，尤其是在资源较多的系统中。

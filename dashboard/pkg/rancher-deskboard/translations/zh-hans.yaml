    inputLabel: 闲置超时时间（分钟）
    information: 要更改自动登出行为，请在设置页面中编辑授权和/或会话令牌超时值（<code>auth-user-session-ttl-minutes</code> 和 <code>auth-token-max-ttl-minutes</code>）。
    description: 启用后，如果用户闲置时间超过指定的超时时间，UI 将不再刷新页面内容，用户必须重新加载页面才能继续。

  typeDescriptions:
    apps.daemonset: DaemonSet 在每个符合条件的节点上仅运行一个 Pod。当新节点添加到集群时，DaemonSet 会自动部署到新节点上。推荐用于全系统或可垂直扩展，且每个节点永远不需要超过一个 Pod 的工作负载。
    apps.deployment: Deployment 运行分布在符合条件的节点中的可扩展数量的 Pod 副本。变更会逐步推出，并可在需要时回滚到之前的修订版本。推荐用于无状态和水平可扩展的工作负载。
    apps.statefulset: StatefulSet 管理有状态的应用，并保证创建的 Pod 的顺序和唯一性。推荐用于具有持久化存储或严格身份、法定人数或升级顺序要求的工作负载。
    batch.cronjob: CronJob 按重复的时间表创建 Job，再由 Job 运行 Pod。该时间表以标准的 Unix cron 格式表示，并使用 Kubernetes 控制平面的时区（通常是 UTC）。
    batch.job: Job 创建一个或多个 Pod。Job 通过运行 Pod 直到其成功退出，以可靠执行一次性任务。失败的 Pod 会自动被替换，直到达到指定的完成运行次数。Job 还可以并行运行多个 Pod，或作为批处理工作队列。
    pod: Pod 是您可以在 Kubernetes 中创建和管理的最小可部署计算单元。Pod 是一组（一个或多个）容器，具有共享的存储和网络资源，以及运行这些容器的规约。
  upgrading:
    activeDeadlineSeconds:
      label: Pod 活跃期限
      tip: 系统将 Pod 判定为失败，并终止其关联容器前的等待时长。
    concurrencyPolicy:
      label: 并发
      options:
        allow: 允许 CronJob 并发运行
        forbid: 如果当前运行还没有结束，则跳过下一个运行
        replace: 如果当前运行还没有结束，则替换运行
    maxSurge:

name: Yarn Install
description: >-
  This is a composite action that does everything needed to do `yarn install`.
inputs:
  GOARCH:
    description: Target architecture
    default: amd64

runs:
  using: composite
  steps:
  - uses: $/.github/actions/setup-yarn

  - uses: $/.github/actions/setup-rdd-go

  # The mingw gcc on the Windows arm64 runners targets x86_64, so cgo cannot
  # assemble Go's own arm64 runtime with it.  The bundled clang targets arm64.
  - name: Select the arm64 C compiler
    if: runner.os == 'Windows' && inputs.GOARCH == 'arm64'
    shell: bash
    run: echo "CC=clang" >> "${GITHUB_ENV}"

  - name: Build RDD
    shell: bash
    run: make build-rdd
    working-directory: rdd
    env:
      GOARCH: ${{ inputs.GOARCH }}

  - run: yarn install --immutable
    shell: bash
    env:
      GOARCH: ${{ inputs.GOARCH }}

  - name: Fix electron sandbox
    if: runner.os == 'Linux'
    shell: bash
    run: |
      sudo chown root node_modules/electron/dist/chrome-sandbox
      sudo chmod 04755 node_modules/electron/dist/chrome-sandbox

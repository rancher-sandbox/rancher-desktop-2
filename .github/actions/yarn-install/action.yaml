name: Yarn Install
description: >-
  This is a composite action that does everything needed to do `yarn install`.
inputs:
  GOARCH:
    description: Target architecture
    default: amd64

runs:
  using: composite
  steps:
  # Set up NodeJS; for us, caching here is basically not worth it.
  - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
    with:
      node-version-file: package.json
  # Install yarn, which requires installing corepack.  We need to handle Windows
  # separately, because it falls over in git-bash.
  - if: runner.os != 'Windows'
    run: |
      npm install -g corepack
      corepack enable yarn
    shell: bash
  - if: runner.os == 'Windows'
    run: npm install -g corepack
    shell: powershell
    continue-on-error: true
  - if: runner.os == 'Windows'
    run: corepack enable --install-directory $(Split-Path (Get-Command node).Source) yarn
    shell: powershell

  - uses: $/.github/actions/setup-rdd-go

  # The mingw gcc on the Windows arm64 runners targets x86_64, so cgo cannot
  # assemble Go's own arm64 runtime with it.  The bundled clang targets arm64.
  - name: Select the arm64 C compiler
    if: runner.os == 'Windows' && inputs.GOARCH == 'arm64'
    shell: bash
    run: echo "CC=clang" >> "${GITHUB_ENV}"

  - name: Build RDD
    shell: bash
    run: make build-rdd
    working-directory: rdd
    env:
      GOARCH: ${{ inputs.GOARCH }}

  - run: yarn install --immutable
    shell: bash
    env:
      GOARCH: ${{ inputs.GOARCH }}

  - name: Fix electron sandbox
    if: runner.os == 'Linux'
    shell: bash
    run: |
      sudo chown root node_modules/electron/dist/chrome-sandbox
      sudo chmod 04755 node_modules/electron/dist/chrome-sandbox

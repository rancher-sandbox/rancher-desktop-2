name: Yarn Install
description: >-
  This is a composite action that does everything needed to do `yarn install`.
inputs:
  GOARCH:
    description: Target architecture
    default: amd64

runs:
  using: composite
  steps:
  # In case we're running on a self-hosted runner without `yarn` installed,
  # set up NodeJS, enable `yarn`, and then handle the caching.
  - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
    with:
      node-version-file: package.json
  - run: corepack enable yarn
    shell: bash
  - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
    with:
      node-version-file: package.json
      cache: yarn

  - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
    with:
      go-version-file: rdd/go.mod
      cache-dependency-path: src/go/**/go.sum

  - name: Install Windows dependencies
    if: runner.os == 'Windows'
    shell: powershell
    run: .\scripts\windows-setup.ps1 -SkipTools

  # The mingw gcc on the Windows arm64 runners targets x86_64, so cgo cannot
  # assemble Go's own arm64 runtime with it.  The bundled clang targets arm64.
  - name: Select the arm64 C compiler
    if: runner.os == 'Windows' && inputs.GOARCH == 'arm64'
    shell: bash
    run: echo "CC=clang" >> "${GITHUB_ENV}"

  - name: Build RDD
    shell: bash
    run: make build-rdd
    working-directory: rdd
    env:
      GOARCH: ${{ inputs.GOARCH }}

  - run: yarn install --immutable
    shell: bash
    env:
      GOARCH: ${{ inputs.GOARCH }}

  - name: Fix electron sandbox
    if: runner.os == 'Linux'
    shell: bash
    run: |
      sudo chown root node_modules/electron/dist/chrome-sandbox
      sudo chmod 04755 node_modules/electron/dist/chrome-sandbox

name: BATS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-paths:
    name: Check for relevant changes
    # Due to required status checks, these still need to run even if there are
    # no relevant changes.
    outputs:
      should-run: ${{ steps.check.outputs.result }}
    runs-on: ubuntu-latest
    steps:
    - id: check
      continue-on-error: true
      run: |
        set -o errexit -o pipefail -o xtrace
        if test "${{ github.event_name }}" != 'pull_request'; then
          echo "result=true" >> "$GITHUB_OUTPUT"
        elif gh pr diff --name-only "${{ github.event.pull_request.html_url }}" | grep -E '^rdd/'; then
          echo "result=true" >> "$GITHUB_OUTPUT"
        fi
      env:
        GH_TOKEN: ${{ github.token }}

  get-pr-number:
    name: Lookup Pull Request
    outputs:
      number: ${{ steps.lookup.outputs.number }}
    runs-on: ubuntu-latest
    steps:
    - id: lookup
      if: >-
        github.event_name == 'push' &&
        github.repository_owner == 'rancher-sandbox' &&
        github.ref_type == 'branch' &&
        !github.ref_protected
      shell: bash
      run: >-
        printf "number=%s\n"
        $(gh pr list
        --repo ${{ github.repository }}
        --search ${{ github.sha }}
        --json number
        --jq '.[0].number // 0')
        | tee --append "$GITHUB_OUTPUT"
      env:
        GH_TOKEN: ${{ github.token }}
  bats:
    name: BATS
    needs: [get-pr-number, check-paths]
    if: ${{ ! needs.get-pr-number.outputs.number }}
    strategy:
      fail-fast: false
      matrix:
        # Using macos-intel because macos-aarch64 does not have nested virtualization.
        runs-on:
        - macos-15-intel
        - ubuntu-latest
        - windows-latest
        # bats-app and bats-docker each run on their own runner so their VMs
        # do not collide with bats-lima's on Windows (Lima hard-codes SSH port
        # 22 per instance), and so each can grow independently of the rest of
        # the suite.
        suite:
        - bats-app
        - bats-lima
        - bats-docker
        - bats-others
    # Run on ubuntu-latest if we don't need to actually run the tests, because
    # they start faster (and are cheaper).
    runs-on: ${{ case(needs.check-paths.outputs.should-run == 'true', matrix.runs-on, 'ubuntu-latest') }}
    # Cap the job so a wedged setup or build step fails in 2h instead of
    # inheriting GitHub's 6h default. The slowest real job (macos bats-app) runs
    # ~90m, so 120m leaves margin.
    timeout-minutes: 120
    steps:
    - name: "Linux: Install prerequisites"
      if: needs.check-paths.outputs.should-run && runner.os == 'Linux'
      working-directory: ${{ runner.temp }}
      run: |
        # Enable KVM access
        test -w /dev/kvm || sudo chmod a+rwx /dev/kvm

        # Set unprivileged port start to 80
        if test $(cat /proc/sys/net/ipv4/ip_unprivileged_port_start) -gt 80; then
          sudo sh -c 'echo 80 > /proc/sys/net/ipv4/ip_unprivileged_port_start'
        fi

        # Install QEMU for Lima VM operations
        sudo apt-get update
        sudo apt-get install --yes qemu-system-x86 qemu-utils

        # Set up run-in-shell helper script (as a symlink to bash)
        mkdir -p bin
        ln -s $(which bash) bin/run-in-shell
        readlink -f bin >> "$GITHUB_PATH"

        # Install a newer version of jq
        wget --timeout=30 --tries=3 --output-document=bin/jq https://github.com/jqlang/jq/releases/download/jq-1.8.1/jq-linux-amd64
        chmod a+x bin/jq

    - name: "macOS: Install prerequisites"
      if: needs.check-paths.outputs.should-run && runner.os == 'macOS'
      working-directory: ${{ runner.temp }}
      run: |
        brew install bash coreutils make docker docker-buildx docker-compose

        # The docker formula installs only the CLI; symlink the buildx and
        # compose plugins so `docker buildx` and `docker compose` resolve.
        mkdir -p ~/.docker/cli-plugins
        ln -sf "$(brew --prefix)/opt/docker-buildx/bin/docker-buildx" ~/.docker/cli-plugins/docker-buildx
        ln -sf "$(brew --prefix)/opt/docker-compose/bin/docker-compose" ~/.docker/cli-plugins/docker-compose

        # Disable Spotlight indexing on all volumes. On macos-15-intel CI
        # runners, mds/mds_stores/mdworker_shared collectively consumed
        # ~230% CPU during BATS runs — more than two of the runner's four
        # logical cores — starving Lima's VM of the cycles it needs to
        # boot within the test timeout.
        sudo mdutil -a -i off

        # Set up run-in-shell helper script (as a symlink to bash)
        mkdir -p bin
        ln -s $(brew --prefix bash)/bin/bash bin/run-in-shell
        readlink -f bin >> "$GITHUB_PATH"

        # Use GNU make
        echo "$(brew --prefix)/opt/make/libexec/gnubin" >> "$GITHUB_PATH"

    - name: "Windows: install prerequisites"
      if: needs.check-paths.outputs.should-run && runner.os == 'Windows'
      shell: pwsh
      working-directory: ${{ runner.temp }}
      run: |
        # Stop unwanted services
        Get-Service -ErrorAction Continue -Name @('W3SVC', 'docker') |
          Stop-Service

        # Update any pre-installed WSL
        # Sometimes this fails; retry in a loop.
        do { wsl --update } while ( -not $? )
        # Setting the default version also lets WSL finish updating.
        wsl --set-default-version 2

        # Install a WSL2 distro. Lima's WSL2 driver requires at least one
        # installed distribution, even though Lima creates its own distros.
        wsl --install --no-launch --version 2 --name openSUSE openSUSE-Leap-16.0

        # Install MSYS2 packages for BATS.
        # openssh is required because Lima constructs SSH paths using cygpath
        # (/c/Users/...) which only MSYS2's ssh understands; Windows OpenSSH
        # needs native paths and fails with "No such file or directory".
        C:\msys64\usr\bin\pacman.exe --noconfirm --sync gzip jq make openbsd-netcat openssh

        # Set up MSYS2 wrapper script
        New-Item -ItemType Directory -Name bin -Force
        Get-ItemPropertyValue -Path bin -Name FullName |
          Out-File -Encoding UTF8 -Append "$env:GITHUB_PATH"

        # Set up git configuration
        git config --global --replace-all core.autocrlf false # spellchecker:ignore
        git config --global --replace-all core.eol lf # spellchecker:ignore
        git config --global --replace-all core.longpaths true # spellchecker:ignore

    - name: "Windows: write MSYS2 wrapper script"
      if: needs.check-paths.outputs.should-run && runner.os == 'Windows'
      shell: cmd /c copy {0} run-in-shell.cmd
      working-directory: ${{ runner.temp }}/bin
      run: |
        SET MSYSTEM=UCRT64
        SET CHERE_INVOKING=1
        SET MSYS2_PATH_TYPE=inherit
        C:\msys64\usr\bin\bash.exe --login -e %1
        EXIT %ERRORLEVEL%

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: needs.check-paths.outputs.should-run
      with:
        persist-credentials: false
        submodules: recursive
    - uses: $/.github/actions/setup-rdd-go
      if: needs.check-paths.outputs.should-run
      with:
        # Lint RDD writes the cache for the other platforms.
        save: ${{ matrix.runs-on == 'macos-15-intel' }}

    - name: "Windows: disable Compatibility Telemetry"
      if: needs.check-paths.outputs.should-run && runner.os == 'Windows'
      uses: $/.github/actions/disable-compat-telemetry

    - name: "Windows: WSL debugging"
      if: needs.check-paths.outputs.should-run && runner.os == 'Windows'
      shell: pwsh
      run: |
        wsl --list --verbose
        wsl --status
      continue-on-error: true

    - name: "Windows: capture machine info"
      if: needs.check-paths.outputs.should-run && runner.os == 'Windows'
      uses: $/.github/actions/windows-machine-info
      with:
        output-path: rdd/rdd-logs/_diag/machine-info.txt
      continue-on-error: true

    - name: "Windows: start typeperf sampler"
      if: needs.check-paths.outputs.should-run && runner.os == 'Windows'
      uses: $/.github/actions/windows-typeperf-sampler
      with:
        command: start
        output-dir: rdd/rdd-logs/_diag
      continue-on-error: true

    - name: "Unix: capture machine info"
      if: needs.check-paths.outputs.should-run && runner.os != 'Windows'
      uses: $/.github/actions/unix-machine-info
      with:
        output-path: rdd/rdd-logs/_diag/machine-info.txt
      continue-on-error: true

    - name: "Linux: size the app VM for the runner"
      if: needs.check-paths.outputs.should-run && runner.os == 'Linux'
      shell: bash
      run: |
        # The ubuntu runners also have 4 cores, and the host side idles at
        # the 2-vCPU default; give the QEMU guest 3 and keep one core for
        # the runner agent.
        echo "RDD_VM_CPUS=3" >> "$GITHUB_ENV"

    - name: "macOS: size the app VM for the runner"
      if: needs.check-paths.outputs.should-run && runner.os == 'macOS'
      shell: bash
      run: |
        # The 2-vCPU default starves the guest on the 4-core macos-15-intel
        # runners: both vCPUs saturate during the k3s bootstrap and container
        # creates take minutes. Give the VM all 4 cores: validation showed
        # 4 vCPUs reaching pod-Running 2-3x faster than 3 and passing even
        # the slowest runners, while the runner agent stayed scheduled
        # through 0%-idle stretches. Drop to 3 if runs start losing their
        # runner connection.
        echo "RDD_VM_CPUS=4" >> "$GITHUB_ENV"

    - name: "macOS: Give the guest the host's TSC frequency"
      if: needs.check-paths.outputs.should-run && runner.os == 'macOS'
      shell: bash
      # The runner is itself a VM, so the guest cannot calibrate its TSC and
      # falls back to the HPET, where every clock read traps out to the
      # hypervisor. tsc_early_khz= hands the kernel the frequency instead.
      # Only this runner knows its own, so no image can carry the value.
      run: |
        set -o errexit -o nounset -o pipefail
        echo "KERNEL_PARAMS=tsc_early_khz=$(( $(sysctl -n machdep.tsc.frequency) / 1000 ))" \
          >> "$GITHUB_ENV"

    - name: Configure BATS targets
      if: needs.check-paths.outputs.should-run
      shell: bash
      run: |
        case "${{ matrix.suite }}" in
          bats-app|bats-lima|bats-docker)
            echo "BATS_TARGET=${{ matrix.suite }}" >> "$GITHUB_ENV"
            ;;
          bats-others)
            echo "BATS_EXCLUDES=bats-app bats-lima bats-docker" >> "$GITHUB_ENV"
            echo "BATS_TARGET=bats-all" >> "$GITHUB_ENV"
            ;;
          *)
            echo "Unknown test suite: ${{ matrix.suite }}" >&2
            exit 1
            ;;
        esac

    # Build ahead of the test step so the timed step runs bats alone. A build
    # inside it varies with the Go cache and distorts the duration.
    - name: Build rdd
      if: needs.check-paths.outputs.should-run
      run: make build-rdd
      working-directory: rdd
      shell: run-in-shell {0}

    - name: "Unix: start resource sampler"
      if: needs.check-paths.outputs.should-run && runner.os != 'Windows'
      uses: $/.github/actions/unix-resource-sampler
      with:
        command: start
        output-dir: rdd/rdd-logs/_diag
      continue-on-error: true

    - run: make -C bats ${{ env.BATS_TARGET }} --keep-going
      if: needs.check-paths.outputs.should-run
      working-directory: rdd
      shell: run-in-shell {0}
      env:
        RDD_TRACE: true
        RDD_LOG_LEVEL: trace

    - name: "Unix: stop resource sampler"
      if: always() && needs.check-paths.outputs.should-run && runner.os != 'Windows'
      uses: $/.github/actions/unix-resource-sampler
      with:
        command: stop
        output-dir: rdd/rdd-logs/_diag
      continue-on-error: true

    - name: "macOS: Keep the distro image out of the Go cache"
      if: needs.check-paths.outputs.should-run && matrix.runs-on == 'macos-15-intel'
      shell: bash
      # The compiled pkg/embedded includes the whole distro image, and the
      # image differs on every build, so no job reuses the cached copy. Each
      # cache generation would otherwise save one more. No other file in the
      # cache comes near 100 MB.
      run: find "$(go env GOCACHE)" -type f -size +100M -delete

    - name: "macOS: Trim the Go cache"
      if: needs.check-paths.outputs.should-run && matrix.runs-on == 'macos-15-intel'
      uses: $/.github/actions/trim-go-cache

    - name: "Windows: stop typeperf sampler"
      if: always() && needs.check-paths.outputs.should-run && runner.os == 'Windows'
      uses: $/.github/actions/windows-typeperf-sampler
      with:
        command: stop
        output-dir: rdd/rdd-logs/_diag
      continue-on-error: true

    - name: Collect RDD logs
      if: always() && needs.check-paths.outputs.should-run
      shell: run-in-shell {0}
      working-directory: rdd
      run: scripts/collect-bats-logs.sh rdd-logs

    - name: Upload RDD service logs
      if: always() && needs.check-paths.outputs.should-run
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: rdd-logs-${{ matrix.runs-on }}-${{ matrix.suite }}
        path: rdd/rdd-logs/
        if-no-files-found: ignore

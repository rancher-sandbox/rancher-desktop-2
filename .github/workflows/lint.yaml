name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  get-pr-number:
    name: Lookup Pull Request
    outputs:
      number: ${{ steps.lookup.outputs.number }}
    runs-on: ubuntu-latest
    steps:
    - id: lookup
      if: >-
        github.event_name == 'push' &&
        github.repository_owner == 'rancher-sandbox' &&
        github.ref_type == 'branch' &&
        !github.ref_protected
      shell: bash
      run: >-
        printf "number=%s\n" >>"$GITHUB_OUTPUT"
        $(gh pr list
        --repo ${{ github.repository }}
        --search ${{ github.sha }}
        --json number
        --jq '.[0].number // 0')
      env:
        GH_TOKEN: ${{ github.token }}
  verify-generate:
    name: Verify generated files
    needs: get-pr-number
    runs-on: ubuntu-latest
    if: ${{ ! needs.get-pr-number.outputs.number }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: $/.github/actions/setup-rdd-go
    - run: make verify-generate
      working-directory: rdd
  lint-rdd:
    name: Lint RDD
    needs: get-pr-number
    strategy:
      matrix:
        runs-on: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.runs-on }}
    if: ${{ ! needs.get-pr-number.outputs.number }}
    steps:
    - name: "Windows: Set up line endings"
      if: runner.os == 'Windows'
      run: |
        git config --global --replace-all core.autocrlf false # spellchecker:ignore
        git config --global --replace-all core.eol lf # spellchecker:ignore
        git config --global --replace-all core.longpaths true # spellchecker:ignore
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: $/.github/actions/setup-rdd-go
      with:
        save: true
    - run: make lint-rdd
      working-directory: rdd
    # The BATS jobs build the guest binaries too, but they restore this
    # job's cache entry only on Linux and Windows.
    - name: Build the guest binaries for the Go cache
      if: runner.os != 'macOS'
      run: make guest-binaries
      working-directory: rdd
  test-rdd:
    name: RDD Unit tests
    needs: get-pr-number
    strategy:
      matrix:
        runs-on: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.runs-on }}
    if: ${{ ! needs.get-pr-number.outputs.number }}
    steps:
    - name: "Windows: Set up line endings"
      if: runner.os == 'Windows'
      run: |
        git config --global --replace-all core.autocrlf false # spellchecker:ignore
        git config --global --replace-all core.eol lf # spellchecker:ignore
        git config --global --replace-all core.longpaths true # spellchecker:ignore
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: $/.github/actions/setup-rdd-go
    - name: "macOS: Install e2fsprogs"
      if: runner.os == 'macOS'
      run: |
        brew install e2fsprogs
        echo "$(brew --prefix)/opt/e2fsprogs/sbin" >> "$GITHUB_PATH"
    - run: make test
      working-directory: rdd
      env:
        # The overlay tests that shell out to e2fsprogs skip without it. MSYS2 does
        # not package it, and Windows builds only the distro tarball, so only
        # Windows skips.
        RDD_REQUIRE_E2FSPROGS: ${{ runner.os != 'Windows' }}
  test-jest:
    name: Jest Tests
    needs: get-pr-number
    runs-on: ubuntu-latest
    if: ${{ ! needs.get-pr-number.outputs.number }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: $/.github/actions/yarn-install
    - run: yarn test:unit:jest
  test-i18n-report:
    name: Translation Checks
    needs: get-pr-number
    runs-on: ubuntu-latest
    if: ${{ ! needs.get-pr-number.outputs.number }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: src/go/i18n-report/go.mod
    - run: make test-i18n-report check-translations
  test-wix-helper:
    name: Wix Helper Tests
    needs: get-pr-number
    runs-on: windows-latest
    if: ${{ ! needs.get-pr-number.outputs.number }}
    steps:
    - name: "Windows: Set up line endings"
      run: |
        git config --global --replace-all core.autocrlf false # spellchecker:ignore
        git config --global --replace-all core.eol lf # spellchecker:ignore
        git config --global --replace-all core.longpaths true # spellchecker:ignore
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: src/go/wix-helper/go.mod
    - run: make test-wix-helper
  lint-bats:
    name: Lint BATS
    needs: get-pr-number
    runs-on: ubuntu-latest
    if: ${{ ! needs.get-pr-number.outputs.number }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        cache: false
        go-version-file: rdd/go.mod
    - run: make lint-bats
      working-directory: rdd
  lint-startup-profile:
    name: Lint Startup Profile
    needs: get-pr-number
    strategy:
      matrix:
        runs-on: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.runs-on }}
    if: ${{ ! needs.get-pr-number.outputs.number }}
    steps:
    - name: "Windows: Set up line endings"
      if: runner.os == 'Windows'
      run: |
        git config --global --replace-all core.autocrlf false # spellchecker:ignore
        git config --global --replace-all core.eol lf # spellchecker:ignore
        git config --global --replace-all core.longpaths true # spellchecker:ignore
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: src/go/startup-profile/go.mod
    - run: make lint-startup-profile
  lint-wix-helper:
    name: Lint Wix Helper
    needs: get-pr-number
    runs-on: windows-latest
    if: ${{ ! needs.get-pr-number.outputs.number }}
    steps:
    - name: "Windows: Set up line endings"
      run: |
        git config --global --replace-all core.autocrlf false # spellchecker:ignore
        git config --global --replace-all core.eol lf # spellchecker:ignore
        git config --global --replace-all core.longpaths true # spellchecker:ignore
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: src/go/wix-helper/go.mod
    - run: make lint-wix-helper
  lint-typescript:
    name: Lint TypeScript
    needs: get-pr-number
    strategy:
      matrix:
        runs-on: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.runs-on }}
    if: ${{ ! needs.get-pr-number.outputs.number }}
    steps:
    - name: "Windows: Set up line endings"
      if: runner.os == 'Windows'
      run: |
        git config --global --replace-all core.autocrlf false # spellchecker:ignore
        git config --global --replace-all core.eol lf # spellchecker:ignore
        git config --global --replace-all core.longpaths true # spellchecker:ignore
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: $/.github/actions/yarn-install
    - run: yarn lint:typescript:nofix

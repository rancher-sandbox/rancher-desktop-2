# Package Rancher Desktop.
# When this is run against the main branch or a release branch, it also triggers
# OBS packaging.  In that case:
#   - The repository variable `OBS_DEVEL_PROJECT` must be set to the name of the
#     OBS project (e.g. `isv:Rancher:dev`) to trigger OBS packaging.
#   - If the repository variable `OBS_DEPLOY_VIA_PAGES` is set to `true`, the
#     artifacts are uploaded to GitHub Pages.  This clobbers any existing pages.
#   - Otherwise, the artifacts are uploaded to S3.
#     - If this is run in the `rancher-sandbox` organization, it uses vault to
#       retrieve secrets to upload artifacts to S3.
#     - Otherwise, use the GitHub Actions secrets `AWS_ACCESS_KEY_ID` and
#       `AWS_SECRET_ACCESS_KEY` to upload artifacts to S3.
#   - After uploading artifacts, it triggers OBS packaging.
#     - In the `rancher-sandbox` organization, it uses vault to get the token.
#     - Otherwise, it uses the GitHub Actions secret `OBS_WEBHOOK_TOKEN`.
# When running against main, release branches, or tags, we also test the signing
# workflow.  Since GitHub does not have access to any of the signing secrets, a
# fake key is generated locally for testing.

name: Package

on:
  pull_request:
    paths-ignore:
    - '.github/actions/spelling/**'
    - 'docs/**'
    - '**.md'
  push:
    branches:
    - main
    - release-*
    tags:
    - '*'
  workflow_dispatch:
    inputs:
      sign:
        type: boolean
        default: true
        description: Whether to check signing result

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  check-paths:
    uses: $/.github/workflows/paths-ignore.yaml
    with:
      paths-ignore-globs: |
        .github/actions/spelling/**
        docs/**
        **.md

  # The output is platform-independent, so one job serves every package leg.
  dashboard:
    needs: check-paths
    if: needs.check-paths.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: $/.github/actions/setup-yarn
    - run: make --directory=dashboard
    - name: Upload dashboard
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dashboard
        path: rdd/pkg/steve/dashboard
        if-no-files-found: error

  package:
    needs: [check-paths, dashboard]
    if: needs.check-paths.outputs.should-run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: darwin
          arch: x86_64
          runs-on: macos-latest
        - platform: darwin
          arch: aarch64
          runs-on: macos-latest
        - platform: windows
          arch: x86_64
          runs-on: windows-latest
        - platform: windows
          arch: aarch64
          runs-on: windows-11-arm
        - platform: linux
          arch: x86_64
          runs-on: ubuntu-22.04
        - platform: linux
          arch: aarch64
          runs-on: ubuntu-22.04-arm
    runs-on: ${{ matrix.runs-on }}
    env:
      # This build ships, so it compresses the embedded distro with the
      # smallest preset; rdd/Makefile defaults to a faster one. The preset's
      # dictionary, 64 MiB at -9, is also what each of rdd's parallel decode
      # workers allocates (rdd/pkg/xz/parallel.go).
      XZ_OPTIONS: -9 --threads=0
    steps:
    - name: Set GOARCH
      run: |
        case '${{ matrix.arch }}' in
          'aarch64') echo "GOARCH=arm64" >> "${GITHUB_ENV}" ;;
          'x86_64')  echo "GOARCH=amd64" >> "${GITHUB_ENV}" ;;
          *)         echo "Unknown architecture '${{ matrix.arch }}'" >&2 ; exit 1 ;;
        esac
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        # Needed to run `git describe` to get full version info
        fetch-depth: 0
    - name: Download dashboard
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dashboard
        path: rdd/pkg/steve/dashboard
    - uses: $/.github/actions/yarn-install
      with:
        GOARCH: ${{ env.GOARCH }}
    # rdd/Makefile builds rdd without the dashboard when none is staged, so
    # fail here instead of shipping a package without it.
    - name: Check that rdd embeds the dashboard
      run: >-
        go version -m rdd/bin/rdd${{ case(matrix.platform == 'windows', '.exe', '') }}
        | grep --extended-regexp -- '-tags=(.*,)?with_dashboard(,|$)'
    - run: yarn build
    - run: yarn package
    - name: Upload RDD
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: rdd.${{ matrix.platform }}.${{ matrix.arch }}${{ case(matrix.platform == 'windows', '.exe', '') }}
        path: dist/rdd.*
        if-no-files-found: error
    - name: Upload mac disk image
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: matrix.platform == 'darwin'
      with:
        name: rancher-desktop.darwin.${{ matrix.arch }}.dmg
        path: dist/rancher-desktop-*.darwin.*.dmg
        if-no-files-found: error
    - name: Upload Windows installer
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: matrix.platform == 'windows'
      with:
        name: rancher-desktop.windows.${{ matrix.arch }}.msi
        path: dist/rancher-desktop-*.windows.*.msi
        if-no-files-found: error
    - name: Upload zip
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: rancher-desktop.${{ matrix.platform }}.${{ matrix.arch }}.zip
        path: dist/rancher-desktop-*.${{ matrix.platform }}.*.zip
        if-no-files-found: error

  obs-package-name:
    name: Package OBS artifacts
    needs: package
    runs-on: ubuntu-latest
    # `vars.OBS_DEVEL_PROJECT` is set in the repository settings; for
    # `rancher-sandbox/rancher-desktop-2`, it is `isv:Rancher:dev`.
    # This job is skipped if it is not set, which should be the default case
    # for forks.
    # Also, if `vars.OBS_DEPLOY_VIA_PAGES` is `true`, we upload our artifacts to
    # GitHub Pages instead of S3.  We do not set this in rancher-sandbox.
    if: >-
      vars.OBS_DEVEL_PROJECT != '' &&
      github.ref_type == 'branch' &&
      ( github.ref_name == 'main' || startsWith(github.ref_name, 'release-') )
    permissions: {}
    outputs:
      package_name: ${{ steps.compute-package-name.outputs.package_name }}
    steps:
    - name: Compute OBS package name and suffix
      id: compute-package-name
      run: |
        # The package name is:
        #                    package name
        #   main             `rancher-desktop-2-main`
        #   release branches `rancher-desktop-2-release-2.x`
        #
        # We also have release packages for tags, `rancher-desktop-2-x.y`;
        # They are handled by the `linux-release.yaml` workflow.

        if [[ "${GITHUB_REF_NAME}" =~ ^(release-[0-9]+\.[0-9]+) ]]; then
          package_suffix="${BASH_REMATCH[1]}"
        elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
          package_suffix="main"
        else
          echo "Unsupported release reference: ${GITHUB_REF_NAME}" >&2
          exit 1
        fi
        echo "package_name=rancher-desktop-2-${package_suffix}" >> "$GITHUB_OUTPUT"
  obs-upload-to-s3:
    name: Upload OBS artifacts to S3
    needs: obs-package-name
    if: success() && vars.OBS_DEPLOY_VIA_PAGES != 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Needed for read-vault-secrets
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: rancher-desktop.linux.*.zip
        merge-multiple: true
    - id: get-vault-secrets
      name: Read vault secrets
      if: github.repository_owner == 'rancher-sandbox'
      uses: rancher-eio/read-vault-secrets@4c8f4e741954651c502bb7739c46ae1bad26b44d # main
      with:
        secrets: |
          secret/data/github/repo/${{ github.repository }}/aws/credentials AWS_ACCESS_KEY_ID | AWS_ACCESS_KEY_ID;
          secret/data/github/repo/${{ github.repository }}/aws/credentials AWS_SECRET_ACCESS_KEY | AWS_SECRET_ACCESS_KEY
    - name: Fall back to GitHub-hosted secrets
      if: steps.get-vault-secrets.outcome == 'skipped'
      run: |
        echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:?Secret AWS_ACCESS_KEY_ID not found}" >> "$GITHUB_ENV"
        echo "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:?Secret AWS_SECRET_ACCESS_KEY not found}" >> "$GITHUB_ENV"
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    - name: Upload artifacts to S3
      run: |
        for arch in x86_64 aarch64; do
          aws s3 cp \
            rancher-desktop-*.linux.${arch}.zip \
            "s3://rancher-desktop-assets-for-obs/${PACKAGE_NAME}-linux-${arch}.zip"
        done
      env:
        AWS_DEFAULT_REGION: us-east-1
        PACKAGE_NAME: ${{ needs.obs-package-name.outputs.package_name }}
  obs-upload-to-pages:
    name: Upload OBS artifacts to GitHub Pages
    needs: obs-package-name
    if: success() && vars.OBS_DEPLOY_VIA_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write # Needed for actions/deploy-pages
      id-token: write # Needed for actions/deploy-pages
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: rancher-desktop.linux.*.zip
        merge-multiple: true
    - name: Prepare GitHub Pages for Linux artifacts
      run: |
        # Copy the Linux zip to its own directory, with a consistent name.
        mkdir -p dist/upload
        for arch in x86_64 aarch64; do
          mv rancher-desktop-*.linux.${arch}.zip "dist/upload/${PACKAGE_NAME}-linux-${arch}.zip"
        done
        # Create the artifact for use with deploying to GitHub Pages
        tar --create --dereference --hard-dereference --exclude='.[^/]*' \
          --verbose --file ${GITHUB_WORKSPACE}/deploy.tar --directory dist/upload .
      env:
        PACKAGE_NAME: ${{ needs.obs-package-name.outputs.package_name }}
    - name: Upload Linux artifacts to GitHub Pages
      # We avoid the use of actions/upload-pages-artifact because it does not
      # support `overwrite: true`, which causes issues when re-running the workflow.
      # See: https://github.com/actions/upload-pages-artifact/issues/110
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: github-pages
        path: deploy.tar
        overwrite: true
        if-no-files-found: error
    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  obs-trigger:
    name: Trigger OBS build
    needs: [ obs-package-name, obs-upload-to-s3, obs-upload-to-pages ]
    # One of the needs: must have been skipped; so we can't rely on the default
    # `success()`, as that causes this to be skipped too.
    if: >-
      (needs.obs-upload-to-pages.result == 'success' || needs.obs-upload-to-s3.result == 'success')
      && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Needed for read-value-secrets
    steps:
    - id: get-vault-secrets
      name: Read vault secrets
      if: github.repository_owner == 'rancher-sandbox'
      uses: rancher-eio/read-vault-secrets@4c8f4e741954651c502bb7739c46ae1bad26b44d # main
      with:
        secrets: |
          secret/data/github/repo/${{ github.repository }}/obs/webhook-token token | OBS_WEBHOOK_TOKEN
    - name: Fall back to GitHub-hosted secrets
      if: steps.get-vault-secrets.outcome == 'skipped'
      run: |
        echo "OBS_WEBHOOK_TOKEN=${OBS_WEBHOOK_TOKEN:?Secret OBS_WEBHOOK_TOKEN not found}" >> "$GITHUB_ENV"
      env:
        OBS_WEBHOOK_TOKEN: ${{ secrets.OBS_WEBHOOK_TOKEN }}
    - name: Trigger OBS build
      run: |
        # Trigger OBS services for relevant package in dev channel.
        curl --request POST --fail-with-body \
          --header "Authorization: Token ${OBS_WEBHOOK_TOKEN}" \
          "https://api.opensuse.org/trigger/runservice?project=${OBS_DEVEL_PROJECT}&package=${PACKAGE_NAME}"
      env:
        OBS_DEVEL_PROJECT: ${{ vars.OBS_DEVEL_PROJECT }} # Per-repo, e.g. `isv:Rancher:dev`.
        PACKAGE_NAME: ${{ needs.obs-package-name.outputs.package_name }}

  sign-win:
    name: Test Signing (Windows)
    needs: package
    runs-on: windows-2022
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release-')) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.sign)
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: $/.github/actions/yarn-install
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      name: Download artifact
      with:
        name: rancher-desktop.windows.x86_64.zip
    - name: Generate test signing certificate
      shell: powershell
      run: |
        $cert = New-SelfSignedCertificate `
          -Type Custom `
          -Subject "CN=Rancher-Sandbox, C=CA" `
          -KeyUsage DigitalSignature `
          -CertStoreLocation Cert:\CurrentUser\My `
          -FriendlyName "Rancher-Sandbox Code Signing" `
          -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
        Write-Output $cert
        Write-Output "CSC_FINGERPRINT=$($cert.Thumbprint)" `
          | Out-File -Append -Encoding ASCII "${env:GITHUB_ENV}"
      timeout-minutes: 1
    - name: Sign artifact
      shell: powershell
      run: yarn sign (Get-Item "rancher-desktop-*.windows.*.zip")
      timeout-minutes: 10
    - name: Verify installer signature
      shell: powershell
      run: |
        $usedCert = (Get-AuthenticodeSignature -FilePath 'dist\rancher-desktop-*.windows.*.msi').SignerCertificate
        Write-Output $usedCert
        if ($usedCert.Thumbprint -ne $env:CSC_FINGERPRINT) {
          Throw "Installer signed with wrong certificate"
        }
      timeout-minutes: 1

  sign-mac:
    name: Test Signing (macOS)
    needs: package
    strategy:
      matrix:
        include:
        - arch: aarch64
        # skip x86_64, we don't need to duplicate the testing for now.
    runs-on: macos-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release-')) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.sign)
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: $/.github/actions/yarn-install
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      name: Download artifact
      with:
        name: rancher-desktop.darwin.${{ matrix.arch }}.zip
    - name: Generate test signing certificate
      run: |
        openssl req -x509 -newkey rsa:4096 -keyout key.pem -out cert.pem \
          -keyform pem -sha256 -days 3650 -nodes -subj \
          "/C=CA/CN=RD Test Signing Key" \
          -addext keyUsage=critical,digitalSignature \
          -addext extendedKeyUsage=critical,codeSigning
        # Create a custom keychain so we can unlock it properly.
        security create-keychain -p "" tmp.keychain
        security default-keychain -d user -s tmp.keychain
        security unlock-keychain -p "" tmp.keychain
        security set-keychain-settings -u tmp.keychain # Disable keychain auto-lock
        security import key.pem -k tmp.keychain -t priv -A
        security import cert.pem -k tmp.keychain -t cert -A
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
          -k "" tmp.keychain
        # Print out the valid certificates for debugging.
        security find-identity
        # Determine the key fingerprint.
        awk_expr='/)/ { print $2 ; exit }'
        hash="$(security find-identity | awk "$awk_expr")"
        echo "CSC_FINGERPRINT=${hash}" >> "$GITHUB_ENV"
      timeout-minutes: 1
    - name: Sign artifact
      run: |
        for zip in rancher-desktop-*.darwin.*.zip; do
          echo "::group::Signing ${zip}"
          yarn sign --skip-notarize --skip-constraints "${zip}"
          echo "::endgroup::"
        done
      timeout-minutes: 15
    - name: Verify signature
      run: |
        codesign --verify --deep --strict --verbose=2 dist/*.dmg
        codesign --verify --deep --strict --verbose=2 dist/*.zip
      timeout-minutes: 5

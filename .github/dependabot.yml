version: 2
updates:

# Maintain dependencies for GitHub Actions
- package-ecosystem: "github-actions"
  directories:
  - "/"
  - "/.github/actions/*/"
  schedule:
    interval: "daily"
  cooldown:
    default-days: 7
  open-pull-requests-limit: 12
  labels: ["component/dependencies"]
  groups:
    # init and analyze share a config file and abort when their versions differ.
    codeql-action:
      patterns: ["github/codeql-action/*"]

# Maintain dependencies for npm
- package-ecosystem: "npm"
  directories:
  - "/"
  - "/.github/actions/setup-yarn"
  schedule:
    interval: "daily"
  cooldown:
    default-days: 7
  open-pull-requests-limit: 12
  labels: ["component/dependencies"]
  ignore:
  - # Needs to be updated along with NodeJS version.
    dependency-name: "@types/node"
    update-types: [version-update:semver-major]
  - # We don't utilize @rancher/shell in a meaningful way. It is safe to
    # ignore until we arrive a solution that uses it.
    dependency-name: "@rancher/shell"
    versions: [">0.1"]
  - # We are currently using @vue/cli-service which depends on an older version
    # of webpack.  Upgrading webpack past what we currently have causes
    # conflicts between the different versions of webpack.  Disable further
    # updates of webpack until we can migrate off @vue/cli-service (which is
    # unlikely to be fixed as it is in maintenance mode).
    dependency-name: "webpack"
  - # TypeScript 7 is the Go port; its npm package exports only version and
    # versionMajorMinor, so ts-loader and @typescript-eslint fail with a
    # TypeError.  Drop this rule once they support 7.x.
    dependency-name: "typescript"
    update-types: [version-update:semver-major]
  groups:
    # vue pins @vue/compiler-sfc exactly, so separate bumps break the lockfile.
    vue:
      patterns: ["vue", "@vue/compiler-sfc"]
    # These pin shared @jest/* packages exactly, so separate bumps break the
    # lockfile.
    jest:
      patterns: ["jest", "babel-jest", "@jest/environment-jsdom-abstract"]

# Maintain dependencies for Golang
- package-ecosystem: "gomod"
  directories:
  - "/src/go/*"
  - "/src/go/**/*"
  - "/scripts"
  schedule:
    interval: "daily"
  cooldown:
   default-days: 7
  open-pull-requests-limit: 12
  labels: ["component/dependencies"]
  ignore:
  - # Swagger dependencies must match whatever the CLI generate.
    dependency-name: "github.com/go-openapi/swag"
  groups:
    golang-x:
      patterns: ["golang.org/x/*"]
    k8s:
      patterns: ["k8s.io/*"]

- package-ecosystem: gomod
  directory: /rdd
  schedule:
    interval: daily
  cooldown:
    default-days: 7
  # Go marks the modules behind rdd/go.mod's `tool` directives `// indirect`,
  # and Dependabot updates only direct requirements by default. This list
  # replaces that default, so it names `direct` again. Each tool rule needs
  # `dependency-type: indirect`, because a rule without a type matches direct
  # requirements only. Keep a rule for the module of each `tool` entry,
  # except ltag, which rdd replaces with a fork.
  allow:
  - dependency-type: direct
  - dependency-name: github.com/golangci/golangci-lint/v2
    dependency-type: indirect
  - dependency-name: mvdan.cc/sh/v3
    dependency-type: indirect
  - dependency-name: sigs.k8s.io/controller-tools
    dependency-type: indirect
  ignore:
  - # etcd 3.7 regenerated its protobuf API, which kine and the embedded k8s
    # apiserver do not yet implement, so the build breaks. Allow 3.6.x patch
    # updates; drop this once kine and k8s move to 3.7.
    dependency-name: go.etcd.io/etcd/*
    update-types: [version-update:semver-minor, version-update:semver-major]
  - # Keep Steve on 0.9 to match dashboard 2.15. Steve 0.10 requires
    # Kubernetes 1.37, controller-runtime 0.25 and etcd 3.7, but rdd builds
    # against Kubernetes 1.36, controller-runtime 0.24 and etcd 3.6. Drop this
    # once the dashboard moves to 2.16.
    dependency-name: github.com/rancher/steve
    versions: [">= 0.10.0"]
  - { dependency-name: k8s.io/api }
  - { dependency-name: k8s.io/apiextensions-apiserver }
  - { dependency-name: k8s.io/apimachinery }
  - { dependency-name: k8s.io/apiserver }
  - { dependency-name: k8s.io/cli-runtime }
  - { dependency-name: k8s.io/client-go }
  - { dependency-name: k8s.io/cloud-provider }
  - { dependency-name: k8s.io/cluster-bootstrap }
  - { dependency-name: k8s.io/code-generator }
  - { dependency-name: k8s.io/component-base }
  - { dependency-name: k8s.io/component-helpers }
  - { dependency-name: k8s.io/controller-manager }
  - { dependency-name: k8s.io/cri-api }
  - { dependency-name: k8s.io/cri-client }
  - { dependency-name: k8s.io/cri-streaming }
  - { dependency-name: k8s.io/csi-translation-lib }
  - { dependency-name: k8s.io/dynamic-resource-allocation }
  - { dependency-name: k8s.io/endpointslice }
  - { dependency-name: k8s.io/externaljwt }
  - { dependency-name: k8s.io/kms }
  - { dependency-name: k8s.io/kube-aggregator }
  - { dependency-name: k8s.io/kube-controller-manager }
  - { dependency-name: k8s.io/kube-proxy }
  - { dependency-name: k8s.io/kube-scheduler }
  - { dependency-name: k8s.io/kubectl }
  - { dependency-name: k8s.io/kubelet }
  - { dependency-name: k8s.io/metrics }
  - { dependency-name: k8s.io/mount-utils }
  - { dependency-name: k8s.io/pod-security-admission }
  - { dependency-name: k8s.io/sample-apiserver }
  - { dependency-name: k8s.io/sample-cli-plugin }
  - { dependency-name: k8s.io/sample-controller }
  - { dependency-name: k8s.io/streaming }
  groups:
    etcd:
      patterns: [ go.etcd.io/etcd/* ]
    golang-x:
      patterns: [ golang.org/x/* ]

# A limit of 0 turns off version updates for the nerdctl parse-table generator
# and the WSL guest agent, so they get security updates only. Dependabot
# applies the ignore rules below to security updates too.
- package-ecosystem: gomod
  directories:
  - /rdd/pkg/nerdctlstub/generate
  - /rdd/src/wsl-guestagent
  schedule:
    interval: daily
  open-pull-requests-limit: 0
  ignore:
  - # containerd 2.2 requires runtime-spec 1.3, which turns LinuxPids.Limit
    # into a pointer. The generator compiles the guest's nerdctl, 2.1.2, and
    # that does not build against runtime-spec 1.3. Drop this rule once the
    # guest's nerdctl moves past 2.1.2 (#882).
    dependency-name: github.com/containerd/containerd/v2
    versions: [">= 2.2.0"]
  - # CNI plugins 1.10 also pulls in runtime-spec 1.3, through hcsshim and
    # cgroups. nerdctl 2.1.2 fails to build against it, and so does
    # containerd 1.7 in the guest agent. Drop this rule once the guest's
    # nerdctl moves past 2.1.2 (#882) and the guest agent moves to
    # containerd 2.x.
    dependency-name: github.com/containernetworking/plugins
    versions: [">= 1.10.0"]

# Pre-positioned: the fake-kube test fixtures are stdlib-only today, so this
# scans for any dependency they grow later.
- package-ecosystem: gomod
  directory: /rdd/bats/tests/10-cli/fake-kube
  schedule:
    interval: daily
  cooldown:
    default-days: 7
